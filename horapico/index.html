<head>
<meta charset="utf-8">

<title>Hora pico</title>
<meta name="description" content="Un café de Pekín en hora pico: grupos, turistas, pedidos largos, cuentas, vueltos y clientes muy raros, con lo visto en clase.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0d1c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hora pico">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:type" content="website">
<meta property="og:locale" content="es_AR">
<meta property="og:title" content="Hora pico">
<meta property="og:description" content="Un café de Pekín en hora pico: grupos, turistas, pedidos largos, cuentas, vueltos y clientes muy raros, con lo visto en clase.">
<meta property="og:url" content="https://repasos-chino-horapico.vercel.app/">
<meta property="og:image" content="https://repasos-chino-horapico.vercel.app/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Tilt+Neon&display=swap">
<style>
/* Mercado nocturno: noche azul tinta, faroles rojos y letreros de neón jade y oro.
   Una columna pensada para el celular; los juegos ocupan la pantalla entera.
   Tema oscuro a propósito: es un salón de juegos de noche. */
:root{
  --night:#0a0d1c; --night-2:#111631; --night-3:#1a2046; --line:#283069; --line-2:#3b4590;
  --ink:#f8f1e4; --mute:#a7aed6; --dim:#6f78ab;
  --lantern:#ff3d5c; --ember:#ff8a5c; --gold:#ffc542; --jade:#2fe3a8; --sky:#66b8ff;
  --t1:#ffd23f; --t2:#3ff0b2; --t3:#6cbcff; --t4:#ff5a7a; --t0:#bcc1e2;
  --f-neon:"Tilt Neon", "Noto Sans", system-ui, sans-serif;
  --f-ui:"Noto Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-hz:"PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif;
  --r:18px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--night)}
body{margin:0;background:var(--night);color:var(--ink);font:400 16px/1.5 var(--f-ui);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 48px;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--night)}
body.playing{overflow:hidden;overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sky{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(110% 55% at 50% -12%, color-mix(in srgb, var(--lantern) 26%, transparent), transparent 62%),
    radial-gradient(70% 45% at 105% 40%, color-mix(in srgb, var(--jade) 9%, transparent), transparent 65%),
    radial-gradient(70% 45% at -5% 75%, color-mix(in srgb, var(--sky) 8%, transparent), transparent 65%),
    var(--night)}
.wrap{max-width:560px;margin:0 auto}
.py{font-weight:700}
.hz{font-family:var(--f-hz);font-weight:500}
.w{white-space:nowrap}
.w .hz{font-size:.86em;opacity:.88;margin-left:.15em}
.mute{color:var(--mute)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lab{font:700 11.5px/1.2 var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
svg.i{width:1em;height:1em;display:inline-block;vertical-align:-.14em}

/* ---------- letrero ---------- */
.sign{position:relative;text-align:center;padding:34px 0 8px}
.sign h1{margin:0;font:400 clamp(46px, 14vw, 70px)/.95 var(--f-neon);letter-spacing:.03em;color:#ffe3e8;
  text-shadow:0 0 2px #fff, 0 0 8px var(--lantern), 0 0 20px var(--lantern), 0 0 44px color-mix(in srgb, var(--lantern) 70%, transparent)}
.sign.boot h1{animation:flicker 2.6s linear both}
.sign .arc{display:block;margin-top:6px;font:400 clamp(17px, 5.2vw, 24px)/1 var(--f-neon);letter-spacing:.62em;padding-left:.62em;color:#d9fff2;
  text-shadow:0 0 2px #fff, 0 0 8px var(--jade), 0 0 22px var(--jade)}
.sign.boot .arc{animation:flicker 2.6s .5s linear both}
.sign p{margin:16px auto 0;max-width:34ch;color:var(--mute);font-size:15px;text-wrap:balance}
.lant{position:absolute;top:-6px;width:38px;transform-origin:50% 0;animation:swing 3.4s ease-in-out infinite alternate}
.lant.l{left:2%}.lant.r{right:2%;animation-delay:-1.7s}
.lant svg{width:38px;height:92px;filter:drop-shadow(0 0 10px color-mix(in srgb, var(--lantern) 75%, transparent))}
@keyframes swing{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
@keyframes flicker{0%{opacity:0}6%{opacity:1}8%{opacity:.2}12%{opacity:1}30%{opacity:.85}32%{opacity:.15}35%{opacity:1}100%{opacity:1}}

/* ---------- ficha del jugador ---------- */
.me{margin-top:22px;padding:16px 16px 14px;border-radius:var(--r);background:linear-gradient(160deg, var(--night-3), var(--night-2));border:1px solid var(--line)}
.me .top{display:flex;align-items:flex-start;gap:12px}
.me .lv{flex:none;display:grid;place-items:center;width:58px;height:58px;border-radius:50%;border:2px solid var(--gold);
  box-shadow:0 0 14px color-mix(in srgb, var(--gold) 45%, transparent), inset 0 0 12px color-mix(in srgb, var(--gold) 25%, transparent)}
.me .lv b{font:400 26px/1 var(--f-neon);color:#fff4d6;text-shadow:0 0 8px var(--gold)}
.me .lv span{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-top:-14px}
.me .who{min-width:0;flex:1}
.me .rk{font-size:19px;line-height:1.25}
.me .rk .hz{font-size:.9em}
.me .rkes{color:var(--mute);font-size:14px}
.xpbar{position:relative;height:10px;margin-top:12px;border-radius:99px;background:var(--night);border:1px solid var(--line);overflow:hidden}
.xpbar b{position:absolute;inset:0 auto 0 0;width:0;border-radius:99px;background:linear-gradient(90deg, var(--lantern), var(--gold));
  box-shadow:0 0 10px color-mix(in srgb, var(--gold) 60%, transparent);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.xpt{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;background:var(--night);border:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.chip b{font-weight:800}
.chip.fire svg{color:var(--ember)}
.chip.coin svg{color:var(--gold)}
.chip.off{opacity:.65}

/* ---------- misiones ---------- */
.sec{margin-top:26px}
.sec > .lab{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.mis{display:grid;gap:8px}
.mi{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:4px 12px;padding:11px 14px;border-radius:14px;background:var(--night-2);border:1px solid var(--line)}
.mi .ic{grid-row:1/3;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--night);border:1px solid var(--line-2);color:var(--mute)}
.mi .ic svg{width:16px;height:16px}
.mi .tx{font-size:14.5px;line-height:1.3}
.mi .rw{font-size:12.5px;color:var(--gold);white-space:nowrap}
.mi .bar{grid-column:2/4;height:5px;border-radius:9px;background:var(--night);overflow:hidden}
.mi .bar b{display:block;height:100%;background:var(--jade);border-radius:9px}
.mi.done{border-color:color-mix(in srgb, var(--jade) 50%, var(--line))}
.mi.done .ic{background:var(--jade);color:var(--night);border-color:var(--jade)}
.mi.done .tx{color:var(--mute);text-decoration:line-through;text-decoration-color:color-mix(in srgb, var(--jade) 70%, transparent)}

/* ---------- juegos ---------- */
.games{display:grid;gap:12px}
.game{position:relative;display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 14px;align-items:center;width:100%;text-align:left;
  padding:12px 14px 12px 12px;border-radius:var(--r);background:var(--night-2);border:1px solid var(--line);overflow:hidden;transition:transform .15s, border-color .15s}
.game:hover:not(:disabled){border-color:var(--line-2);transform:translateY(-1px)}
.game:active:not(:disabled){transform:scale(.985)}
.game .art{grid-row:1/4;width:96px;height:96px;border-radius:14px;overflow:hidden;background:var(--night)}
.game .art svg{width:100%;height:100%;display:block}
.game .nm{font:400 23px/1.1 var(--f-neon);letter-spacing:.01em}
.game .ds{font-size:14px;line-height:1.35;color:var(--mute)}
.game .ft{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.game .ft .st{color:var(--gold)}
.game.hot{border-color:color-mix(in srgb, var(--lantern) 55%, var(--line));box-shadow:0 0 0 1px color-mix(in srgb, var(--lantern) 25%, transparent), 0 10px 30px -12px color-mix(in srgb, var(--lantern) 55%, transparent)}
.game:disabled{cursor:default}
.game .soon{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);border:1px solid color-mix(in srgb, var(--gold) 50%, transparent);border-radius:99px;padding:3px 8px}
.game:disabled .art,.game:disabled .nm,.game:disabled .ds{opacity:.55}

.foot{margin-top:28px;display:grid;gap:10px}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.tg{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:99px;background:var(--night-2);border:1px solid var(--line);font-size:14px}
.tg[aria-pressed="false"]{color:var(--dim)}
.tg svg{width:16px;height:16px}
.status{font-size:13px;color:var(--dim);line-height:1.5}
.status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dim);margin-right:6px;vertical-align:1px}
.status .dot.on{background:var(--jade);box-shadow:0 0 8px var(--jade)}

/* ---------- menú de un juego ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;display:flex;align-items:center;gap:10px;padding:12px 0 10px;background:var(--night)}
.back{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--night-2);border-radius:99px;padding:7px 13px 7px 9px;font-size:14.5px}
.back svg{width:18px;height:18px}
.topbar .coins{margin-left:auto}
.ghead{margin-top:6px;text-align:center}
.ghead h2{margin:0;font:400 clamp(34px, 10vw, 46px)/1 var(--f-neon);color:#fff;text-shadow:0 0 6px var(--lantern), 0 0 24px color-mix(in srgb, var(--lantern) 70%, transparent)}
.ghead p{margin:12px auto 0;max-width:38ch;color:var(--mute);text-wrap:balance}
.how{display:grid;grid-template-columns:repeat(5, minmax(0,1fr));gap:6px;margin:18px 0 0}
.how div{display:grid;justify-items:center;gap:2px;padding:10px 2px 8px;border-radius:12px;background:var(--night-2);border:1px solid var(--line);font-size:12px;color:var(--mute);text-align:center}
.how svg{width:44px;height:34px}
.how b{font-size:13px;color:var(--ink)}
.path{position:relative;display:grid;gap:10px;margin-top:22px}
.path::before{content:"";position:absolute;left:33px;top:20px;bottom:20px;width:2px;background:repeating-linear-gradient(to bottom, var(--line-2) 0 6px, transparent 6px 12px)}
.et{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:2px 14px;width:100%;text-align:left;
  padding:12px 14px 12px 10px;border-radius:16px;background:var(--night-2);border:1px solid var(--line)}
.et .ln{grid-column:1;grid-row:1/3;width:48px;height:56px;display:grid;place-items:center;position:relative}
.et .ln svg{width:40px;height:56px}
.et .ln b{position:absolute;top:21px;left:0;right:0;text-align:center;font:400 17px/1 var(--f-neon);color:#fff}
.et .nm{grid-column:2;grid-row:1;font-weight:700;font-size:16.5px;line-height:1.25}
.et .ds{grid-column:2;grid-row:2;font-size:13.5px;color:var(--mute);line-height:1.35}
.et .sc{grid-column:3;grid-row:1/3;text-align:right;font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.et .sc .stars{justify-content:flex-end}
.et.next{border-color:color-mix(in srgb, var(--lantern) 60%, var(--line));box-shadow:0 0 22px -8px color-mix(in srgb, var(--lantern) 70%, transparent)}
.et:disabled{cursor:default}
.et:disabled .ln svg{filter:grayscale(1) brightness(.45)}
.et:disabled .nm,.et:disabled .ds{color:var(--dim)}
.et .lock{width:18px;height:18px;color:var(--dim)}
.stars{display:inline-flex;gap:2px}
.stars svg{width:15px;height:15px;color:var(--line-2)}
.stars svg.on{color:var(--gold);filter:drop-shadow(0 0 4px color-mix(in srgb, var(--gold) 70%, transparent))}
.cta{display:flex;justify-content:center;margin-top:20px}
.kinds{display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:8px;margin-top:18px}
.kinds div{display:grid;gap:4px;padding:12px 12px 10px;border-radius:14px;background:var(--night-2);border:1px solid var(--line);text-align:center}
.kinds span{font-size:16px;line-height:1.4}
.kinds i{font-style:normal;color:var(--dim)}
.kinds small{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
#menu .stats{margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 26px;border-radius:99px;border:0;
  background:var(--lantern);color:#fff;font-weight:800;font-size:17px;letter-spacing:.01em;
  box-shadow:0 0 0 1px color-mix(in srgb, #fff 18%, transparent) inset, 0 8px 26px -8px color-mix(in srgb, var(--lantern) 85%, transparent)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--night-2);color:var(--ink);box-shadow:none;border:1px solid var(--line-2)}
.btn.jade{background:var(--jade);color:#04261b;box-shadow:0 8px 26px -10px color-mix(in srgb, var(--jade) 85%, transparent)}
.btn.wide{width:100%}
.note{margin-top:16px;padding:12px 14px;border-radius:14px;border:1px dashed var(--line-2);color:var(--mute);font-size:14px}

/* ---------- pantalla de juego ---------- */
#play{position:fixed;inset:0;z-index:30;background:var(--night)}
.pw{position:relative;width:min(100%, 560px);height:100%;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.hud{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top, 0px) + 10px) max(14px, env(safe-area-inset-right, 0px)) 8px max(14px, env(safe-area-inset-left, 0px))}
.hbtn{flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;border:1px solid var(--line-2);background:var(--night-2);color:var(--ink)}
.hbtn svg{width:20px;height:20px}
.hbtn.say{width:50px;height:50px;border-color:color-mix(in srgb, var(--jade) 60%, var(--line-2));color:var(--jade);box-shadow:0 0 16px -4px color-mix(in srgb, var(--jade) 60%, transparent)}
.hbtn.say svg{width:24px;height:24px}
.hbtn.say.talk{animation:talk .5s ease-in-out infinite alternate}
@keyframes talk{to{box-shadow:0 0 26px 2px color-mix(in srgb, var(--jade) 70%, transparent)}}
.hsc{min-width:0;display:grid;line-height:1}
.hsc b{font:400 30px/1 var(--f-neon);color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 0 10px color-mix(in srgb, var(--gold) 70%, transparent)}
.hsc span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-top:4px}
.hmid{flex:1;display:flex;justify-content:center;align-items:center;gap:8px;min-width:0}
.combo{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:2;pointer-events:none;font:400 20px/1 var(--f-neon);padding:6px 12px 5px;border-radius:99px;color:var(--night);background:var(--gold);box-shadow:0 0 16px color-mix(in srgb, var(--gold) 70%, transparent)}
.combo.fever{background:var(--lantern);color:#fff;box-shadow:0 0 22px var(--lantern)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.combo.pop{animation:popc .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes popc{0%{transform:translateX(-50%) scale(.6)}100%{transform:translateX(-50%) scale(1)}}
.hprog{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.hearts{display:inline-flex;gap:3px}
.hearts svg{width:18px;height:18px;color:var(--lantern);filter:drop-shadow(0 0 4px color-mix(in srgb, var(--lantern) 70%, transparent))}
.hearts svg.off{color:var(--line-2);filter:none}
.stage{position:relative;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.cap{position:absolute;left:12px;right:12px;top:42%;transform:translateY(-50%);display:grid;justify-items:center;pointer-events:none}
.card{min-width:0;max-width:100%;padding:16px 18px 14px;border-radius:18px;background:color-mix(in srgb, var(--night-2) 92%, transparent);border:1px solid var(--line-2);
  box-shadow:0 18px 50px -18px #000;text-align:center;animation:cardIn .28s cubic-bezier(.2,1.3,.4,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.94)}to{opacity:1;transform:none}}
.card .lab{margin-bottom:6px}
.card .big{font-size:30px;line-height:1.15;font-weight:800}
.card .big .hz{font-size:.8em;font-weight:500;margin-left:.2em}
.card .es{color:var(--mute);margin-top:2px}
.card .tip{margin-top:8px;font-size:14px;color:var(--ink);opacity:.9;max-width:34ch;text-wrap:balance}
.gl{display:flex;justify-content:center;gap:10px;margin-top:10px}
.gl div{display:grid;justify-items:center;gap:2px}
.gl svg{width:62px;height:46px}
.gl span{font-weight:700;font-size:15px}
.gl i{font-style:normal;font-size:11.5px;color:var(--mute)}
.sbar{position:absolute;left:10px;right:10px;top:8px;z-index:2;pointer-events:none;padding:10px 12px 9px;border-radius:16px;
  background:color-mix(in srgb, var(--night-2) 86%, transparent);border:1px solid var(--line-2);text-align:center;box-shadow:0 10px 30px -14px #000}
.sbar .es{font-size:15.5px;line-height:1.3;font-weight:600}
.sbar .bl{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin-top:7px}
.sbar .ck{display:inline-flex;align-items:baseline;gap:3px;padding:3px 8px;border-radius:9px;background:var(--night);border:1px solid var(--line);font-size:14px;line-height:1.3}
.sbar .ck .hz{font-size:.85em;opacity:.85}
.sbar .ck.ok{border-color:color-mix(in srgb, var(--jade) 60%, var(--line));animation:pop .3s cubic-bezier(.2,1.6,.4,1)}
.sbar .ck.bad{border-color:var(--lantern);color:#ffd0d8}
.sbar .ck.hole{min-width:38px;justify-content:center;color:var(--dim);border-style:dashed}
.sbar .full{margin-top:6px;font-size:17px;font-weight:800;line-height:1.35}
.sbar .full .hz{font-weight:500;font-size:.88em;margin-left:.2em}
.sbar.win{border-color:color-mix(in srgb, var(--gold) 70%, var(--line));box-shadow:0 0 30px -6px color-mix(in srgb, var(--gold) 70%, transparent)}
.pad.lanes{grid-template-columns:repeat(3, minmax(0,1fr))}
.lnb{position:relative;display:grid;justify-items:center;align-content:center;gap:1px;min-height:62px;padding:8px 4px;border-radius:14px;background:var(--night-2);border:1px solid var(--line);touch-action:manipulation;overflow:hidden}
.lnb .py{font-size:16px;line-height:1.2}
.lnb .hz{font-size:14px;color:var(--mute)}
.lnb.on{border-color:var(--jade);box-shadow:0 0 0 1px var(--jade) inset, 0 0 18px -6px var(--jade)}
.lnb i{position:absolute;left:0;bottom:0;height:3px;background:var(--gold);width:0}
.lnb.empty .py{color:var(--dim)}
.pad{display:grid;grid-template-columns:repeat(5, minmax(0,1fr));gap:8px;padding:8px max(14px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(14px, env(safe-area-inset-left, 0px))}
.tb{display:grid;justify-items:center;gap:1px;padding:8px 2px 6px;border-radius:14px;background:var(--night-2);border:1px solid var(--line);color:var(--ink);touch-action:manipulation;transition:transform .08s, background .15s}
.tb svg{width:46px;height:30px}
.tb b{font-size:12.5px;font-weight:700;color:var(--mute)}
.tb:active,.tb.hit{transform:scale(.93);background:var(--night-3)}
.tb.ok{border-color:var(--t2)}
.tb.off{opacity:.22;filter:saturate(.2)}
.ovl{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:24px max(18px, env(safe-area-inset-right, 0px)) 24px max(18px, env(safe-area-inset-left, 0px));
  background:color-mix(in srgb, var(--night) 78%, transparent);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.ovl .box{width:min(100%, 420px);max-height:100%;overflow:auto;padding:22px 20px 20px;border-radius:22px;background:var(--night-2);border:1px solid var(--line-2);text-align:center;
  box-shadow:0 24px 70px -20px #000;animation:cardIn .3s cubic-bezier(.2,1.3,.4,1) both}
.ovl h3{margin:0;font:400 30px/1.1 var(--f-neon);color:#fff;text-shadow:0 0 14px color-mix(in srgb, var(--lantern) 70%, transparent)}
.ovl p{margin:10px 0 0;color:var(--mute);text-wrap:balance}
.ovl .acts{display:grid;gap:10px;margin-top:18px}
.ovl .how{margin-top:14px}
.count{font:400 120px/1 var(--f-neon);color:#fff;text-shadow:0 0 12px var(--gold), 0 0 40px var(--gold);animation:countIn .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes countIn{from{opacity:0;transform:scale(1.8)}to{opacity:1;transform:none}}


/* ---------- café ---------- */
.pad.cafe{display:flex;flex-direction:column;gap:7px;height:clamp(250px, 40vh, 340px);overflow-y:auto}
.copts{display:grid;gap:8px}
.copt{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;width:100%;min-height:48px;padding:9px 14px;text-align:left;border-radius:14px;
  background:var(--night-2);border:1px solid var(--line-2);font-size:17px;line-height:1.3;touch-action:manipulation}
.copt .hz{font-size:.88em;color:var(--mute)}
.copt:active{transform:scale(.98)}
.copt.ok{border-color:var(--jade);background:color-mix(in srgb, var(--jade) 14%, var(--night-2))}
.copt.bad{border-color:var(--lantern);background:color-mix(in srgb, var(--lantern) 14%, var(--night-2))}
.cask{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);text-align:center}
.shelf{display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:6px}
.dk{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:2px 6px;min-height:54px;padding:5px 8px 5px 5px;border-radius:12px;
  background:var(--night-2);border:1px solid var(--line);text-align:left;touch-action:manipulation}
.dk svg{grid-row:1/3;width:32px;height:32px}
.dk .py{font-size:13px;line-height:1.15;overflow-wrap:normal;word-break:keep-all}
.dk .hz{font-size:12.5px;color:var(--mute);line-height:1.1}
.dk:active{transform:scale(.96)}
.dk.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.dk:disabled{opacity:.45}
.dk:disabled::after{content:"méiyǒu 没有";position:absolute;left:3px;top:50%;transform:translateY(-50%) rotate(-12deg);font-size:9.5px;color:#fff;font-weight:800;background:var(--lantern);padding:1px 4px;border-radius:5px}
.mstrip{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.mstrip span{display:inline-flex;align-items:center;gap:3px;padding:1px 7px 1px 2px;border-radius:99px;background:var(--night-2);border:1px solid var(--line);font-size:12px;line-height:1.2}
.mstrip span span{padding:0;border:0;background:none}
.mstrip svg{width:18px;height:18px}
.mstrip .hz{font-size:.9em;color:var(--mute)}
.mstrip .out{opacity:.5;text-decoration:line-through;text-decoration-color:var(--lantern)}
.tray{display:flex;align-items:center;gap:8px;min-height:46px}
.tray .slot{flex:1;display:flex;flex-wrap:wrap;gap:6px;min-width:0;color:var(--dim);font-size:13.5px}
.tray .slot button{display:inline-flex;align-items:center;gap:5px;padding:4px 10px 4px 4px;border-radius:99px;background:var(--night-3);border:1px solid var(--line-2);font-size:13.5px}
.tray .slot svg{width:26px;height:26px}
.tray .btn{min-height:44px;padding:8px 20px;font-size:16px}
.bill{display:grid;gap:3px;padding:8px 12px;border-radius:12px;background:#f6efe2;color:#2a1d14;font-variant-numeric:tabular-nums}
.bill div{display:flex;justify-content:space-between;gap:10px;font-size:14.5px}
.bill .hz{font-size:.9em;color:#7a5b45}
.bill .tot{border-top:1px dashed #b9a48f;margin-top:3px;padding-top:4px;font-weight:800}
.bub{position:absolute;left:0;right:0;margin:0 auto;top:10px;z-index:3;max-width:calc(100% - 24px);width:max-content;padding:10px 14px 9px;border-radius:18px;
  background:#fffaf0;color:#24160e;text-align:center;box-shadow:0 10px 30px -12px #000;border:0;font-size:18px;line-height:1.3;animation:cardIn .25s cubic-bezier(.2,1.3,.4,1) both}
.bub::after{content:"";position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);border:9px solid transparent;border-bottom:0;border-top-color:#fffaf0}
.bub .py{font-weight:800}
.bub .hz{font-size:.88em;color:#8a5a3c;margin-left:.25em}
.bub .hid{color:#8a7a6c;font-size:15px}
.bub2{position:absolute;right:12px;bottom:12px;z-index:3;max-width:calc(100% - 24px);padding:9px 14px 8px;border-radius:16px;border-bottom-right-radius:4px;
  background:var(--jade);color:#04261b;font-size:16px;line-height:1.3;box-shadow:0 8px 24px -10px #000;animation:cardIn .25s cubic-bezier(.2,1.3,.4,1) both}
.bub2 .py{font-weight:800}
.bub2 .hz{font-size:.88em;margin-left:.25em;opacity:.85}
.bub2.bad{background:#2a1220;color:#ffe2e8;border:1px solid var(--lantern)}
.bub2.bad .lab{color:#ff9fb0}
.bub2 .es{display:block;font-size:13.5px;margin-top:2px;opacity:.85}
.days{display:grid;gap:10px;margin-top:20px}
.shop{display:grid;gap:8px;margin-top:10px}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:2px 12px;padding:12px 14px;border-radius:14px;background:var(--night-2);border:1px solid var(--line)}
.it b{font-size:15.5px}
.it span{grid-column:1;font-size:13.5px;color:var(--mute)}
.it .buy{grid-row:1/3;grid-column:2;min-height:40px;padding:6px 14px;font-size:14.5px;display:inline-flex;align-items:center;gap:5px}
.it .buy svg{width:16px;height:16px;color:var(--gold)}
.it.own{border-color:color-mix(in srgb, var(--jade) 50%, var(--line))}
.it.own .buy{background:transparent;color:var(--jade);box-shadow:none;border:1px solid color-mix(in srgb, var(--jade) 50%, var(--line))}
h3.sh{margin:26px 0 0;font:400 24px/1.1 var(--f-neon)}

/* ---------- resultados ---------- */
.res{padding-top:26px;text-align:center}
.res h2{margin:0;font:400 clamp(36px, 11vw, 50px)/1.05 var(--f-neon);color:#fff;text-shadow:0 0 8px var(--lantern), 0 0 30px color-mix(in srgb, var(--lantern) 70%, transparent)}
.res h2.ok{text-shadow:0 0 8px var(--jade), 0 0 30px color-mix(in srgb, var(--jade) 70%, transparent)}
.res .sub{margin-top:8px;color:var(--mute)}
.bigstars{display:flex;justify-content:center;gap:10px;margin:18px 0 4px}
.bigstars svg{width:58px;height:58px;color:var(--line-2)}
.bigstars svg.on{color:var(--gold);filter:drop-shadow(0 0 12px color-mix(in srgb, var(--gold) 80%, transparent));animation:starIn .5s cubic-bezier(.2,1.6,.4,1) both}
.bigstars svg:nth-child(2){animation-delay:.25s}.bigstars svg:nth-child(3){animation-delay:.5s}
@keyframes starIn{0%{opacity:0;transform:scale(2) rotate(-25deg)}100%{opacity:1;transform:none}}
.score{margin-top:10px;font:400 64px/1 var(--f-neon);font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 14px color-mix(in srgb, var(--gold) 70%, transparent)}
.score small{display:block;margin-top:6px;font:600 12px/1 var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);text-shadow:none}
.rec{display:inline-block;margin-top:12px;padding:5px 12px;border-radius:99px;background:var(--gold);color:var(--night);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;animation:pop .4s .6s cubic-bezier(.2,1.6,.4,1) both}
.stats{display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:8px;margin-top:20px}
.stats div{padding:10px 6px;border-radius:14px;background:var(--night-2);border:1px solid var(--line)}
.stats b{display:block;font:400 26px/1.1 var(--f-neon);font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--mute)}
.gain{margin-top:14px;padding:14px 16px;border-radius:16px;background:linear-gradient(160deg, var(--night-3), var(--night-2));border:1px solid var(--line);text-align:left}
.gain .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-variant-numeric:tabular-nums}
.gain .row b{font-size:17px}
.gain .row .plus{color:var(--gold);font-weight:800}
.gain .xpbar{margin-top:10px}
.gain .lvl{margin-top:6px;font-size:13px;color:var(--mute)}
.gain .ms{display:grid;gap:6px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.gain .ms div{display:flex;gap:8px;align-items:center;font-size:14px}
.gain .ms svg{flex:none;width:16px;height:16px;color:var(--jade)}
.ract{display:grid;gap:10px;margin-top:20px}
.review{margin-top:26px;text-align:left}
.review h3{margin:0 0 10px;font:400 24px/1.1 var(--f-neon)}
.review p.mute{margin:0 0 10px;font-size:14px}
.rv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.rv:last-child{border-bottom:1px solid var(--line)}
.rv .say{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);background:var(--night-2);color:var(--jade)}
.rv .say svg{width:18px;height:18px}
.rv .t{font-size:19px;line-height:1.25}
.rv .t .hz{font-size:.85em}
.rv .es{color:var(--mute);font-size:14px}
.rv .gls{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.rv .gls span{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--mute)}
.rv .gls svg{width:34px;height:24px}
.rv .tip{margin-top:6px;font-size:14px;line-height:1.45}
.rv .tip .py{font-weight:700}
.pair{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pair button{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;border:1px solid var(--line-2);background:var(--night-2);font-size:15px}
.pair button svg{width:16px;height:16px;color:var(--jade)}

/* ---------- subir de nivel ---------- */
.lvup{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px max(18px, env(safe-area-inset-right, 0px)) 24px max(18px, env(safe-area-inset-left, 0px));background:color-mix(in srgb, var(--night) 82%, transparent)}
.lvup canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.lvup .box{position:relative;width:min(100%, 380px);padding:26px 22px 22px;border-radius:24px;text-align:center;background:var(--night-2);border:1px solid color-mix(in srgb, var(--gold) 60%, var(--line));
  box-shadow:0 0 50px -10px color-mix(in srgb, var(--gold) 60%, transparent);animation:cardIn .4s cubic-bezier(.2,1.4,.4,1) both}
.lvup .n{font:400 92px/1 var(--f-neon);color:#fff6dc;text-shadow:0 0 12px var(--gold), 0 0 40px var(--gold)}
.lvup .t{margin-top:6px;font-size:24px;line-height:1.2}
.lvup .t .hz{font-size:.86em}
.lvup .e{color:var(--mute);margin-top:4px}

.toast{position:fixed;left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100% - 32px);bottom:calc(env(safe-area-inset-bottom, 0px) + 18px);z-index:70;
  display:flex;align-items:center;gap:8px;padding:11px 16px;border-radius:16px;background:var(--night-3);border:1px solid var(--line-2);color:var(--ink);font-size:14.5px;
  box-shadow:0 14px 40px -12px #000;opacity:0;transform:translateY(16px);transition:opacity .3s, transform .3s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.toast svg{flex:none;width:18px;height:18px;color:var(--jade)}

@media (min-width:700px){
  .sign{padding-top:46px}
  .game{grid-template-columns:110px minmax(0,1fr)}
  .game .art{width:110px;height:110px}
}
@media (max-width:360px){
  .game{grid-template-columns:76px minmax(0,1fr)}
  .game .art{width:76px;height:76px}
  .pad{gap:5px}
  .tb svg{width:38px;height:26px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

/* ================== Hora pico: lo propio del café ================== */
/* El mismo mercado nocturno del Arcade, con el cartel en ámbar: es un café abierto hasta tarde. */
:root{--amber:#ffb238;--cream:#fff4dc;--note:#e9f3dc;--note-ink:#21402a}
.sign.cafe h1{color:#fff1d6;text-shadow:0 0 2px #fff, 0 0 8px var(--amber), 0 0 22px var(--amber), 0 0 46px color-mix(in srgb, var(--lantern) 65%, transparent)}
.sign .sub2{display:block;margin-top:8px;font:400 clamp(15px, 4.4vw, 19px)/1 var(--f-neon);letter-spacing:.42em;padding-left:.42em;color:#ffe2b0;
  text-shadow:0 0 2px #fff, 0 0 8px var(--lantern), 0 0 20px var(--lantern)}
.sign.boot .sub2{animation:flicker 2.6s .6s linear both}

/* ---------- abrir el día ---------- */
.open{margin-top:20px;display:grid;gap:10px;padding:16px;border-radius:var(--r);text-align:center;
  background:radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, var(--amber) 16%, var(--night-3)), var(--night-2));border:1px solid color-mix(in srgb, var(--amber) 45%, var(--line))}
.open .lab{color:#ffd79a}
.open h2{margin:0;font:400 clamp(30px, 9vw, 40px)/1.05 var(--f-neon);color:#fff;text-shadow:0 0 12px color-mix(in srgb, var(--amber) 70%, transparent)}
.open p{margin:0;color:var(--mute);font-size:15px;text-wrap:balance}
.open .btn{justify-self:center;min-width:min(100%, 290px)}
.open .stars{justify-content:center}
.duo{display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:10px;margin-top:12px}
.tile{display:grid;gap:2px;justify-items:start;padding:12px 14px;border-radius:16px;background:var(--night-2);border:1px solid var(--line);text-align:left;min-width:0}
.tile b{font:400 21px/1.1 var(--f-neon)}
.tile span{font-size:13.5px;color:var(--mute);line-height:1.35}
.tile svg{width:22px;height:22px;color:var(--amber);margin-bottom:4px}
.tile:active{transform:scale(.98)}

/* ---------- jugando: quién habla ---------- */
.bub{left:var(--bx, 0);right:auto;margin:0}
.bub::after{left:var(--tx, 50%)}
.bub .qn{display:block;font:700 11px/1.2 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:#a0765a;margin-bottom:2px}
.bub .es{display:block;font-size:13px;color:#8a7a6c;margin-top:2px}

/* ---------- comanda, gente y estante ---------- */
.pad.cafe > *{flex-shrink:0}
.coms{display:grid;gap:4px}
.com{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;padding:6px 8px 6px 10px;border-radius:12px;background:var(--night-2);border:1px solid var(--line);font-size:14.5px;line-height:1.3}
.com i{font-style:normal;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.com .hz{font-size:.9em;color:var(--mute)}
.com .hid{color:var(--dim)}
.com button{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line-2);background:var(--night);color:var(--jade)}
.com button svg{width:16px;height:16px}
.ppl{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.pc{flex:none;display:grid;gap:3px;min-width:96px;max-width:46%;padding:6px 8px;border-radius:12px;background:var(--night-2);border:1px solid var(--line);text-align:left;font-size:13px;line-height:1.2}
.pc b{font-size:13px}
.pc.on{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset, 0 0 14px -6px var(--amber)}
.pc .got{display:flex;flex-wrap:wrap;gap:3px;min-height:24px}
.pc .got span{display:inline-flex;align-items:center;gap:2px;padding:1px 6px 1px 1px;border-radius:99px;background:var(--night-3);border:1px solid var(--line-2);font-size:11.5px}
.pc .got svg{width:20px;height:20px}
.pc .got em{font-style:normal;color:var(--dim);font-size:12px}
.dk .pr{font:800 11.5px/1 var(--f-ui);color:var(--amber);font-variant-numeric:tabular-nums;white-space:nowrap}
.dk .n{position:absolute;right:5px;top:4px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--amber);color:var(--night);font-size:12px;font-weight:800;display:grid;place-items:center}
.srow{display:flex;gap:8px;align-items:center}
/* el botón de servir queda siempre a mano, aunque la comanda sea larga */
.pad.cafe .srow{position:sticky;bottom:0;z-index:2;margin-top:auto;padding-top:8px;background:var(--night);box-shadow:0 -10px 14px -4px var(--night)}
.srow .btn{flex:1;min-height:46px;padding:8px 16px;font-size:16px}
.srow .btn.ghost{flex:none}
.hint{font-size:13px;color:var(--mute);text-align:center;line-height:1.35}
.hint b{color:var(--ink)}

/* ---------- cuenta y vuelto ---------- */
.bill .q{color:#7a5b45;font-weight:700;margin-right:4px}
.cash{display:flex;align-items:center;gap:12px;justify-content:center}
.bnote{position:relative;display:grid;place-items:center;width:132px;height:62px;border-radius:8px;background:repeating-linear-gradient(135deg, var(--note) 0 8px, #dfeccf 8px 16px);
  color:var(--note-ink);box-shadow:0 6px 18px -8px #000;border:2px solid #b8cfa4}
.bnote > b{font:400 30px/1 var(--f-neon)}
.bnote > span{position:absolute;left:8px;bottom:5px;font-size:11px;font-weight:700;line-height:1}
.bnote > span .py{font:700 11px/1 var(--f-ui)}
.bnote > span .hz{font-size:11px;margin-left:3px}
.cash .tot{font-size:15px;color:var(--mute);line-height:1.4}
.cash .tot b{color:var(--ink);font-size:17px}
.copt small{flex-basis:100%;font-size:12.5px;color:var(--mute);font-weight:500}

/* ---------- repaso del día: las frases largas (saludos a una pareja, pedidos con cantidades) tienen que poder partirse ---------- */
.rv .w, .bill .w, .tip .w{white-space:normal}
.rv .t, .rv .tip{overflow-wrap:anywhere}

/* ---------- relato ---------- */
.narr{display:grid;gap:12px;align-content:center;min-height:100%;text-align:center}
.narr p{margin:0;font-size:17px;line-height:1.45;color:var(--ink);text-wrap:balance}
.narr .lab{color:var(--amber)}
.narr .btn{justify-self:center;min-width:180px}
.spec{position:absolute;left:0;right:0;top:34%;z-index:4;display:grid;justify-items:center;pointer-events:none}
.spec div{padding:8px 16px 7px;border-radius:99px;background:var(--amber);color:var(--night);font:400 22px/1 var(--f-neon);box-shadow:0 0 30px color-mix(in srgb, var(--amber) 70%, transparent);
  animation:specIn 1.9s cubic-bezier(.2,1.2,.4,1) both}
@keyframes specIn{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.06)}20%{transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}

/* ---------- álbum ---------- */
.albtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:18px}
.albtop b{font:400 24px/1 var(--f-neon)}
.alb{display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:8px;margin-top:12px}
.ac{display:grid;gap:5px;align-content:start;justify-items:center;padding:7px 7px 9px;border-radius:14px;background:var(--night-2);border:1px solid var(--line);min-width:0;text-align:center}
.pic{width:100%;aspect-ratio:1;border-radius:11px;overflow:hidden;background:linear-gradient(170deg, #2b3570, #151a3c)}
.pic img{width:100%;height:100%;display:block}
.ac .nm{font-weight:800;font-size:12.5px;line-height:1.2;overflow-wrap:anywhere}
.ac .ds{font-size:11.5px;color:var(--dim);line-height:1.3}
.ac.sp{border-color:color-mix(in srgb, var(--amber) 45%, var(--line))}
.ac.on{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.ac.off .pic img{filter:brightness(0);opacity:.55}
.ac.off .nm{color:var(--dim)}
.ficha{display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px;align-items:start;margin-top:12px;padding:12px;border-radius:16px;background:linear-gradient(160deg, var(--night-3), var(--night-2));border:1px solid var(--line-2)}
.ficha.sp{border-color:color-mix(in srgb, var(--amber) 55%, var(--line))}
.ficha .tx{display:grid;gap:4px;min-width:0}
.ficha .nm{font:400 22px/1.1 var(--f-neon)}
.ficha .ln{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:16px;line-height:1.35}
.ficha .ln .w{white-space:normal}
.ficha .say{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line-2);background:var(--night);color:var(--jade)}
.ficha .say svg{width:16px;height:16px}
.ficha .es{font-size:13.5px;color:var(--mute)}
.ficha .ds{font-size:13.5px;line-height:1.45}
.ficha .ct{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.it .buy:disabled{opacity:.42;box-shadow:none}
.newc{margin-top:14px;padding:12px 14px;border-radius:16px;border:1px solid color-mix(in srgb, var(--amber) 50%, var(--line));background:var(--night-2);text-align:left}
.newc .lab{color:var(--amber);margin-bottom:6px}
.newc div{display:flex;flex-wrap:wrap;gap:6px}
.newc span{padding:4px 10px;border-radius:99px;background:var(--night-3);border:1px solid var(--line-2);font-size:13.5px}
@media (max-width:360px){ .duo{grid-template-columns:minmax(0,1fr)} .ficha{grid-template-columns:80px minmax(0,1fr)} }

</style>

function qtyLine(parts, mode) {
  let erDone = false;

    const it = IT[p.id];

    if (mode === 'orden') return {hz:it.hz + q.hz, py:it.py + ' ' + q.py};
    return {hz:q.hz + it.hz, py:q.py + ' ' + it.py};

    out[k] = (b && typeof b === 'object' && !Array.isArray(b) && add[k] && typeof add[k] === 'object' && !Array.isArray(add[k])) ? merge(b, add[k]) : add[k];

try { const raw = localStorage.getItem(KEY); if (raw) S = merge(fresh(), JSON.parse(raw)); } catch (e) { S = fresh(); }
/* gana el progreso más avanzado (días y plata ganada), no el más nuevo: un celular nuevo no pisa lo jugado */
const avance = s => ((s && s.dia) || 1) * 1e6 + ((s && s.ganado) || 0) + ((s && s.xp) || 0) / 1e4;

  S.t = Date.now(); dirty = true;
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  if (REF && !tmr) tmr = setTimeout(flush, 6000);
}
async function flush() {
  clearTimeout(tmr); tmr = null;

  if (saving) { again = true; return; }
  saving = true; dirty = false;
  try { await REF.set(JSON.parse(JSON.stringify(S))); }
  catch (e) {
    dirty = true;
    if (e && ['invalid_argument', 'revoked', 'not_granted', 'capability_disabled', 'capability_removed'].includes(e.code)) { REF = null; renderSync(); }
  } finally {
    saving = false;

  }
}
async function initSync() {
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    const ref = db.doc('progreso/' + uid);
    const snap = await ref.get();
    const remote = snap.exists ? snap.data() : null;
    if (remote && (avance(remote) > avance(S) || (avance(remote) === avance(S) && (remote.t || 0) > (S.t || 0)))) {
      S = merge(fresh(), JSON.parse(JSON.stringify(remote)));
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
      if (view === 'home') renderHome();
    }
    REF = ref;
    renderSync();
    if (!remote || avance(S) > avance(remote) || (avance(S) === avance(remote) && (S.t || 0) > (remote.t || 0))) { dirty = true; flush(); }
  } catch (e) { REF = null; }
}

const EXTRA = 1800;
function levelOf(xp) {
  let i = 0;
  while (i + 1 < RANG.length && xp >= RANG[i + 1].xp) i++;
  if (i === RANG.length - 1) {
    const top = RANG[i], ex = Math.floor((xp - top.xp) / EXTRA), b = top.xp + ex * EXTRA;
    return {n:RANG.length + ex, rank:top, into:xp - b, need:EXTRA, frac:(xp - b) / EXTRA, next:null};
  }
  const a = RANG[i].xp, b = RANG[i + 1].xp;
  return {n:i + 1, rank:RANG[i], into:xp - a, need:b - a, frac:(xp - a) / (b - a), next:RANG[i + 1]};
}
function rachaHoy() { const r = S.racha; if (!r.last) return 0; const d = dayDiff(r.last, today()); return d <= 1 ? r.n : 0; }
function markPlayed() {
  const d = today(), r = S.racha;
  if (r.last === d) return;
  r.n = (r.last && dayDiff(r.last, d) === 1) ? r.n + 1 : 1;
  r.last = d; r.best = Math.max(r.best || 0, r.n);
}

  {id:'saludos', ev:'saludo_ok', n:8, txt:'Saludá bien 8 veces'},

  {id:'combo', ev:'combo', n:8, max:true, txt:'Hacé un combo de 8 respuestas'},

  {id:'dias', ev:'dia', n:2, txt:'Cerrá 2 días'},
  {id:'grupos', ev:'grupo', n:3, txt:'Atendé 3 mesas de tres o más', dia:2},
  {id:'especial', ev:'especial', n:1, txt:'Atendé a un cliente especial', dia:2},
  {id:'vueltos', ev:'vuelto_ok', n:3, txt:'Dá 3 vueltos justos', dia:3},

const MIS_XP = 40, MIS_KUAI = 15, BONO_XP = 80;
function seeded(str) {
  let h = 2166136261;
  for (const ch of str) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 100000) / 100000; };
}
function genMis(d) {
  const r = seeded('hp' + d);
  const av = MIS.filter(m => (m.dia || 1) <= (S.dia || 1));
  return av.map(m => [r(), m]).sort((a, b) => a[0] - b[0]).slice(0, 3).map(x => ({id:x[1].id, p:0, done:false}));
}

  const d = today();
  if (!S.mis || S.mis.d !== d) { S.mis = {d, l:genMis(d), bonus:false}; touch(); }
}

  ensureDay();
  for (const m of S.mis.l) {
    const def = MIS.find(x => x.id === m.id);
    if (!def || def.ev !== name || m.done) continue;
    m.p = def.max ? Math.max(m.p, val) : m.p + val;
    if (m.p >= def.n) {
      m.p = def.n; m.done = true;
      S.xp += MIS_XP; S.kuai += MIS_KUAI;
      misHechas.push({txt:def.txt, xp:MIS_XP, kuai:MIS_KUAI});

  if (!S.mis.bonus && S.mis.l.length && S.mis.l.every(m => m.done)) {
    S.mis.bonus = true; S.xp += BONO_XP;

/* retratos del álbum, dibujados una vez */
const PORT = {};
function portrait(key, c) {
  if (PORT[key]) return PORT[key];
  const cv = document.createElement('canvas'); cv.width = 240; cv.height = 240;
  const g = cv.getContext('2d');
  const p = {c, look:lookOf(c), mood:'happy'};
  try { drawGuest(g, p, 120, 262, 1.18, 0.4); } catch (e) {}
  try { PORT[key] = cv.toDataURL('image/png'); } catch (e) { PORT[key] = ''; }
  return PORT[key];
}

function fireworks(cv, ms) {
  const c = cv.getContext('2d'), dpr = Math.min(2, window.devicePixelRatio || 1);
  const r = cv.getBoundingClientRect(); cv.width = r.width * dpr; cv.height = r.height * dpr;
  const parts = []; let t0 = performance.now(), last = t0, nextB = 0;
  const cols = [CSSV.gold, CSSV.lantern, CSSV.jade, CSSV.sky, '#fff'];
  const loop = now => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (now - t0 < ms && now > nextB) {
      nextB = now + 260 + Math.random() * 260;
      const x = r.width * (0.15 + Math.random() * 0.7), y = r.height * (0.12 + Math.random() * 0.35), col = pick(cols);
      for (let i = 0; i < (RM ? 18 : 60); i++) { const a = Math.random() * 6.283, v = 60 + Math.random() * 200; parts.push({x, y, vx:Math.cos(a) * v, vy:Math.sin(a) * v, l:0, m:0.9 + Math.random() * 0.7, col}); }
    }
    c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, r.width, r.height);
    c.globalCompositeOperation = 'lighter'; c.lineCap = 'round';
    for (const p of parts) { p.l += dt; p.vy += 120 * dt; p.vx *= 0.985; p.vy *= 0.985; p.x += p.vx * dt; p.y += p.vy * dt;
      c.globalAlpha = Math.max(0, 1 - p.l / p.m); c.strokeStyle = p.col; c.lineWidth = 2.2; c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03); c.stroke(); }
    for (let i = parts.length - 1; i >= 0; i--) if (parts[i].l > parts[i].m) parts.splice(i, 1);
    if (!$('#lvup').hidden && (now - t0 < ms + 1800 || parts.length)) requestAnimationFrame(loop); else c.clearRect(0, 0, r.width, r.height);
  };
  requestAnimationFrame(loop);
}

  /* ---------- el paso a paso de cada mesa ---------- */
  function go(delay) { const tok = ++G.tok; later(() => { if (tok === G.tok) runBeat(); }, delay == null ? 320 : delay); }
  function runBeat() {
    const P = G.P; if (!P || P.state !== 'here') return;
    P.bi++; P.waiting = false;
    P.people.forEach(p => { p.hold = null; });
    G.far = null;

    P.beat = b;

    },
    dice(b) { hideVendor(); pad('<div class="cask">…</div>'); talk(b.who || 0, b.key, null, () => go(250)); },
    opts(b, P) {

      const ask = () => { showOptions(b); P.waiting = true; };

      let i = 0;
      const next = () => {
        if (i >= b.lines.length) { serveMode(); return; }

        pad(`<div class="cask">${P.people.length > 1 ? 'Piden…' : 'Pide…'}</div>`);

      };
      next();
    },
    cuenta(b, P) {
      hideVendor();
      const total = totalOf(P.items);
      P.total = total; P.paid = total;
      const ask = () => {
        G.opts = shuffle(priceOpts(total, P.items.length > 1 ? P.items.map(x => ({key:`precio:${total - IT[x.id].p}`, n:total - IT[x.id].p, why:`Te faltó sumar {${IT[x.id].py}|${IT[x.id].hz}} ($${IT[x.id].p}).`})).filter(o => o.n >= 1) : null));
        const rows = P.items.map(x => `<div><span>${x.n > 1 ? `<span class="q">${x.n} ×</span>` : ''}<b>${esc(IT[x.id].py)}</b> <span class="hz" lang="zh-Hans">${esc(IT[x.id].hz)}</span></span><span>$${IT[x.id].p}${x.n > 1 ? ' c/u' : ''}</span></div>`).join('');
        const one = P.items.length === 1 && P.items[0].n === 1;
        pad(`<div class="bill">${rows}<div class="tot"><span>Total</span><span>${one ? '$' + total : '?'}</span></div></div><div class="cask">¿Cuánto es?</div><div class="copts">${G.opts.map(optBtn).join('')}</div>`);
        P.waiting = true;
      };
      pad('<div class="cask">…</div>');
      talk(0, 'cuanto', null, ask);
    },
    regateo(b, P) {
      const total = P.total, disc = Math.max(1, Math.floor(total * 0.8));
      P.disc = disc;
      const ask = () => {
        G.opts = [{key:'bugui', hint:`No le bajás: cobrás $${total}.`, decide:'firme'}, {key:`rebaja:${disc}`, hint:`Le bajás: cobrás $${disc} y queda contento.`, decide:'rebaja'}];
        pad(`<div class="cask">Decidí</div><div class="copts">${G.opts.map(optBtn).join('')}</div>`);
        P.waiting = true;
      };
      pad('<div class="cask">…</div>');
      talk(rnd(P.people.length), 'taigui', null, ask);
    },
    porpersona(b, P) {
      const n = P.people.length, per = P.total / n;
      const ask = () => {
        G.opts = shuffle(priceOpts(per, [{key:`precio:${P.total}`, n:P.total, why:`Eso es el total. Por persona: $${P.total} ÷ ${n} = $${per}.`}]));
        pad(`<div class="bill"><div><span>Total</span><span>$${P.total}</span></div><div><span>Personas</span><span>${n}</span></div><div class="tot"><span>Cada uno</span><span>?</span></div></div><div class="cask">¿Cuánto es por persona?</div><div class="copts">${G.opts.map(optBtn).join('')}</div>`);
        P.waiting = true;
      };
      pad('<div class="cask">…</div>');
      talk(n - 1, 'yigeren', null, ask);
    },
    vuelto(b, P) {
      const total = P.total, note = [10, 20, 50].find(v => v > total);
      if (!note) { go(0); return; }
      const ch = note - total;
      P.note = note; P.change = ch;
      const near = [];
      for (const d of shuffle([1, 2, -1, -2, 10, -10])) { const n = ch + d; if (n >= 1 && n <= 99 && n !== total) near.push({key:`precio:${n}`, n, why:`Contá de nuevo: $${note} − $${total} = $${ch}.`}); }
      G.opts = shuffle(priceOpts(ch, [{key:`precio:${total}`, n:total, why:`Eso es la cuenta. El vuelto es $${note} − $${total} = $${ch}.`}].concat(near)));
      const nh = {10:['shí', '十'], 20:['èrshí', '二十'], 50:['wǔshí', '五十']}[note];
      pad(`<div class="cash"><div class="bnote"><b>${note}</b><span>${zh(nh[0] + ' kuài', nh[1] + '块')}</span></div><div class="tot">Te paga con un billete de <b>$${note}</b>.<br>La cuenta es <b>$${total}</b>.</div></div>
        <div class="cask">¿Cuánto vuelto le das?</div><div class="copts">${G.opts.map(optBtn).join('')}</div>`);
      SFX.coin();
      P.waiting = true;
    },
    pago(b, P) {
      if (P.free) { go(0); return; }
      const m = multOf();
      let tip = P.clean ? 2 + (P.pat / P.patMax > 0.5 ? 1 : 0) + (own.has('campana') ? 1 : 0) : 0;
      if (P.rebaja) tip += 2;
      tip *= m;
      const paid = P.paid;
      G.earned += paid + tip; hudScore(G.earned);
      const n = Math.min(14, Math.ceil((paid + tip) / 3)), x0 = E.w / 2, y0 = E.h * 0.45;
      for (let k = 0; k < n; k++) G.coins.push({x:x0 + (Math.random() * 2 - 1) * 40, y:y0, t0:E.time + k * 0.06, tx:30, ty:-20});
      floater(x0, y0 - 30, `+$${paid}`, '#fff', {size:30, glow:CSSV.gold});
      if (tip) floater(x0, y0 - 70, `+${tip} de propina${m > 1 ? ` (x${m})` : ''}`, CSSV.gold, {size:19, font:`800 19px ${CSSV.ui}`, vy:-30});
      SFX.coin(); buzz(15);
      go(900);
    },
    fin(b, P) {
      hideVendor();
      const happy = () => { P.people.forEach(p => { p.mood = 'happy'; }); leave(true); };
      if (P.people[0].c.kind === 'gato') { happy(); return; }
      let key = b.key;
      if (!key) {
        const sv = P.all.filter(id => IT[id]);
        key = P.clean ? pick(['xiexie', 'xiexie', 'tai_haohe', 'haha_xiexie'].concat(sv.length ? [`rico:${pick(sv)}`] : [])) : pick(['xiexie', 'yibanban']);
      }
      pad('<div class="cask">…</div>');
      talk(rnd(P.people.length), key, null, happy);
    },
  };

  /* ---------- servir ---------- */
  function serveMode() {
    const P = G.P;
    P.people.forEach(p => { p.cups = []; });
    G.sel = 0; G.undo = [];
    bubble(null);
    renderServe();
    P.waiting = true;
  }
  function wantOf(j) { const P = G.P; return P.want.mode === 'col' ? null : P.want.per[j]; }
  function renderServe() {
    const P = G.P, col = P.want.mode === 'col';
    const chip = (j) => {
      const p = P.people[j], lns = P.lines.filter(l => (col ? true : l.who === j));
      const text = lns.map(l => { const x = l.txt ? null : CL(l.line || l.key); if (l.txt) return `<span>${rich(l.txt)}</span>`; return G.hidden && cfg.oido && !P.reveal ? `<span class="hid">${ico('i-ear')} tocá para leer</span>` : `<b class="py">${esc(x.py)}</b> <span class="hz" lang="zh-Hans">${esc(x.hz)}</span>`; }).join('<br>');
      const cups = col ? P.people.flatMap(q => q.cups) : p.cups;
      return `<button class="pc${(!col && G.sel === j) ? ' on' : ''}" type="button" data-pc="${j}"><b>${col ? 'Para la mesa' : esc(p.c.tag)}</b><span class="ln">${text || '<em>—</em>'}</span>
        <span class="got">${cups.length ? groupCups(cups).map(x => `<span>${drinkSvg(IT[x.id])}${x.n > 1 ? '×' + x.n : ''}</span>`).join('') : '<em>nada todavía</em>'}</span></button>`;
    };
    const chips = col ? chip(0) : P.people.map((_, j) => chip(j)).join('');
    const counts = {};
    (col ? P.people.flatMap(q => q.cups) : (P.people[G.sel] || P.people[0]).cups).forEach(id => { counts[id] = (counts[id] || 0) + 1; });
    const shelf = G.menu.map(it => `<button class="dk" type="button" data-dk="${it.id}"${it.id === G.soldOut ? ' disabled' : ''}>${drinkSvg(it)}<b class="py">${esc(it.py)}</b><span class="hz" lang="zh-Hans">${esc(it.hz)} <span class="pr">$${it.p}${own.has('pizarra') ? ' · ' + esc(D.l['precio:' + it.p].hz.replace('钱。', '')) : ''}</span></span>${counts[it.id] ? `<span class="n">${counts[it.id]}</span>` : ''}</button>`).join('');
    pad(`<div class="ppl">${chips}</div><div class="shelf">${shelf}</div>
      <div class="srow"><button class="btn ghost" type="button" data-act="deshacer" aria-label="Deshacer"${G.undo.length ? '' : ' disabled'}>${ico('i-undo')}</button><button class="btn" type="button" data-act="servir"${P.people.some(p => p.cups.length) ? '' : ' disabled'}>Servir</button></div>`, true);
    /* la tarjeta de quien estás sirviendo siempre a la vista, aunque sean tres o cuatro */
    const row = $('#pad .ppl'), on = row && row.querySelector('.pc.on');
    if (on && row.scrollWidth > row.clientWidth) row.scrollLeft = on.offsetLeft - row.offsetLeft - (row.clientWidth - on.offsetWidth) / 2;
  }
  function groupCups(cups) { const m = {}; cups.forEach(id => { m[id] = (m[id] || 0) + 1; }); return Object.entries(m).map(([id, n]) => ({id, n})); }
  function addCup(id) {
    const P = G.P; if (!P || !P.waiting || !P.want || P.beat.k !== 'pedido') return;
    const col = P.want.mode === 'col';
    let j = G.sel;
    if (col) { j = 0; let best = 1e9; P.people.forEach((p, k) => { if (p.cups.length < best) { best = p.cups.length; j = k; } }); }
    P.people[j].cups.push(id); G.undo.push(j);
    SFX.tone(1); buzz(6);
    if (!col) {
      const w = wantOf(j);
      if (w && P.people[j].cups.length >= w.length) { const nx = P.people.findIndex((p, k) => k !== j && p.cups.length < (wantOf(k) || []).length); if (nx >= 0) G.sel = nx; }
    }
    renderServe();
  }
  function undoCup() { const P = G.P; if (!P || !G.undo.length) return; const j = G.undo.pop(); P.people[j].cups.pop(); if (P.want.mode !== 'col') G.sel = j; renderServe(); }
  const same = (a, b) => a.slice().sort().join(',') === b.slice().sort().join(',');
  function serve() {
    const P = G.P; if (!P || !P.waiting || P.beat.k !== 'pedido') return;
    const col = P.want.mode === 'col';
    const ok = col ? same(P.people.flatMap(p => p.cups), P.want.col) : P.people.every((p, j) => same(p.cups, P.want.per[j]));
    P.waiting = false;
    if (ok) {
      G.okB++; good(); SFX.pop(); buzz(15);
      P.people.forEach(p => { p.mood = 'happy'; p.served = E.time; });
      burst(E.w / 2, E.h * 0.62, [CSSV.gold, '#fff', CSSV.jade], 30, 220, {g:60, life:0.8, size:2.4});
      if (P.people.length >= 3) { G.grupos++; ev('grupo', 1); }
      pad('<div class="cask">¡Servido!</div>');
      go(1100);
      return;
    }
    P.tries = (P.tries || 0) + 1; bad(); P.pat -= P.patMax * 0.2;
    let wrongWho = 0, wrongId = null;
    if (col) { const want = P.want.col.slice(); for (const id of P.people.flatMap(p => p.cups)) { const i = want.indexOf(id); if (i >= 0) want.splice(i, 1); else { wrongId = id; break; } } }
    else P.people.some((p, j) => { const w = P.want.per[j].slice(); for (const id of p.cups) { const i = w.indexOf(id); if (i >= 0) w.splice(i, 1); else { wrongId = id; wrongWho = j; return true; } } return !same(p.cups, P.want.per[j]) && (wrongWho = j, true); });
    P.people.forEach(p => { p.cups = []; });
    G.undo = [];
    const lns = P.lines.filter(l => !l.txt);
    G.mistakes.push({right:lns.length ? (lns[0].line || lns[0].key) : null, why:'Serviste otra cosa.', items:true});
    SFX.miss(); buzz([30, 40, 30]); E.shake = 6;
    const el = $('#bub2'); el.className = 'bub2 bad';
    el.innerHTML = `<span class="lab">Pidieron</span><br>${P.lines.map(l => l.txt ? rich(l.txt) : zh(CL(l.line || l.key).py, CL(l.line || l.key).hz)).join('<br>')}`;
    el.hidden = false;
    if (P.tries >= 2 || P.pat <= 0) { pad('<div class="cask">Se cansaron de esperar.</div>'); later(() => leave(false), 1500); return; }
    const say2 = wrongId ? `noes:${wrongId}` : null;
    if (say2) talk(wrongWho, say2, null, () => { renderServe(); P.waiting = true; });
    else later(() => { renderServe(); P.waiting = true; }, 900);
  }

  /* ---------- respuestas ---------- */
  function good() {
    G.combo++; G.maxc = Math.max(G.maxc, G.combo);
    const m = multOf(); hudCombo(m, G.combo);
    if (G.combo > 0 && G.combo % 4 === 0) { SFX.sparkle(); floater(E.w / 2, E.h * 0.2, `combo ${G.combo}`, CSSV.gold, {size:30, vy:-30}); }
    ev('combo', G.combo);
  }
  function bad() { G.badB++; G.combo = 0; hudCombo(1, 0); if (G.P) { G.P.clean = false; G.P.people.forEach(p => { p.mood = 'angry'; }); } }
  function choose(i) {
    const P = G.P; if (!P || !P.waiting || !G.opts) return;
    const o = G.opts[i]; if (!o) return;
    const b = P.beat;
    P.waiting = false;
    const btns = $$('#pad .copt');
    if (b.k === 'regateo') {
      if (btns[i]) btns[i].classList.add('ok');
      const l = CL(o.key); vendor(l); if (TTS.ok) say(l.hz, {rate:0.85});
      if (o.decide === 'rebaja') { P.paid = P.disc; P.rebaja = true; P.people.forEach(p => { p.mood = 'happy'; }); }
      else { P.people.forEach(p => { p.mood = 'neutral'; }); P.clean = false; }
      go(1600); return;
    }
    const okI = G.opts.findIndex(x => x.ok);
    if (btns[i]) btns[i].classList.add(o.ok ? 'ok' : 'bad');
    if (!o.ok && btns[okI]) btns[okI].classList.add('ok');
    const right = G.opts[okI], rl = CL(right.line || right.key), cl = CL(o.line || o.key);
    if (o.ok) {
      G.okB++; good(); vendor(cl); if (TTS.ok) say(cl.hz, {rate:0.85}); SFX.click(); buzz(10);
      P.people.forEach(p => { if (p.mood !== 'angry') p.mood = 'happy'; });
      if (b.tag === 'saludo') { P.greetOk = true; ev('saludo_ok', 1); }
      if (b.k === 'cuenta') ev('cuenta_ok', 1);
      if (b.k === 'vuelto') ev('vuelto_ok', 1);
      if (b.thenOk) P.beats.splice(P.bi + 1, 0, ...b.thenOk);
      later(() => { P.people.forEach(p => { if (p.mood === 'happy') p.mood = 'neutral'; }); }, 1400);
      go(1300);
    } else {
      bad(); P.pat -= P.patMax * 0.15;
      const why = o.why || cl.why || right.why || rl.why || (rl.es ? `Quería decir «${rl.es}».` : '');
      vendor(rl, true, why);
      G.mistakes.push({right:right.line || right.key, wrong:o.line || o.key, why});
      SFX.miss(); buzz([30, 40, 30]); E.shake = 5;
      if (b.k === 'cuenta' && o.n != null && !o.er) { if (o.n < P.total) P.paid = o.n; else { later(() => { if (G.P === P) talk(0, 'taigui'); }, 400); } }
      if (b.k === 'vuelto' && o.n != null && o.n > P.change) P.paid = Math.max(0, P.total - (o.n - P.change));
      if (b.thenBad) P.beats.splice(P.bi + 1, 0, ...b.thenBad);
      later(() => { P.people.forEach(p => { if (p.mood === 'angry') p.mood = 'neutral'; }); }, 1800);
      if (P.pat <= 0) { later(() => leave(false), 1800); return; }
      go(2700);
    }
    if (b.k === 'cuenta' && b.sinPago) P.free = true;
  }

  /* ---------- llegar e irse ---------- */
  function nextParty() {
    G.pi++;
    $('#hProg').innerHTML = `<span>mesa ${Math.min(G.pi + 1, cfg.n)}/${cfg.n}</span>`;
    hideVendor(); bubble(null);
    if (G.pi >= G.parties.length) { end(); return; }
    const P = G.parties[G.pi];
    const n = P.people.length, W = E.w;
    P.people.forEach((p, j) => { p.tx = n === 1 ? W / 2 : W * (j + 0.5) / n; p.x = -W * 0.35 - j * 70; p.mood = 'neutral'; p.cups = []; });
    P.bi = -1; P.state = 'enter'; P.clean = true; P.tries = 0;
    const pm = (cfg.pat + 8 * (n - 1)) * (own.has('banco') ? 1.2 : 1);
    P.pat = pm; P.patMax = pm;
    G.P = P;
    if (P.sp) {
      G.especiales++; ev('especial', 1);
      $('#spec').innerHTML = `<div>¡Cliente especial!</div>`;
      SFX.sparkle(); later(() => { $('#spec').innerHTML = ''; }, 2000);
    }
    P.people.forEach(p => { if (p.c.alb) G.met.add(p.c.alb); });
    pad(`<div class="cask">${n === 1 ? 'Llega alguien…' : `Llega una mesa de ${n}…`}</div>`);
    SFX.whoosh();
  }
  function leave(happy) {
    const P = G.P; if (!P || P.state === 'leave') return;
    P.waiting = false; P.state = 'leave';
    if (happy) { G.served++; ev('mesa', 1); }
    else { G.lost++; P.people.forEach(p => { p.mood = 'angry'; }); SFX.miss(); }
    P.people.forEach((p, j) => { p.tx = E.w * 1.4 + j * 80; p.hold = null; });
    bubble(null); hideVendor();
    pad(`<div class="cask">${happy ? (P.people.length > 1 ? 'Se van contentos.' : 'Se va contento.') : (P.people.length > 1 ? 'Se fueron enojados.' : 'Se fue enojado.')}</div>`);
  }
  function end() {
    G.phase = 'end';
    G.timers.forEach(clearTimeout);
    const n = cfg.n, ratio = G.served / n;
    const stars = ratio >= 0.9 && G.badB <= 3 ? 3 : ratio >= 0.65 ? 2 : ratio >= 0.5 ? 1 : 0;
    const prevBest = S.best[day] || 0, record = G.earned > prevBest && prevBest > 0;
    S.st[day] = Math.max(S.st[day] || 0, stars);
    S.best[day] = Math.max(prevBest, G.earned);
    if (stars > 0) S.dia = Math.max(S.dia || 1, day + 1);
    S.tot.mesas += G.served;
    const nuevos = [];
    G.met.forEach(k => { if (!S.album[k]) { const a = ALBUM.find(x => x.key === k); if (a) nuevos.push(a.nombre); } S.album[k] = (S.album[k] || 0) + 1; });
    const xp = Math.round(G.served * 10 + G.okB * 2 + stars * 15 + G.especiales * 10 + (record ? 20 : 0));
    const seen = new Set();
    const items = G.mistakes.filter(m => { const k = JSON.stringify([m.right, m.wrong || '']); if (seen.has(k) || !m.right) return false; seen.add(k); return true; });
    const review = items.length ? `<section class="review"><h3>Para repasar</h3><p class="mute">Lo que había que decir, para escucharlo otra vez.</p>
      ${items.map(m => { const r = CL(m.right), w = m.wrong ? CL(m.wrong) : null; return `<div class="rv"><button class="say" type="button" data-say="${esc(r.hz)}" aria-label="Escuchar">${ico('i-ear')}</button><div>
        <div class="t">${zh(r.py, r.hz)}</div><div class="es">${esc(r.es || '')}</div>
        ${w ? `<div class="tip">Elegiste ${zh(w.py, w.hz)}</div>` : ''}${m.why ? `<div class="tip">${rich(m.why)}</div>` : ''}</div></div>`; }).join('')}</section>` : '';
    const actions = [];
    if (stars > 0) actions.push({id:'next', txt:`Abrir el día ${day + 1}`});
    actions.push({id:'again', txt:stars > 0 ? 'Repetir este día' : 'Probar de nuevo'});
    actions.push({id:'home', txt:'Volver al inicio'});
    finishRun({dia:day, title:stars === 3 ? '¡Día perfecto!' : stars ? `Día ${day} cerrado` : 'Día complicado', sub:`${G.served} de ${n} mesas atendidas`, pass:stars > 0, stars, score:G.earned,
      record, ok:G.okB, xp, kuai:G.earned, nuevos, stats:[[`${G.served}/${n}`, 'mesas'], [G.okB, 'respuestas bien'], [G.maxc, 'mejor combo']], actions, review});
  }

  /* ---------- dibujo ---------- */
  function drawFar(c, w, h, t) {

    const im = drinkImg(G.far), x = w - 70, y = h * 0.4, sz = 50;

    c.beginPath(); c.moveTo(x - 40, y + 4); c.lineTo(w * 0.55, h * 0.55); c.stroke(); c.restore();
  }
  const api = {
    title:`Hora pico · día ${day}`,
    get phase() { return G.phase; },
    resize() { const P = G.P; if (P) { const n = P.people.length; P.people.forEach((p, j) => { if (P.state !== 'leave') p.tx = n === 1 ? E.w / 2 : E.w * (j + 0.5) / n; }); } },
    intro() {
      overlay(`<div class="lab">Hora pico</div><h3>Día ${day}</h3><p>${esc(diaTxt(day))}</p>
        <p>Vienen ${cfg.n} mesas. Saludá según la hora, entendé qué pide cada uno, servíselo a quien corresponde y cobrá en kuài 块. Si tardás, se impacientan.</p>
        <div class="acts"><button class="btn" type="button" data-act="go">Abrir el café</button><button class="btn ghost" type="button" data-act="quit">Volver</button></div>`);
      $('#hProg').innerHTML = `<span>mesa 0/${cfg.n}</span>`;
    },
    go() {
      closeOverlay();
      const plans = planDay();
      buildMenu(plans);
      G.parties = plans.map(pl => (pl.sp ? special(pl) : regular(pl)));
      /* cartelitos repetidos en una mesa (turistas del mismo país, gemelos): se numeran */
      G.parties.forEach(P => {
        const num = P.people.map(p => { const same = P.people.filter(q => q.c.tag === p.c.tag); return same.length > 1 ? same.indexOf(p) + 1 : 0; });
        P.people.forEach((p, j) => { if (num[j]) p.c = Object.assign({}, p.c, {tag:`${p.c.tag} ${num[j]}`}); });
      });
      G.menu.forEach(it => drinkImg(it.id));
      G.phase = 'play'; G.skyK = G.parties[0].hi;
      nextParty();
    },
    replay() {
      const P = G.P; if (!P || !TTS.ok) return;
      if (G.bubKey && G.bubKey.l && G.bubKey.l.hz) { say(G.bubKey.l.hz, {rate:0.7}); return; }
      if (P.lines && P.beat && P.beat.k === 'pedido') { const l = P.lines.filter(x => !x.txt).map(x => CL(x.line || x.key).hz).join(''); if (l) say(l, {rate:0.7}); }
    },
    reveal() { const P = G.P; if (G.hidden && P) { P.pat -= P.patMax * 0.08; P.reveal = true; G.hidden = false; if (G.bubKey) bubble(G.bubKey.who, G.bubKey.l, {hide:false}); if (P.beat && P.beat.k === 'pedido' && P.waiting) renderServe(); } },
    seguir() { const P = G.P; if (P && P.beat && P.beat.k === 'narra') go(80); },
    selPerson(j) { const P = G.P; if (!P || !P.want || P.want.mode === 'col') { if (cfg.oido && P && !P.reveal) api.reveal(); return; } G.sel = j; if (cfg.oido && !P.reveal) api.reveal(); else { const ln = P.lines.find(l => l.who === j && !l.txt); if (ln && TTS.ok) say(CL(ln.line || ln.key).hz, {rate:0.8}); } renderServe(); },
    down(pt) {
      const P = G.P; if (!P || !P.want || P.beat.k !== 'pedido' || P.want.mode === 'col') return;
      let best = -1, bd = 1e9; P.people.forEach((p, j) => { const d = Math.abs(p.x - pt.x); if (d < bd) { bd = d; best = j; } });
      if (best >= 0 && pt.y > E.h * 0.25) api.selPerson(best);
    },
    update(dt) {
      if (G.phase !== 'play') return;
      const P = G.P;
      if (P) {
        G.skyK = lerp(G.skyK, P.hi, 1 - Math.pow(0.25, dt));
        P.people.forEach(p => { p.x = lerp(p.x, p.tx, 1 - Math.pow(0.006, dt)); p.talk = Math.max(0, p.talk - dt); });
        if (P.state === 'enter' && P.people.every(p => Math.abs(p.x - p.tx) < 8)) { P.state = 'here'; go(P.sp ? 1300 : 250); }  /* a un especial se lo deja lucirse antes de hablar */
        if (P.state === 'here' && P.waiting) { P.pat -= dt; if (P.pat <= 0) { P.pat = 0; leave(false); } }
        if (P.state === 'leave' && P.people.every(p => p.x > E.w * 1.15)) { G.P = null; later(nextParty, 450); }
      }
      for (const cn of G.coins) if (E.time >= cn.t0) cn.k = Math.min(1, (E.time - cn.t0) / 0.6);
      const before = G.coins.length;
      G.coins = G.coins.filter(cn => !(cn.k >= 1));
      if (G.coins.length < before) SFX.coin();
    },
    draw(c) {
      const w = E.w, h = E.h, t = E.time, P = G.P;
      drawSky(c, w, h, t, clamp(G.skyK, 0, 4));
      const night = G.skyK > 3.4, cy = h * 0.78;
      drawFar(c, w, h, t);
      if (P) {
        const s = scaleFor(P.people.length);
        P.people.forEach((p, j) => {
          const jump = p.talk > 0 ? Math.abs(Math.sin(p.talk * 9)) * 5 * s : 0;
          drawGuest(c, p, p.x, cy + 18 - jump, s * (p.c.big ? 1.12 : 1), t);
          if (P.want && P.beat && P.beat.k === 'pedido' && P.waiting && P.want.mode !== 'col' && G.sel === j && P.state === 'here') {
            const ay = cy - 228 * s + Math.sin(t * 5) * 5;
            c.fillStyle = CSSV.gold; c.beginPath(); c.moveTo(p.x - 11, ay - 14); c.lineTo(p.x + 11, ay - 14); c.lineTo(p.x, ay); c.fill();
          }
          if (p.hold) {
            const im = drinkImg(p.hold), hx = p.x + (j === P.people.length - 1 && P.people.length > 1 ? -80 : 80) * s, hy = cy - 100 * s, sz = 70 * s;
            c.save(); c.shadowColor = '#fff'; c.shadowBlur = 20 + 8 * Math.sin(t * 6);
            c.fillStyle = 'rgba(255,255,255,.85)'; c.beginPath(); c.arc(hx, hy, sz * 0.62, 0, Math.PI * 2); c.fill(); c.restore();
            if (im.complete) c.drawImage(im, hx - sz / 2, hy - sz / 2, sz, sz);
            c.font = `800 ${Math.round(22 * s)}px ${CSSV.ui}`; c.fillStyle = CSSV.lantern; c.textAlign = 'center'; c.fillText('?', hx + sz * 0.45, hy - sz * 0.42);
          }
        });
      }
      drawStall(c, w, h, t, night, own);
      if (P) {
        const s = scaleFor(P.people.length), sz = 46 * s;
        P.people.forEach(p => {
          const g = groupCups(p.cups); if (!g.length) return;
          const up = p.served ? Math.min(1, (t - p.served) / 0.6) : 0;
          if (up >= 1) return;
          c.globalAlpha = 1 - up;
          g.forEach((x, k) => {
            const im = drinkImg(x.id), xx = p.x + (k - (g.length - 1) / 2) * sz * 0.95, yy = cy + 20 - up * 70;
            if (im.complete) c.drawImage(im, xx - sz / 2, yy, sz, sz);
            if (x.n > 1) { c.font = `800 ${Math.round(15 * s + 3)}px ${CSSV.ui}`; c.textAlign = 'center'; c.fillStyle = '#fff'; c.strokeStyle = 'rgba(0,0,0,.6)'; c.lineWidth = 3; c.strokeText('×' + x.n, xx + sz * 0.3, yy + 8); c.fillText('×' + x.n, xx + sz * 0.3, yy + 8); }
          });
          c.globalAlpha = 1;
        });
      }
      if (P && P.state !== 'enter') {
          /* paciencia de la mesa: una carita y la barra, en la misma fila que el reloj */
          const k = clamp(P.pat / P.patMax, 0, 1), bw = Math.min(120, w * 0.3), x0 = 12, y0 = h * 0.09 + 8;
          const col = k > 0.5 ? CSSV.jade : k > 0.25 ? CSSV.gold : CSSV.lantern;
          c.fillStyle = 'rgba(10,13,28,.78)'; rrect(c, x0, y0, bw + 52, 32, 16); c.fill();
          const fx = x0 + 18, fy = y0 + 16;
          c.fillStyle = col; c.beginPath(); c.arc(fx, fy, 9, 0, 7); c.fill();
          c.fillStyle = '#0a0d1c'; c.beginPath(); c.arc(fx - 3, fy - 2, 1.4, 0, 7); c.arc(fx + 3, fy - 2, 1.4, 0, 7); c.fill();
          c.strokeStyle = '#0a0d1c'; c.lineWidth = 1.6; c.beginPath();
          if (k > 0.5) c.arc(fx, fy + 1, 4, 0.15 * Math.PI, 0.85 * Math.PI); else if (k > 0.25) { c.moveTo(fx - 4, fy + 3.5); c.lineTo(fx + 4, fy + 3.5); } else c.arc(fx, fy + 7, 4, 1.15 * Math.PI, 1.85 * Math.PI);
          c.stroke();
          c.fillStyle = 'rgba(255,255,255,.14)'; rrect(c, x0 + 36, fy - 4, bw, 8, 4); c.fill();
          c.fillStyle = col; rrect(c, x0 + 36, fy - 4, bw * k, 8, 4); c.fill();
      }
      /* reloj */
      if (P || G.parties.length) {
        const m = P ? P.mins : (G.parties[Math.min(G.pi, G.parties.length - 1)] || {mins:450}).mins;
        c.save(); c.font = `800 17px ${CSSV.ui}`; c.textAlign = 'right'; c.textBaseline = 'middle';
        const lab = hhmm(m), tw2 = c.measureText(lab).width + 42;
        c.fillStyle = 'rgba(10,13,28,.78)'; rrect(c, w - tw2 - 12, h * 0.09 + 8, tw2, 32, 16); c.fill();
        c.fillStyle = '#fff'; c.fillText(lab, w - 24, h * 0.09 + 24);
        c.fillStyle = night ? '#fff1cf' : CSSV.gold; c.beginPath(); c.arc(w - tw2 + 6, h * 0.09 + 24, 7, 0, Math.PI * 2); c.fill();
        c.restore();
      }
      for (const cn of G.coins) {
        if (cn.k == null) continue;
        const k = outCubic(cn.k), x = lerp(cn.x, cn.tx, k), y = lerp(cn.y, cn.ty, k) - Math.sin(k * Math.PI) * 60;
        c.fillStyle = CSSV.gold; c.beginPath(); c.arc(x, y, 9, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#7a5310'; c.fillRect(x - 3, y - 3, 6, 6);
      }
    },
    choose, addCup, undoCup, serve,
    restart() { G.timers.forEach(clearTimeout); stopScene(); startDay(day); },
    _G:G,
  };
  return api;
}

/* ============================================================
   Eventos de la interfaz
   ============================================================ */
document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.go === 'home') { show('home'); renderHome(); return; }
  if (b.dataset.go === 'tienda' || b.dataset.go === 'album') { audio(); SFX.click(); menuMode = b.dataset.go; show('menu'); renderMenu(); return; }
  if (b.dataset.dia) { SFX.click(); startDay(+b.dataset.dia); return; }
  if (b.dataset.alb) { albSel = b.dataset.alb; SFX.click(); renderMenu(); window.scrollTo({top:0, behavior:RM ? 'auto' : 'smooth'}); return; }
  if (b.dataset.buy) { const it = D.tienda.find(x => x.id === b.dataset.buy); if (it && S.kuai >= it.precio && !(S.compras || []).includes(it.id)) { S.kuai -= it.precio; (S.compras = S.compras || []).push(it.id); touch(); SFX.coin(); buzz(15); toast(`Compraste: ${esc(it.nombre)}`); renderMenu(); } return; }
  if (b.dataset.cf != null && E.scene && E.scene.choose) { E.scene.choose(+b.dataset.cf); return; }
  if (b.dataset.dk && E.scene && E.scene.addCup) { E.scene.addCup(b.dataset.dk); return; }
  if (b.dataset.pc != null && E.scene && E.scene.selPerson) { E.scene.selPerson(+b.dataset.pc); return; }
  if (b.dataset.say) { say(b.dataset.say, {rate:0.7}); return; }
  const act = b.dataset.act;
  if (act === 'servir' && E.scene) { E.scene.serve(); return; }
  if (act === 'deshacer' && E.scene) { E.scene.undoCup(); return; }
  if (act === 'seguir' && E.scene) { E.scene.seguir(); return; }
  if (act === 'go' && E.scene && E.scene.go) { audio(); E.scene.go(); return; }
  if (act === 'resume') { resumeGame(); return; }
  if (act === 'restart' && E.scene) { closeOverlay(); E.scene.restart(); return; }
  if (act === 'quit') { closeOverlay(); stopScene(); show('home'); renderHome(); return; }
  if (act === 'lvok') { $('#lvup').hidden = true; return; }
  if (b.id === 'hPause') { pauseGame(); return; }
  if (b.id === 'hSay' && E.scene && E.scene.replay) { E.scene.replay(); return; }
  if (b.id === 'tgSfx') { S.cfg.sfx = !S.cfg.sfx; touch(); renderHome(); if (S.cfg.sfx) { audio(); SFX.click(); } return; }
  if (b.id === 'tgVib') { S.cfg.vib = !S.cfg.vib; touch(); renderHome(); buzz(20); return; }
  if (b.dataset.res) {
    const r = lastRun, a = b.dataset.res;
    if (!r) return;
    if (a === 'again') startDay(r.dia); else if (a === 'next') startDay(r.dia + 1); else { show('home'); renderHome(); }
  }
});
$('#bub').addEventListener('click', () => { if (E.scene && E.scene.reveal) E.scene.reveal(); });
document.addEventListener('keydown', e => {
  if (view !== 'play' || !E.scene) return;
  if (e.key === 'Escape') { if (E.paused) resumeGame(); else pauseGame(); return; }
  if (E.paused || !$('#ovl').hidden) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 4) { const bs = $$('#pad .copt'); if (bs[n - 1]) bs[n - 1].click(); }
  if (e.key === 'Enter') { const s = $('#pad [data-act="servir"]') || $('#pad [data-act="seguir"]'); if (s && !s.disabled) s.click(); }
});

/* ============================================================
   Arranque
   ============================================================ */
initEngine();
initTTS();
renderHome();
setTimeout(() => { const s = $('.sign'); if (s) s.classList.remove('boot'); }, 3400);
initSync();
if (window.__TEST__) window.__hp = {get S() { return S; }, E, D, ALBUM, qtyLine, startDay, levelOf, TTS, get view() { return view; }};
})();

</script>
