  }
  function undoCup() { const P = G.P; if (!P || !G.undo.length) return; const j = G.undo.pop(); P.people[j].cups.pop(); if (P.want.mode !== 'col') G.sel = j; renderServe(); }
  const same = (a, b) => a.slice().sort().join(',') === b.slice().sort().join(',');
  function serve() {
    const P = G.P; if (!P || !P.waiting || P.beat.k !== 'pedido') return;
    const col = P.want.mode === 'col';
    const ok = col ? same(P.people.flatMap(p => p.cups), P.want.col) : P.people.every((p, j) => same(p.cups, P.want.per[j]));
    P.waiting = false;
    if (ok) {
      G.okB++; good(); SFX.pop(); buzz(15);
      P.people.forEach(p => { p.mood = 'happy'; p.served = E.time; });
      burst(E.w / 2, E.h * 0.62, [CSSV.gold, '#fff', CSSV.jade], 30, 220, {g:60, life:0.8, size:2.4});
      if (P.people.length >= 3) { G.grupos++; ev('grupo', 1); logro('grupos', 1, 'add'); }
      if (P.sp === 'gato') logro('gato', 1, 'add');
      pad('<div class="cask">¡Servido!</div>');
      go(1100);
      return;
    }
    P.tries = (P.tries || 0) + 1; bad(); P.pat -= P.patMax * 0.2;
    let wrongWho = 0, wrongId = null, wantId = null;
    if (col) { const want = P.want.col.slice(); for (const id of P.people.flatMap(p => p.cups)) { const i = want.indexOf(id); if (i >= 0) want.splice(i, 1); else { wrongId = id; break; } } wantId = want[0] || null; }
    else P.people.some((p, j) => { const w = P.want.per[j].slice(), got = []; for (const id of p.cups) { const i = w.indexOf(id); if (i >= 0) w.splice(i, 1); else got.push(id); } if (got.length) { wrongId = got[0]; wrongWho = j; wantId = w[0] || null; return true; } return !same(p.cups, P.want.per[j]) && (wrongWho = j, true); });
    P.people.forEach(p => { p.cups = []; });
    G.undo = [];
    const lns = P.lines.filter(l => !l.txt);
    G.mistakes.push({right:lns.length ? (lns[0].line || lns[0].key) : null, why:'Serviste otra cosa.', items:true});
    SFX.miss(); buzz([30, 40, 30]); E.shake = 6;
    const el = $('#bub2'); el.className = 'bub2 bad';
    el.innerHTML = `<span class="lab">Pidieron</span><br>${P.lines.map(l => l.txt ? rich(l.txt) : zh(CL(l.line || l.key).py, CL(l.line || l.key).hz)).join('<br>')}`;
    el.hidden = false;
    if (P.tries >= 2 || P.pat <= 0) { pad('<div class="cask">Se cansaron de esperar.</div>'); later(() => leave(false), 1500); return; }
    const who = wrongId && P.people[wrongWho].c.kind !== 'mariposa' && P.people[wrongWho].c.kind !== 'buey' ? wrongWho : -1;
    /* «no tomo té, tomo té con leche» o «¡esto no es té con leche!»: lo que pidió, no lo que le diste */
    const queja = wantId && (D.l[`no:${wrongId}:${wantId}`] ? `no:${wrongId}:${wantId}` : `noes:${wantId}`);
    if (who >= 0 && queja) talk(who, queja, null, () => { renderServe(); P.waiting = true; });
    else later(() => { renderServe(); P.waiting = true; }, 900);
  }

  /* ---------- respuestas ---------- */
  function good() {
    G.combo++; G.maxc = Math.max(G.maxc, G.combo);
    const m = multOf(); hudCombo(m, G.combo);
    if (G.combo > 0 && G.combo % 4 === 0) {
      SFX.sparkle(); floater(E.w / 2, E.h * 0.2, `combo ${G.combo}`, CSSV.gold, {size:30, vy:-30});
    }
    ev('combo', G.combo); logro('combo_max', G.combo, 'set');
  }
  function bad() { G.badB++; G.combo = 0; hudCombo(1, 0); if (G.rushOn) G.rushClean = false; if (G.P) { G.P.clean = false; G.P.people.forEach(p => { p.mood = 'angry'; }); } }
  function choose(i) {
    const P = G.P; if (!P || !P.waiting || !G.opts) return;
    const o = G.opts[i]; if (!o) return;
    const b = P.beat;
    P.waiting = false;
    const btns = $$('#pad .copt');
    if (b.k === 'regateo') {
      if (btns[i]) btns[i].classList.add('ok');
      const l = CL(o.key); vendor(l); if (TTS.ok) say(l.hz, {rate:0.85});
      if (o.decide === 'rebaja') { P.paid = P.disc; P.rebaja = true; P.people.forEach(p => { p.mood = 'happy'; }); if (b.thenRebaja) P.beats.splice(P.bi + 1, 0, ...b.thenRebaja); }
      else { P.people.forEach(p => { p.mood = 'neutral'; }); P.clean = false; if (b.thenFirme) P.beats.splice(P.bi + 1, 0, ...b.thenFirme); }
      go(1600); return;
    }
    const okI = G.opts.findIndex(x => x.ok);
    if (btns[i]) btns[i].classList.add(o.ok ? 'ok' : 'bad');
    if (!o.ok && btns[okI]) btns[okI].classList.add('ok');
    const right = G.opts[okI], rl = right.sil ? {sil:true, py:'…', hz:''} : CL(right.line || right.key), cl = o.sil ? {sil:true, py:'…', hz:''} : CL(o.line || o.key);
    if (o.ok) {
      G.okB++; good(); vendor(cl); if (TTS.ok && !o.sil) say(cl.hz, {rate:0.85}); SFX.click(); buzz(10);
      P.people.forEach(p => { if (p.mood !== 'angry') p.mood = 'happy'; });
      if (b.tag === 'saludo') { P.greetOk = true; ev('saludo_ok', 1); logro('saludos', 1, 'add'); }
      if (b.tag === 'cortesia') { ev('cortesia_ok', 1); logro('cortesia', 1, 'add'); }
      if (b.k === 'cuenta') { ev('cuenta_ok', 1); logro('cuentas', 1, 'add'); }
      if (b.k === 'vuelto') { ev('vuelto_ok', 1); logro('vueltos', 1, 'add'); }
      if (o.sil && P.sp === 'laotse') { G.lao = true; logro('silencio', 1, 'add'); }
      if (b.thenOk) P.beats.splice(P.bi + 1, 0, ...b.thenOk);
      if (o.then) P.beats.splice(P.bi + 1, 0, ...o.then);
      later(() => { P.people.forEach(p => { if (p.mood === 'happy') p.mood = 'neutral'; }); }, 1400);
      go(1300);
    } else {
      bad(); P.pat -= P.patMax * 0.15;
      const why = o.why || cl.why || right.why || rl.why || (rl.es ? `Quería decir «${rl.es}».` : '');
      vendor(rl, true, why);
      G.mistakes.push({right:right.line || right.key, wrong:o.line || o.key, why});
      SFX.miss(); buzz([30, 40, 30]); E.shake = 5;
      if (b.k === 'cuenta' && o.n != null && !o.er) { if (o.n < P.total) P.paid = o.n; else { later(() => { if (G.P === P) talk(0, 'taigui'); }, 400); } }
      if (b.k === 'vuelto' && o.n != null && o.n > P.change) P.paid = Math.max(0, P.total - (o.n - P.change));
      if (b.thenBad) P.beats.splice(P.bi + 1, 0, ...b.thenBad);
      later(() => { P.people.forEach(p => { if (p.mood === 'angry') p.mood = 'neutral'; }); }, 1800);
      if (P.pat <= 0) { later(() => leave(false), 1800); return; }
      go(2700);
    }
    if (b.k === 'cuenta' && b.sinPago) P.free = true;
  }

  /* ---------- llegar e irse ---------- */
  function nextParty() {
    if (noche && G.vidas <= 0) { end(); return; }
    G.pi++;
    hideVendor(); bubble(null);
    if (noche && G.pi >= G.parties.length - 2) {
      /* el turno noche no termina: se suman mesas de a cinco */
      const more = planNoche(G.parties.length, 5).map(pl => (pl.sp ? special(pl) : regular(pl)));
      numerar(more); G.parties.push(...more);
    }
    hudProg();
    if (G.pi >= G.parties.length) { end(); return; }
    const P = G.parties[G.pi];
    if (noche) {
      const nv = Math.floor(G.pi / 5);
      if (nv > G.nivel) { G.nivel = nv; cfg = nocheCfg(nv); G.filoHoy = false; later(() => toast(`Sube el ritmo: nivel ${nv + 1}.`), 1200); }
    }
    const n = P.people.length, W = E.w;
    P.people.forEach((p, j) => { p.tx = n === 1 ? W / 2 : W * (j + 0.5) / n; p.x = -W * 0.35 - j * 70; p.mood = 'neutral'; p.cups = []; });
    P.bi = -1; P.state = 'enter'; P.clean = true; P.tries = 0;
    let pm = (cfg.pat + 8 * (n - 1)) * (own.has('banco') ? 1.2 : 1);
    if (P.rush) pm *= 0.8;
    P.pat = pm; P.patMax = pm;
    G.P = P;
    /* la hora pico: tres mesas seguidas que pagan doble */
    if (P.rush && !G.rushOn) {
      G.rushOn = true; G.rushClean = true;
      $('#spec').innerHTML = `<div class="rush">¡Hora pico!<small>paga doble</small></div>`; SFX.fanfare(); buzz([40, 30, 40]); E.shake = 4;
      later(() => { $('#spec').innerHTML = ''; }, 2000);
      $('#hRush').hidden = false;
    } else if (!P.rush && G.rushOn) {
      G.rushOn = false; G.rushDone = true; $('#hRush').hidden = true;
      if (G.rushClean) logro('rush_limpias', 1, 'add');
    }
    if (P.sp) {
      G.especiales++; ev('especial', 1);
      const filo = esFilo(P.sp);
      if (filo) G.filos++;
      $('#spec').innerHTML = filo ? `<div class="filo">¡Visita de un filósofo!</div>` : `<div>¡Cliente especial!</div>`;
      if (filo) SFX.gong(); else SFX.sparkle();
      later(() => { $('#spec').innerHTML = ''; }, 2000);
    }
    P.people.forEach(p => { if (p.c.alb) G.met.add(p.c.alb); });
    pad(`<div class="cask">${n === 1 ? 'Llega alguien…' : `Llega una mesa de ${n}…`}</div>`);
    SFX.whoosh();
  }
  function leave(happy) {
    const P = G.P; if (!P || P.state === 'leave') return;
    P.waiting = false; P.state = 'leave';
    if (happy) { G.served++; ev('mesa', 1); }
    else {
      G.lost++; P.people.forEach(p => { p.mood = 'angry'; }); SFX.miss();
      if (G.rushOn) G.rushClean = false;
      if (noche) {
        G.vidas--;
        if (G.vidas > 0) toast(G.vidas === 1 ? 'Se fue una mesa enojada. Te queda una vida.' : `Se fue una mesa enojada. Te quedan ${G.vidas} vidas.`);
        else G.ultima = true;
      }
    }
    P.people.forEach((p, j) => { p.tx = E.w * 1.4 + j * 80; p.hold = null; });
    bubble(null); hideVendor();
    pad(`<div class="cask">${happy ? (P.people.length > 1 ? 'Se van contentos.' : 'Se va contento.') : (P.people.length > 1 ? 'Se fueron enojados.' : 'Se fue enojado.')}</div>`);
    if (noche) hudProg();
  }
  /* contadores de álbum que se calculan al cerrar */
  function albumLogros() {
    const keys = Object.keys(S.album);
    logro('paises', keys.filter(k => k.startsWith('pais:')).length, 'set');
    logro('especiales', keys.filter(k => k.startsWith('esp:')).length, 'set');
    logro('filosofos', keys.filter(k => k.startsWith('filo:')).length, 'set');
  }
  function reviewHtml() {
    const seen = new Set();
    const items = G.mistakes.filter(m => { const k = JSON.stringify([m.right, m.wrong || '']); if (seen.has(k) || !m.right) return false; seen.add(k); return true; });
    return items.length ? `<section class="review"><h3>Para repasar</h3><p class="mute">Lo que había que decir, para escucharlo otra vez.</p>
      ${items.map(m => { const r = CL(m.right), w = m.wrong ? CL(m.wrong) : null; return `<div class="rv"><button class="say" type="button" data-say="${esc(r.hz)}" aria-label="Escuchar">${ico('i-ear')}</button><div>
        <div class="t">${zh(r.py, r.hz)}</div><div class="es">${esc(r.es || '')}</div>
        ${w ? `<div class="tip">Elegiste ${zh(w.py, w.hz)}</div>` : ''}${m.why ? `<div class="tip">${rich(m.why)}</div>` : ''}</div></div>`; }).join('')}</section>` : '';
  }
  function end() {
    G.phase = 'end';
    G.timers.forEach(clearTimeout);
    $('#hRush').hidden = true;
    S.tot.mesas += G.served;
    const nuevos = [];
    G.met.forEach(k => { if (!S.album[k]) { const a = ALBUM.find(x => x.key === k); if (a) nuevos.push(a.nombre); } S.album[k] = (S.album[k] || 0) + 1; });
    albumLogros();
    if (noche) {
      const record = G.served > (S.noche.best || 0);
      S.noche.best = Math.max(S.noche.best || 0, G.served); S.noche.kuai = Math.max(S.noche.kuai || 0, G.earned); S.noche.veces = (S.noche.veces || 0) + 1;
      logro('noche_best', G.served, 'set');
      const xp = Math.round(G.served * 8 + G.okB * 2 + G.especiales * 10);
      finishRun({dia:day, noche:true, title:record ? '¡Récord de noche!' : 'Cerró el turno noche', sub:`${G.served} mesas antes de que se fueran tres enojadas`, pass:true, stars:0, score:G.earned,
        record, ok:G.okB, xp, kuai:G.earned, nuevos, stats:[[G.served, 'mesas'], [G.okB, 'respuestas bien'], [G.maxc, 'mejor combo']],
        actions:[{id:'noche', txt:'Otro turno noche'}, {id:'home', txt:'Volver al inicio'}], review:reviewHtml()});
      return;
    }
    const n = cfg.n, ratio = G.served / n;
    const stars = ratio >= 0.9 && G.badB <= 3 ? 3 : ratio >= 0.65 ? 2 : ratio >= 0.5 ? 1 : 0;
    const prevBest = S.best[day] || 0, record = G.earned > prevBest && prevBest > 0;
    S.st[day] = Math.max(S.st[day] || 0, stars);
    S.best[day] = Math.max(prevBest, G.earned);
    if (stars > 0) S.dia = Math.max(S.dia || 1, day + 1);
    if (stars === 3) logro('perfectos', 1, 'add');
    const xp = Math.round(G.served * 10 + G.okB * 2 + stars * 15 + G.especiales * 10 + (record ? 20 : 0));
    const actions = [];
    if (stars > 0) actions.push({id:'next', txt:`Abrir el día ${day + 1}`});
    actions.push({id:'again', txt:stars > 0 ? 'Repetir este día' : 'Probar de nuevo'});
    actions.push({id:'home', txt:'Volver al inicio'});
    finishRun({dia:day, title:stars === 3 ? '¡Día perfecto!' : stars ? `Día ${day} cerrado` : 'Día complicado', sub:`${G.served} de ${n} mesas atendidas`, pass:stars > 0, stars, score:G.earned,
      record, ok:G.okB, xp, kuai:G.earned, nuevos, stats:[[`${G.served}/${n}`, 'mesas'], [G.okB, 'respuestas bien'], [G.maxc, 'mejor combo']], actions, review:reviewHtml()});
  }

  /* mesas en la barra de arriba: de día «3/8», de noche las vidas */
  function hudProg() {
    $('#hProg').innerHTML = noche
      ? `<span class="hearts">${[0, 1, 2].map(k => `<svg class="${k < G.vidas ? '' : 'off'}"><use href="#i-heart"/></svg>`).join('')}</span><span class="pl">mesa ${G.pi + 1}</span>`

  }
  /* cartelitos repetidos en una mesa (turistas del mismo país, gemelos, soldados): se numeran */
  function numerar(list) {
    list.forEach(P => {
      const num = P.people.map(p => { const same = P.people.filter(q => q.c.tag === p.c.tag); return same.length > 1 ? same.indexOf(p) + 1 : 0; });
      P.people.forEach((p, j) => { if (num[j]) p.c = Object.assign({}, p.c, {tag:`${p.c.tag} ${num[j]}`}); });
    });
  }

  /* ---------- dibujo ---------- */

    const im = drinkImg(G.far), x = w - 70, y = h * 0.4, sz = 50;

    c.save(); c.strokeStyle = CSSV.gold; c.lineWidth = 3; c.setLineDash([6, 6]); c.lineDashOffset = -t * 30;
    c.beginPath(); c.moveTo(x - 40, y + 4); c.lineTo(w * 0.55, h * 0.55); c.stroke(); c.restore();
  }
  function coin(c, x, y, r, t) {
    const sq = Math.abs(Math.cos(t * 9));
    c.fillStyle = '#c98a2b'; c.beginPath(); c.ellipse(x, y + 1.2, r * (0.35 + 0.65 * sq), r, 0, 0, TAU); c.fill();
    c.fillStyle = '#ffd36b'; c.beginPath(); c.ellipse(x, y, r * (0.35 + 0.65 * sq), r, 0, 0, TAU); c.fill();

  }
  const api = {
    title:noche ? 'Hora pico · turno noche' : `Hora pico · día ${day}`,
    get phase() { return G.phase; },
    resize() { const P = G.P; if (P) { const n = P.people.length; P.people.forEach((p, j) => { if (P.state !== 'leave') p.tx = n === 1 ? E.w / 2 : E.w * (j + 0.5) / n; }); } },
    intro() {
      if (noche) overlay(`<div class="lab">Hora pico</div><h3>Turno noche</h3><p>Mesas sin fin, siempre de noche. Cada cinco mesas sube el ritmo. Si se van tres mesas enojadas, se cierra el turno.</p>
        <div class="acts"><button class="btn" type="button" data-act="go">Abrir de noche</button><button class="btn ghost" type="button" data-act="quit">Volver</button></div>`);
      else overlay(`<div class="lab">Hora pico</div><h3>Día ${day}</h3><p>${rich(diaTxt(day))}</p>

    },
    go() {

      buildMenu(plans);
      G.parties = plans.map(pl => (pl.sp ? special(pl) : regular(pl)));
      numerar(G.parties);
      G.menu.forEach(it => drinkImg(it.id));
      G.phase = 'play'; G.skyK = G.parties[0].hi;
      later(nextParty, 900);
    },
    replay() {
      const P = G.P; if (!P || !TTS.ok) return;
      if (G.bubKey && G.bubKey.l && G.bubKey.l.hz) { say(G.bubKey.l.hz, {rate:0.7}); return; }
      if (P.lines && P.beat && P.beat.k === 'pedido') { const l = P.lines.filter(x => !x.txt).map(x => CL(x.line || x.key).hz).join(''); if (l) say(l, {rate:0.7}); }
    },
    reveal() { const P = G.P; if (G.hidden && P) { P.pat -= P.patMax * 0.08; P.reveal = true; G.hidden = false; if (G.bubKey) bubble(G.bubKey.who, G.bubKey.l, {hide:false}); if (P.beat && P.beat.k === 'pedido' && P.waiting) renderServe(); } },
    seguir() { const P = G.P; if (P && P.beat && (P.beat.k === 'narra' || P.beat.k === 'mover')) go(80); },
    selPerson(j) { const P = G.P; if (!P || !P.want || P.want.mode === 'col') { if (cfg.oido && P && !P.reveal) api.reveal(); return; } G.sel = j; if (cfg.oido && !P.reveal) api.reveal(); else { const ln = P.lines.find(l => l.who === j && !l.txt); if (ln && TTS.ok) say(CL(ln.line || ln.key).hz, {rate:0.8}); } renderServe(); },

    update(dt) {

        P.people.forEach(p => { p.x = lerp(p.x, p.tx, 1 - Math.pow(0.006, dt)); p.talk = Math.max(0, p.talk - dt); });

    },
    draw(c) {

      const jumpOf = p => (p.talk > 0 ? Math.abs(Math.sin(p.talk * 9)) * 5 * s : 0) + (p.served && t - p.served < 0.5 ? Math.sin((t - p.served) / 0.5 * Math.PI) * 10 * s : 0);
      if (P) {
        /* el búfalo va detrás de todos */
        const order = P.people.map((p, j) => j).sort((a, b) => (P.people[b].c.kind === 'buey') - (P.people[a].c.kind === 'buey'));
        for (const j of order) {
          const p = P.people[j];
          drawGuest(c, p, p.x, cy + 18 - jumpOf(p), s, t, P);
          if (P.want && P.beat && P.beat.k === 'pedido' && P.waiting && P.want.mode !== 'col' && G.sel === j && P.state === 'here') {
            const ay = cy - 228 * s + Math.sin(t * 5) * 5;
            c.fillStyle = CSSV.gold; c.beginPath(); c.moveTo(p.x - 11, ay - 14); c.lineTo(p.x + 11, ay - 14); c.lineTo(p.x, ay); c.fill();
          }
        }
      }
      drawAwning(c, w, h, t, own, sky);
      if (own.has('luces')) drawLights(c, w, h, t, night);
      /* los farolitos cuelgan más abajo que la fila de paciencia y reloj, para que se vean enteros */
      if (own.has('farolitos')) for (const fx of [0.16, 0.5, 0.84]) lantern(c, w * fx, h * 0.085 + 64, 24, 30, {stringLen:33, glow:night > 0.3 ? 1 : 0.2, rot:Math.sin(t * 1.4 + fx * 9) * 0.07});
      const neonHalf = own.has('cartel') ? drawNeon(c, w, h, t, night) : 0;
      drawCounter(c, w, h, sky, G.rain);
      if (P) {
        P.people.forEach((p, j) => { p.holdSide = j === P.people.length - 1 && P.people.length > 1 ? -1 : 1; drawHands(c, p, p.x, cy + 18 - jumpOf(p), s, t, cy); });
        /* lo que tiene en la mano, para preguntar qué es */
        P.people.forEach((p, j) => {
          if (!p.hold) return;
          const im = drinkImg(p.hold), hx = p.x + p.holdSide * 80 * s, hy = cy - 100 * s, sz = 70 * s;
          glowDot(c, hx, hy, sz, '#ffffff', 0.55 + 0.25 * Math.sin(t * 6));
          c.fillStyle = 'rgba(255,255,255,.88)'; c.beginPath(); c.arc(hx, hy, sz * 0.62, 0, TAU); c.fill();
          if (im.complete) c.drawImage(im, hx - sz / 2, hy - sz / 2, sz, sz);
          c.font = `800 ${Math.round(22 * s)}px ${CSSV.ui}`; c.fillStyle = CSSV.lantern; c.textAlign = 'center'; c.textBaseline = 'alphabetic'; c.fillText('?', hx + sz * 0.45, hy - sz * 0.42);
        });
        /* las tazas servidas, sobre el mostrador */
        const sz = 46 * s;
        P.people.forEach(p => {
          const g = groupCups(p.cups); if (!g.length) return;
          const up = p.served ? Math.min(1, (t - p.served) / 0.6) : 0;
          if (up >= 1) return;
          c.globalAlpha = 1 - up;
          const px = p.c.kind === 'mariposa' && p.fly ? p.fly[0] : p.x;
          g.forEach((x, k) => {
            const im = drinkImg(x.id), xx = px + (k - (g.length - 1) / 2) * sz * 0.95, yy = cy - sz * 0.62 - up * 70;
            c.fillStyle = 'rgba(0,0,0,.2)'; c.beginPath(); c.ellipse(xx, cy + 2, sz * 0.34, 4, 0, 0, TAU); c.fill();
            if (im.complete) c.drawImage(im, xx - sz / 2, yy, sz, sz);
            if (x.n > 1) { c.font = `800 ${Math.round(15 * s + 3)}px ${CSSV.ui}`; c.textAlign = 'center'; c.textBaseline = 'alphabetic'; c.fillStyle = '#fff'; c.strokeStyle = 'rgba(0,0,0,.6)'; c.lineWidth = 3; c.strokeText('×' + x.n, xx + sz * 0.3, yy + 8); c.fillText('×' + x.n, xx + sz * 0.3, yy + 8); }
          });
          c.globalAlpha = 1;
        });
      }
      drawProps(c, w, h, t, own, sky, G);
      if (P) {
        P.people.forEach(p => drawBadge(c, p, p.x, cy + 18 - jumpOf(p), s));
        /* gestos sobre la cabeza */
        P.people.forEach(p => {
          const k = p.c.kind; if (k === 'mariposa') return;
          const ks = p.c.chico ? 0.74 : p.c.big ? 1.12 : k === 'buey' ? 1.05 : 1, top = cy + 18 - jumpOf(p) - (k === 'gato' ? 140 : 196) * s * ks;
          let em = null;
          if (p.sleep) em = 'zzz';
          else if (p.mood === 'angry') em = 'enojo';
          else if (P.state === 'here' && P.waiting && P.pat / P.patMax < 0.35) em = 'sudor';
          else if (p.served && t - p.served < 2.4) em = P.clean ? 'corazon' : 'nota';
          if (em) drawEmote(c, p.x + 30 * s * ks, top, s * ks, t, em);
        });
      }
      if (G.rain) rainDraw(c, w, h, t, cy);
      if (G.rushOn) {
        const a = 0.2 + 0.12 * Math.sin(t * 6), g = c.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.max(w, h) * 0.75);
        g.addColorStop(0, 'rgba(255,61,92,0)'); g.addColorStop(1, `rgba(255,61,92,${a})`); c.fillStyle = g; c.fillRect(0, 0, w, h);
      }
      if (P && P.state !== 'enter') {
        /* paciencia de la mesa: una carita y la barra, en la misma fila que el reloj */
        const x0 = 12, y0 = h * 0.085 + 10, k = clamp(P.pat / P.patMax, 0, 1);
        let bw = Math.min(120, w * 0.3);
        if (neonHalf) bw = Math.max(46, Math.min(bw, w / 2 - neonHalf - 10 - x0 - 52));  /* que no tape el cartel */
        const col = k > 0.5 ? CSSV.jade : k > 0.25 ? CSSV.gold : CSSV.lantern;
        c.fillStyle = 'rgba(10,13,28,.8)'; rrect(c, x0, y0, bw + 52, 32, 16); c.fill();
        const fx = x0 + 18, fy = y0 + 16;
        c.fillStyle = col; c.beginPath(); c.arc(fx, fy, 9, 0, 7); c.fill();
        c.fillStyle = '#0a0d1c'; c.beginPath(); c.arc(fx - 3, fy - 2, 1.4, 0, 7); c.arc(fx + 3, fy - 2, 1.4, 0, 7); c.fill();
        c.strokeStyle = '#0a0d1c'; c.lineWidth = 1.6; c.beginPath();
        if (k > 0.5) c.arc(fx, fy + 1, 4, 0.15 * Math.PI, 0.85 * Math.PI); else if (k > 0.25) { c.moveTo(fx - 4, fy + 3.5); c.lineTo(fx + 4, fy + 3.5); } else c.arc(fx, fy + 7, 4, 1.15 * Math.PI, 1.85 * Math.PI);
        c.stroke();
        c.fillStyle = 'rgba(255,255,255,.14)'; rrect(c, x0 + 36, fy - 4, bw, 8, 4); c.fill();
        c.fillStyle = col; rrect(c, x0 + 36, fy - 4, bw * k, 8, 4); c.fill();
      }
      /* reloj */
      if (P || G.parties.length) {
        const m = P ? P.mins : (G.parties[Math.min(G.pi, G.parties.length - 1)] || {mins:450}).mins;
        c.save(); c.font = `800 17px ${CSSV.ui}`; c.textAlign = 'right'; c.textBaseline = 'middle';
        const lab = hhmm(m), tw2 = c.measureText(lab).width + 42;
        c.fillStyle = 'rgba(10,13,28,.8)'; rrect(c, w - tw2 - 12, h * 0.085 + 10, tw2, 32, 16); c.fill();
        c.fillStyle = '#fff'; c.fillText(lab, w - 24, h * 0.085 + 26);
        c.fillStyle = night > 0.6 ? '#fff1cf' : CSSV.gold; c.beginPath(); c.arc(w - tw2 + 6, h * 0.085 + 26, 7, 0, Math.PI * 2); c.fill();
        c.restore();
      }
      for (const cn of G.coins) {
        if (cn.k == null) continue;
        const k = outCubic(cn.k), x = lerp(cn.x, cn.tx, k), y = lerp(cn.y, cn.ty, k) - Math.sin(k * Math.PI) * (cn.jar ? 40 : 60);
        coin(c, x, y, cn.jar ? 6 : 8.5, t + cn.t0);
      }
    },
    choose, addCup, undoCup, serve,
    restart() { G.timers.forEach(clearTimeout); stopScene(); startDay(day, noche); },
    _G:G,
  };
  return api;
}

/* ============================================================
   Eventos de la interfaz
   ============================================================ */
document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.go === 'home') { show('home'); renderHome(); return; }
  if (['tienda', 'album', 'logros'].includes(b.dataset.go)) { audio(); SFX.click(); menuMode = b.dataset.go; show('menu'); renderMenu(); return; }
  if (b.dataset.dia) { SFX.click(); startDay(+b.dataset.dia); return; }
  if (b.dataset.noche) { SFX.click(); startDay(6, true); return; }
  if (b.dataset.gal) {
    audio();
    const g = abrirGalleta();
    if (g) {
      const el = $('#gal'); el.classList.add('crack'); SFX.pop(); buzz([20, 40, 20]);
      setTimeout(() => { el.classList.remove('crack'); renderHome(); SFX.fanfare(); toast(`Galletita: ${esc(galPremio(g))}`); }, 650);
    }
    return;
  }
  if (b.dataset.alb) { albSel = b.dataset.alb; SFX.click(); renderMenu(); window.scrollTo({top:0, behavior:RM ? 'auto' : 'smooth'}); return; }
  if (b.dataset.buy) {
    const it = D.tienda.find(x => x.id === b.dataset.buy);
    if (it && S.kuai >= it.precio && !(S.compras || []).includes(it.id)) {
      S.kuai -= it.precio; (S.compras = S.compras || []).push(it.id); touch(); SFX.coin(); buzz(15); toast(`Compraste: ${esc(it.nombre)}`);
      renderMenu();
    }
    return;
  }
  if (b.dataset.cf != null && E.scene && E.scene.choose) { E.scene.choose(+b.dataset.cf); return; }
  if (b.dataset.dk && E.scene && E.scene.addCup) { E.scene.addCup(b.dataset.dk); return; }
  if (b.dataset.pc != null && E.scene && E.scene.selPerson) { E.scene.selPerson(+b.dataset.pc); return; }
  if (b.dataset.say) { say(b.dataset.say, {rate:0.7}); return; }
  const act = b.dataset.act;
  if (act === 'servir' && E.scene) { E.scene.serve(); return; }
  if (act === 'deshacer' && E.scene) { E.scene.undoCup(); return; }
  if (act === 'seguir' && E.scene) { E.scene.seguir(); return; }
  if (act === 'go' && E.scene && E.scene.go) { audio(); E.scene.go(); return; }
  if (act === 'resume') { resumeGame(); return; }
  if (act === 'restart' && E.scene) { closeOverlay(); E.scene.restart(); return; }
  if (act === 'quit') { closeOverlay(); stopScene(); show('home'); renderHome(); return; }
  if (act === 'lvok') { $('#lvup').hidden = true; return; }
  if (b.id === 'hPause') { pauseGame(); return; }
  if (b.id === 'hSay' && E.scene && E.scene.replay) { E.scene.replay(); return; }
  if (b.id === 'tgSfx') { S.cfg.sfx = !S.cfg.sfx; touch(); renderHome(); if (S.cfg.sfx) { audio(); SFX.click(); } return; }
  if (b.id === 'tgVib') { S.cfg.vib = !S.cfg.vib; touch(); renderHome(); buzz(20); return; }
  if (b.dataset.res) {
    const r = lastRun, a = b.dataset.res;
    if (!r) return;
    if (a === 'again') startDay(r.dia); else if (a === 'next') startDay(r.dia + 1); else if (a === 'noche') startDay(6, true); else { show('home'); renderHome(); }
  }
});
$('#bub').addEventListener('click', () => { if (E.scene && E.scene.reveal) E.scene.reveal(); });
document.addEventListener('keydown', e => {
  if (view !== 'play' || !E.scene) return;
  if (e.key === 'Escape') { if (E.paused) resumeGame(); else pauseGame(); return; }
  if (E.paused || !$('#ovl').hidden) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 4) { const bs = $$('#pad .copt'); if (bs[n - 1]) bs[n - 1].click(); }
  if (e.key === 'Enter') { const s = $('#pad [data-act="servir"]') || $('#pad [data-act="seguir"]'); if (s && !s.disabled) s.click(); }
});

/* ============================================================
   Arranque
   ============================================================ */
initEngine();
initTTS();
renderHome();
avisoReintegro();
setTimeout(() => { const s = $('.sign'); if (s) s.classList.remove('boot'); }, 3400);
initSync();
if (window.__TEST__) window.__hp = {get S() { return S; }, E, D, ALBUM, qtyLine, startDay, levelOf, TTS, get view() { return view; }};
})();

</script>
