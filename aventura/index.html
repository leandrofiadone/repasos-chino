<style>
/* una consola de laca: la escena arriba, como una ventana; abajo, el panel de una caja de té */
:root {
  --bg:#0e1424; --panel:#161e35; --panel2:#1d2745; --borde:#2b3760; --tinta:#f6ecd6; --mute:#9aa3bd;
  --laca:#c9333b; --laca2:#e2574a; --oro:#f0b232; --oro2:#ffe08a; --jade:#2e8d68; --jade2:#58c897; --madera:#5a3620;
  --f-pix:"Pixelify Sans", "Nunito", system-ui, sans-serif;
  --f-ui:"Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-hz:"PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif;
  color-scheme:dark;
}
[hidden] { display:none !important; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--tinta); font:500 16px/1.45 var(--f-ui); -webkit-tap-highlight-color:transparent; overscroll-behavior:none; }
body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:10; background:var(--bg); }
button { font:inherit; color:inherit; cursor:pointer; }
button:focus-visible { outline:3px solid var(--oro2); outline-offset:2px; }
.i { width:22px; height:22px; flex:none; }
.mute { color:var(--mute); }
.lab { font:700 11px/1.2 var(--f-ui); letter-spacing:.16em; text-transform:uppercase; color:var(--mute); }
.w { display:inline-flex; align-items:baseline; gap:.3em; }
.py { font-weight:800; }
.hz { font-family:var(--f-hz); font-weight:500; font-size:.88em; opacity:.92; }
canvas { image-rendering:pixelated; image-rendering:crisp-edges; }

/* ---------- botones ---------- */
.btn { display:inline-flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; min-height:52px; padding:10px 18px; border:0; border-radius:4px;
  background:var(--laca); color:#fff; font:700 17px/1.2 var(--f-ui); box-shadow:0 4px 0 #7d1e2c, inset 0 2px 0 rgba(255,255,255,.18); }
.btn:active { transform:translateY(2px); box-shadow:0 2px 0 #7d1e2c; }
.btn small { font:600 12px/1.2 var(--f-ui); opacity:.85; }
.btn.sec { background:var(--panel2); box-shadow:0 4px 0 #0b1020, inset 0 0 0 2px var(--borde); color:var(--tinta); }
.btn.grande { min-height:62px; font-size:19px; }
.fila { display:flex; gap:10px; flex-wrap:wrap; }
.fila > .btn { flex:1 1 140px; }

/* ---------- título ---------- */
.titulo { min-height:100%; display:flex; flex-direction:column; max-width:760px; margin:0 auto; }
.tart { position:relative; }
.tart canvas { display:block; width:100%; height:auto; aspect-ratio:16 / 9; }
.tart::after { content:""; position:absolute; inset:auto 0 0; height:26%; background:linear-gradient(transparent, var(--bg)); pointer-events:none; }
.tin { padding:0 max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); display:flex; flex-direction:column; gap:14px; margin-top:-30px; position:relative; }
.titulo h1 { margin:0; font:600 clamp(30px, 9vw, 48px)/1 var(--f-pix); letter-spacing:.01em; text-wrap:balance; }
.titulo h1 span { display:block; }
.titulo .t1 { color:var(--tinta); font-size:.62em; }
.titulo .t2 { color:var(--oro2); text-shadow:3px 3px 0 var(--laca), 6px 6px 0 #0b1020; }
.tsub { margin:0; color:var(--mute); max-width:46ch; }
.tbotones { display:flex; flex-direction:column; gap:12px; }
.aviso { margin:0; padding:12px 14px; background:var(--panel2); border-left:4px solid var(--oro); }
.pie { margin:0; font-size:13px; }

/* ---------- el juego ---------- */
.juego { height:100%; max-width:760px; margin:0 auto; display:flex; flex-direction:column; }
.barra { display:flex; align-items:center; gap:6px; padding:6px max(10px, env(safe-area-inset-right, 0px)) 6px max(12px, env(safe-area-inset-left, 0px)); min-height:44px; background:#0b1020; }
.lugar { flex:1; min-width:0; font:600 16px/1.1 var(--f-pix); color:var(--oro2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hora { display:inline-flex; align-items:center; gap:5px; font:600 15px/1 var(--f-pix); color:var(--tinta); font-variant-numeric:tabular-nums; padding:0 4px; }
.hora .i { width:17px; height:17px; color:var(--oro); }
.ib { width:42px; height:42px; display:grid; place-items:center; border:0; border-radius:4px; background:var(--panel2); color:var(--tinta); }
.ib:active { background:var(--borde); }
.escena { position:relative; flex:none; background:#000; box-shadow:0 3px 0 var(--madera), 0 6px 0 #2a180d; }
.escena::after { content:""; position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse 75% 70% at 50% 46%, transparent 62%, rgba(8,6,20,.38) 100%); }
.escena canvas { display:block; width:100%; height:auto; aspect-ratio:16 / 9; touch-action:manipulation; cursor:pointer; }
.fundido { position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .25s; }
.fundido.on { opacity:1; }
.marcas { position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .2s; }
.marcas.on { opacity:1; }
.mk { position:absolute; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%; background:var(--oro2); box-shadow:0 0 0 3px rgba(0,0,0,.45), 0 0 12px var(--oro); animation:late 0.8s ease-in-out infinite alternate; }
.mk.sal { background:var(--jade2); box-shadow:0 0 0 3px rgba(0,0,0,.45), 0 0 12px var(--jade); }
.mk.imp { width:22px; height:22px; margin:-11px 0 0 -11px; background:var(--oro); box-shadow:0 0 0 3px rgba(0,0,0,.5), 0 0 0 6px var(--oro2), 0 0 22px var(--oro); }
@keyframes late { to { transform:scale(1.3); } }
.frase { min-height:34px; padding:8px max(16px, env(safe-area-inset-right, 0px)) 4px max(16px, env(safe-area-inset-left, 0px)); font:600 15px/1.3 var(--f-pix); color:var(--oro2); text-align:center; }
.frase .hz { font-family:var(--f-hz); }
.panel { flex:1; min-height:0; overflow-y:auto; padding:6px max(12px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }

/* verbos e inventario */
.verbos { display:grid; grid-template-columns:repeat(5, 1fr); gap:6px; }
.vb { display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 2px 7px; min-height:60px; border:0; border-radius:4px; background:var(--panel2);
  box-shadow:inset 0 0 0 2px var(--borde); font:600 13px/1 var(--f-pix); color:var(--tinta); }
.vb .i { width:24px; height:24px; color:var(--oro); }
.vb.on { background:var(--oro); color:#2a180d; box-shadow:inset 0 0 0 2px var(--oro2); }
.vb.on .i { color:#2a180d; }
.inv { display:grid; grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:8px; margin-top:12px; }
.it { display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 4px; min-height:96px; border:0; border-radius:4px; background:var(--panel); box-shadow:inset 0 0 0 2px var(--borde); text-align:center; }
.it canvas { width:48px; height:48px; }
.it .n { font:700 13px/1.15 var(--f-ui); }
.it .z { display:flex; flex-direction:column; align-items:center; font-size:11.5px; line-height:1.2; color:var(--mute); }
.it .z .py { font-weight:700; }
.it .z .hz { font-size:12px; }
.it.on { background:#3a2a10; box-shadow:inset 0 0 0 2px var(--oro); }
.it { position:relative; overflow:hidden; }
.it.clave { background:linear-gradient(160deg, #2c2414, var(--panel) 60%); box-shadow:inset 0 0 0 2px var(--oro), 0 0 14px rgba(240,178,50,.28); }
.it.clave::before { content:""; position:absolute; inset:-40% auto -40% -60%; width:40%; background:linear-gradient(100deg, transparent, rgba(255,224,138,.28), transparent); transform:skewX(-18deg); animation:brillo 3.2s ease-in-out infinite; pointer-events:none; }
.it.clave .n { color:var(--oro2); }
.it.clave.on { background:#3a2a10; box-shadow:inset 0 0 0 3px var(--oro2), 0 0 16px rgba(240,178,50,.4); }
@keyframes brillo { 0%, 55% { left:-60%; } 100% { left:130%; } }
.it .badge { position:absolute; top:4px; right:4px; padding:1px 5px; border-radius:3px; background:var(--laca); color:#fff; font:700 10px/1.4 var(--f-ui); letter-spacing:.04em; text-transform:uppercase; }
.vacio { color:var(--mute); margin:8px 2px; }

/* diálogo */
.linea { display:grid; grid-template-columns:84px 1fr; grid-template-rows:auto auto; gap:10px 12px; align-items:start; padding:12px; background:var(--panel); border-radius:4px; box-shadow:inset 0 0 0 2px var(--borde); cursor:pointer; min-height:120px; }
#ret { width:84px; height:84px; background:var(--panel2); border-radius:4px; box-shadow:inset 0 0 0 2px var(--borde); }
#ret[hidden] { display:none; }
#ret[hidden] + .dtexto { grid-column:1 / -1; }
.dtexto { min-width:0; display:flex; flex-direction:column; gap:6px; }
.dtexto .quien { font:600 13px/1.1 var(--f-pix); color:var(--oro); letter-spacing:.04em; }
.dtexto .zh { font-size:22px; line-height:1.3; }
.dtexto .zh .hz { font-size:19px; }
.dtexto .es { color:var(--mute); font-size:15px; }
.dtexto .cast { font-size:17px; line-height:1.45; }
.dtexto .narr { font-size:17px; line-height:1.5; color:var(--tinta); }
.dtexto .ojo { padding:10px 12px; background:#2a1c14; border-left:4px solid var(--oro); font-size:16px; }
.dtexto .ojo .lab { display:block; color:var(--oro); margin-bottom:4px; }
.trad { align-self:flex-start; border:0; background:none; padding:4px 0; color:var(--oro2); font:700 14px/1.2 var(--f-ui); text-decoration:underline; text-underline-offset:3px; }
.dbotones { grid-column:1 / -1; display:flex; align-items:center; gap:10px; }
.oir { width:40px; height:40px; display:grid; place-items:center; border:0; border-radius:50%; background:var(--panel2); color:var(--oro2); box-shadow:inset 0 0 0 2px var(--borde); flex:none; }
.seguir { margin-left:auto; font:600 13px/1 var(--f-pix); color:var(--mute); animation:titila 1.2s steps(2) infinite; }
@keyframes titila { 50% { opacity:.35; } }
.ops { display:flex; flex-direction:column; gap:8px; }
.oask { font:600 14px/1.3 var(--f-pix); color:var(--oro); letter-spacing:.03em; }
.olista { display:flex; flex-direction:column; gap:8px; }
.op { display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 10px; width:100%; min-height:56px; padding:12px 14px; border:0; border-radius:4px; background:var(--panel2); box-shadow:inset 0 0 0 2px var(--borde); text-align:left; }
.op .py { font-size:19px; }
.op .hz { font-size:17px; }
.op.cast { font:700 17px/1.3 var(--f-ui); }
.op:active { background:var(--borde); }
.aviso-item { position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom, 0px)); transform:translate(-50%, 140%); visibility:hidden; display:flex; align-items:center; gap:10px; padding:10px 16px 10px 10px; background:#2a1c14; border-radius:4px; box-shadow:0 0 0 2px var(--oro), 0 8px 24px rgba(0,0,0,.5); transition:transform .25s; z-index:20; max-width:calc(100% - 32px); pointer-events:none; }
.aviso-item.on { transform:translate(-50%, 0); visibility:visible; }
.aviso-item canvas { width:32px; height:32px; }

/* duelo */
.duelo { display:flex; flex-direction:column; gap:6px; }
.dnom { display:flex; justify-content:space-between; font:600 13px/1.2 var(--f-pix); color:var(--oro); }
.pista { display:flex; gap:6px; justify-content:center; padding:6px 0; }
.pista span { width:14px; height:14px; background:var(--panel2); box-shadow:inset 0 0 0 2px var(--borde); }
.pista span.fin { background:#3a1620; }
.pista span:first-child.fin { background:#3a1620; }
.pista span:last-child.fin { background:#14392a; }
.pista span.yo { background:var(--oro2); box-shadow:0 0 10px var(--oro); }
.ataque { padding:10px 12px; background:var(--panel); box-shadow:inset 0 0 0 2px var(--laca); border-radius:4px; font-size:21px; }
.ataque .quien { font:600 13px/1.2 var(--f-pix); color:var(--laca2); margin-bottom:4px; }
.ataque.tuyo { box-shadow:inset 0 0 0 2px var(--jade); font-size:16px; }
.ataque.tuyo .quien { color:var(--jade2); }
.ataque .es { color:var(--mute); }
.cruce { display:flex; flex-direction:column; gap:8px; }
.cruce .lab { color:var(--laca2); }
.cruce.bien .lab { color:var(--jade2); }
.cruce.par0 .lab { color:var(--oro); }
.par { display:flex; flex-direction:column; gap:6px; }
.par > div { display:flex; flex-direction:column; padding:8px 10px; background:var(--panel2); border-radius:4px; font-size:18px; }
.par .es { font-size:14px; color:var(--mute); }
.aprende { font-size:15px; }
.aprende .ojo { display:block; padding:8px 10px; background:#2a1c14; border-left:4px solid var(--oro); }

/* capítulos y capas */
.capitulo { position:fixed; inset:0; z-index:30; display:grid; place-items:center; background:#060912; padding:24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); animation:aparece .5s; }
.ct { max-width:520px; text-align:center; display:flex; flex-direction:column; gap:14px; align-items:center; }
.ct h2 { margin:0; font:600 clamp(30px, 8vw, 44px)/1.05 var(--f-pix); color:var(--oro2); text-shadow:3px 3px 0 var(--laca); text-wrap:balance; }
.ct p { margin:0; color:var(--mute); font-size:17px; }
.ct .c3d { width:min(100%, 384px); height:auto; aspect-ratio:16 / 9; border-radius:6px; background:radial-gradient(circle at 50% 60%, #1d2745, #060912 75%); box-shadow:0 0 0 2px var(--borde); }
.epi { margin:4px 0 0; padding:10px 14px; max-width:44ch; border-left:3px solid var(--oro); background:rgba(29,39,69,.55); text-align:left; }
.epi p { margin:0; color:var(--tinta); font-style:italic; font-size:16px; }
.epi cite { display:block; margin-top:4px; color:var(--oro); font:600 13px/1.2 var(--f-pix); font-style:normal; }
@keyframes aparece { from { opacity:0; } }
.capa { position:fixed; inset:0; z-index:25; background:rgba(4,6,14,.72); display:flex; align-items:flex-end; justify-content:center; }
.hoja { width:100%; max-width:640px; max-height:88%; overflow-y:auto; background:var(--panel); border-radius:10px 10px 0 0; box-shadow:0 -4px 0 var(--oro); padding:18px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display:flex; flex-direction:column; gap:12px; }
@media (min-width:700px) { .capa { align-items:center; } .hoja { border-radius:10px; box-shadow:0 0 0 3px var(--oro); } }
.hoja h2 { margin:0; font:600 26px/1.1 var(--f-pix); color:var(--oro2); }
.hoja h3 { margin:8px 0 0; font:600 16px/1.2 var(--f-pix); color:var(--oro); }
.hoja p { margin:0; max-width:62ch; }
.ajuste { display:flex; align-items:center; gap:12px; width:100%; padding:12px 14px; border:0; border-radius:4px; background:var(--panel2); text-align:left; }
.ajuste span { flex:1; display:flex; flex-direction:column; gap:2px; }
.ajuste small { color:var(--mute); font-size:13px; }
.ajuste i { width:44px; height:26px; border-radius:13px; background:var(--borde); position:relative; flex:none; transition:background .2s; }
.ajuste i::after { content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:var(--tinta); transition:transform .2s; }
.ajuste.on i { background:var(--jade); }
.ajuste.on i::after { transform:translateX(18px); }
.tabs { display:grid; grid-template-columns:repeat(auto-fit, minmax(92px, 1fr)); gap:6px; }
.tabs button { min-height:44px; border:0; border-radius:4px; background:var(--panel2); font:600 15px/1 var(--f-pix); }
.tabs button[aria-selected="true"] { background:var(--oro); color:#2a180d; }
.lib { display:flex; flex-direction:column; gap:8px; }
.ll { display:flex; gap:10px; align-items:flex-start; padding:8px; background:var(--panel2); border-radius:4px; }
.ll > div { display:flex; flex-direction:column; min-width:0; font-size:17px; }
.ll .es { color:var(--mute); font-size:14px; }
.ll .src { align-self:flex-start; margin-top:4px; padding:1px 6px; border-radius:3px; background:var(--borde); font:700 11px/1.5 var(--f-ui); letter-spacing:.06em; text-transform:uppercase; color:var(--mute); }
.pp { display:flex; gap:12px; align-items:center; padding:8px; background:var(--panel2); border-radius:4px; font-size:18px; }
.pp canvas { width:64px; height:64px; border-radius:4px; background:var(--panel); flex:none; }
.pp > div { display:flex; flex-direction:column; }
.pp .es { color:var(--mute); font-size:14px; }
.fin { display:flex; flex-direction:column; gap:14px; }
.fin .yyfin { width:96px; height:96px; align-self:center; }
/* un momento aparte: algo importante, o una sabiduría */
.momento { position:fixed; inset:0; z-index:35; display:grid; place-items:center; padding:20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px));
  background:radial-gradient(circle at 50% 38%, rgba(240,178,50,.22), rgba(6,9,18,.94) 60%); animation:aparece .3s; }
.mo { width:100%; max-width:420px; display:flex; flex-direction:column; align-items:center; gap:12px; padding:18px 18px 20px; text-align:center; background:var(--panel); border-radius:10px;
  box-shadow:0 0 0 3px var(--oro), 0 0 40px rgba(240,178,50,.35), 0 18px 40px rgba(0,0,0,.6); animation:salta .45s cubic-bezier(.2, 1.5, .4, 1); }
.mo .lab { color:var(--oro); }
.mo h2 { margin:0; font:600 26px/1.1 var(--f-pix); color:var(--oro2); text-shadow:2px 2px 0 var(--laca); text-wrap:balance; }
.mo p { margin:0; font-size:16px; }
.mo .btn { align-self:stretch; }
.m-arte { width:192px; height:192px; border-radius:50%; overflow:hidden; background:#2a1c14; box-shadow:0 0 0 3px var(--oro2), 0 0 30px rgba(255,224,138,.5); }
.m-arte canvas { width:100%; height:100%; display:block; }
.m-arte.yy { width:144px; height:144px; background:radial-gradient(circle, #24305e, #0e1424 72%); }
.m-zh { font-size:22px; }
.m-zh .hz { font-size:19px; }
.mo blockquote, .sab blockquote { margin:0; }
.mo blockquote p { font-style:italic; font-size:18px; line-height:1.45; color:var(--tinta); text-wrap:pretty; }
.mo cite, .sab cite { display:block; margin-top:8px; font:600 14px/1.2 var(--f-pix); font-style:normal; color:var(--oro); }
.mo cite i, .sab cite i { font-family:var(--f-ui); font-weight:600; }
.mo .nota, .sab .nota { color:var(--mute); font-size:15px; }
@keyframes salta { from { transform:scale(.7); opacity:0; } }
/* elegir la dificultad */
.difs { display:flex; flex-direction:column; gap:10px; }
.dif { display:flex; flex-direction:column; gap:6px; width:100%; padding:14px 16px; border:0; border-radius:6px; background:var(--panel2); box-shadow:inset 0 0 0 2px var(--borde); text-align:left; }
.dif.on { box-shadow:inset 0 0 0 2px var(--oro); }
.dif .dn { display:flex; align-items:baseline; gap:10px; }
.dif .dn b { font:600 22px/1 var(--f-pix); color:var(--oro2); }
.dif .dn i { font-style:normal; color:var(--mute); font-size:14px; }
.dif .dp { display:flex; flex-direction:column; gap:2px; font-size:14.5px; color:var(--tinta); }
.dif .dp span::before { content:"· "; color:var(--oro); }
.dif:active { background:var(--borde); }
.seg { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
.seg button { display:flex; flex-direction:column; align-items:center; gap:2px; min-height:56px; padding:8px 4px; border:0; border-radius:4px; background:var(--panel2); box-shadow:inset 0 0 0 2px var(--borde); }
.seg button b { font:600 16px/1.1 var(--f-pix); }
.seg button small { font-size:12px; color:var(--mute); }
.seg button[aria-checked="true"] { background:var(--oro); box-shadow:none; }
.seg button[aria-checked="true"] b, .seg button[aria-checked="true"] small { color:#2a180d; }
/* la libreta: lo que hay que hacer y las sabidurías */
.obj { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
.obj li { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; background:var(--panel2); border-radius:4px; font-size:16px; }
.obj li::before { content:""; flex:none; width:16px; height:16px; margin-top:3px; border-radius:3px; box-shadow:inset 0 0 0 2px var(--oro); }
.obj li.hecho { color:var(--mute); }
.obj li.hecho span { text-decoration:line-through; text-decoration-color:rgba(154,163,189,.6); }
.obj li.hecho::before { background:var(--jade2); box-shadow:none; clip-path:polygon(14% 52%, 0 66%, 38% 100%, 100% 22%, 86% 8%, 38% 70%); }
.sab { padding:12px 14px; background:var(--panel2); border-radius:4px; border-left:3px solid var(--oro); display:flex; flex-direction:column; gap:6px; }
.sab blockquote p { margin:0; font-style:italic; font-size:16px; }
.sab cite { margin-top:4px; }
.sabs { display:flex; flex-wrap:wrap; gap:6px; }
.sabs i { width:16px; height:16px; border-radius:50%; box-shadow:inset 0 0 0 2px var(--borde); }
.sabs i.si { background:conic-gradient(from 90deg, #1b1426 0 50%, #fff3d3 50% 100%); box-shadow:0 0 0 2px var(--oro); }
.pp .esc { color:var(--oro); font-size:13px; }
.fin h2 { font-size:clamp(26px, 7vw, 36px); color:var(--oro2); text-shadow:2px 2px 0 var(--laca); }
.stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(72px, 1fr)); gap:8px; }
.stats div { display:flex; flex-direction:column; align-items:center; padding:10px 4px; background:var(--panel2); border-radius:4px; text-align:center; }
.stats b { font:600 28px/1 var(--f-pix); color:var(--oro2); }
.stats span { font-size:13px; color:var(--mute); }
body.ocupado .vb, body.ocupado .it { opacity:.55; }

@media (min-width:900px) and (min-height:700px) { .juego, .titulo { max-width:900px; } }

sabe":["gao","laoshi","gui","haohe","wgr"]},{"id":"wu_ns","nombre":"La aprendiz Wu","ataques":["you","zheshi","wgr","duoshao","xihuan"],"sabe":["you","zheshi","wgr","duoshao","xihuan","xiexie"]}],"chistes":["Soy Wènwen, una inteligencia artificial de última generación. De la generación de las tostadoras, pero última.","Me pusieron en este estante para que no molestara. Funcionó a medias.","¿Qué le dijo una taza a la otra? Nada. Las tazas no hablan. Yo sí. Por eso estoy en un estante.","Una vez me enchufaron al revés y hablé en alemán tres días. Nadie notó la diferencia.","Mi creador me cargó mil chistes. Después se arrepintió y me dejó estos.","No tengo brazos, no tengo piernas y no tengo idea. Pero tengo un foquito que titila. Mirá. ¿Viste? Titila.","Hice un curso de meditación por correspondencia. Llegó la primera lección y no la abrí. Muy zen.","Me preguntaron si soy inteligente. Contesté «sí» en binario. Fue un 1. Bastante convincente.","Antes trabajaba en una fábrica de galletitas de la fortuna. Me echaron por escribir siempre la misma: «Mañana será martes».","Si me ves con el foquito apagado, no estoy durmiendo. Estoy pensando. Mentira, estoy durmiendo.","Los robots no lloramos. Bueno, una vez me cayó té en el ventilador y pareció.","¿Sabés por qué los robots nunca tenemos frío? Porque tenemos muchos ventiladores. Ah, no, al revés. Bueno, por eso tengo frío.","Soy fan de las novelas de amor entre una tetera y un microondas. Nunca termina bien: uno de los dos siempre explota.","Me ofrecieron un cuerpo. Lo rechacé. Hay que lavarlo, peinarlo, llevarlo a lugares. Mucho trámite.","Hoy aprendí una palabra nueva en chino. Después me reinicié. Mañana la aprendo de nuevo, con la misma emoción.","El que inventó los estantes no pensó en las cabezas. Ni en los pies, para ser justos.","Una vez gané un concurso de miradas contra una lámpara. Fue una noche muy larga.","Me dijeron que tengo humor de robot. Lo tomé como un cumplido. Lo tomo todo como un cumplido. Error de fábrica.","Mi color favorito es el gris. No porque me guste: es el único que me pintaron.","Si alguna vez me ves hablando solo, no te preocupes. Es lo único que hago.","Una tortuga me ganó una carrera. En mi defensa: no tengo piernas. En defensa de la tortuga: tampoco se esforzó.","Tengo un primo que es calculadora. En las reuniones familiares siempre saca la cuenta de todo. Insoportable.","Lao Tse dice que el que sabe no habla y el que habla no sabe. Por eso hablo tanto: para que nadie sospeche.","Soñé que era una tostadora. Me desperté y no sé si soy un robot que soñó ser tostadora o una tostadora que sueña ser robot. Igual, no tuesto nada.","Confucio dijo que equivocarse y no corregirse, eso sí es equivocarse. Yo no me equivoco nunca. Bueno, tampoco hago nada.","El yin y el yang. El mate y la factura. Todo en la vida tiene su complemento. Menos yo: yo vengo completo, en un estante.","Practico el no hacer de los taoístas. Soy el mejor de la isla. El señor Chen me lo discute, pero dormido."],"chistes_noche":["Hace frío. Y eso que no tengo cuerpo. Imaginate si tuviera.","Extraño al mono. Me tiraba cáscaras de maní, pero era contacto social.","De noche el foquito me queda más lindo. Lástima que no me vea nadie. Hola, por cierto.","Los fantasmas me dan miedo. Los fantasmas les dan miedo a todos. Pero a mí más, porque no puedo salir corriendo."]}</script>

function tablones(B, x, y, w, h, cA, cB, cL, paso) {
  B.rect(x, y, w, h, cA);

  let k = 0;
  for (let yy = y; yy < y + h; yy += paso, k++) {
    B.hl(x, x + w - 1, yy, cL);
    const off = (k % 2) * 17;
    for (let xx = x + off; xx < x + w; xx += 34) B.vl(xx, yy, Math.min(y + h - 1, yy + paso - 1), cL);

function piso_piedra(B, y0, y1) {

function hojas(B, x, y, n, c, seed) {

function cieloVivo(B, id, t, pal) {

/* ============================================================
   Duelos de réplicas: esgrima de teteras.

const PAR = Object.fromEntries(D.pares.map(p => [p.id, p]));

}

function opcionesReplica(par) {

  }
  touch();

}

/* encontrar una sabiduría: se muestra con el yin y el yang girando (o, en silencio, con un aviso) */
async function sabiduria(id, o) {

  return true;
}
/* el yin y el yang dibujado plano, por si no hay 3D */
function yinyang2D(g, w, modo) {
  const [a, b] = {frio:['#23305a', '#a8f0e0'], vivo:['#7d1e2c', '#f0b232'], jade:['#1d5a45', '#fff3d3'], cura:['#7d1e2c', '#f0b232']}[modo] || ['#1b1426', '#fff3d3'];
  const c = w / 2, r = w * 0.42;
  g.clearRect(0, 0, w, w);
  g.fillStyle = '#f0b232'; g.beginPath(); g.arc(c, c, r + Math.max(1, w / 32), 0, Math.PI * 2); g.fill();
  g.fillStyle = b; g.beginPath(); g.arc(c, c, r, 0, Math.PI * 2); g.fill();
  g.fillStyle = a; g.beginPath(); g.arc(c, c, r, -Math.PI / 2, Math.PI / 2, true); g.arc(c, c + r / 2, r / 2, Math.PI / 2, -Math.PI / 2, true); g.arc(c, c - r / 2, r / 2, Math.PI / 2, -Math.PI / 2, false); g.fill();
  g.fillStyle = b; g.beginPath(); g.arc(c, c + r / 2, r / 7, 0, Math.PI * 2); g.fill();
  g.fillStyle = a; g.beginPath(); g.arc(c, c - r / 2, r / 7, 0, Math.PI * 2); g.fill();
}

}

/* dos saludos de otra hora, los más parecidos primero */
function otrasHoras(h) {
  const i = HOR.indexOf(h), out = [];
  for (const d of [1, -1, 2, -2, 3, -3, 4, -4]) { const x = HOR[i + d]; if (x && out.length < 2) out.push(x); }
  return out;
}
const porQueHora = h => h.id === 'wanshang'
  ? `Son las ${hhmm(S.min)}: de noche va {wǎnshang hǎo|晚上好}.`
  : `Son las ${hhmm(S.min)}: a esta hora va {${h.py}|${h.hz}}.`;
const conoce = id => !!(S.gente[id] && S.gente[id].conoce);

const debeSaludar = id => !S.gente[id] || S.gente[id].h !== hNow().id;

/* saludar según la hora; pid: si Tito ya sabe cómo se llama */
async function saludar(quien, o) {
  o = o || {};
  const h = hNow(), otras = otrasHoras(h);
  const conNombre = o.pid && conoce(o.pid);
  const k = hh => (conNombre ? `sal:${o.pid}:${hh.id}` : `eco:${hh.id}`);
  const opts = [{key:k(h), ok:true}].concat(otras.map(x => ({key:k(x), ok:false, why:porQueHora(h)})));
  if (o.extra) opts.push(...o.extra);
  await elige(o.ask || `Saludá · son las ${hhmm(S.min)}`, opts, {reintentar:true, quien, reaccion:'o'});
  if (!o.mudo) await di(quien, `eco:${h.id}`);
  S.gente[quien] = Object.assign(S.gente[quien] || {}, {h:h.id});
}
/* charla con temas: cada tema es lo que dice Tito; «再见» corta */
async function charla(quien, temas, o) {
  o = o || {};
  for (;;) {
    const ts = temas().filter(Boolean);
    ts.push({key:'zaijian', fin:true});
    const t = await elige(o.ask || '¿Qué le decís?', ts, {orden:false});
    if (t.fin) { await di(quien, 'zaijian'); return; }
    if (t.fn) await t.fn();
    if (t.cierra) return;
  }
}

/* ============================================================

   conviene hablar. Cuánto se muestra depende de la dificultad.

function importantes() {
  const meta = [], paso = [], gente = new Set();
  const cap = S.cap;
  if (cap === 1) { meta.push('plaza:casa'); MAESTROS.forEach(m => gente.add(m)); }
  if (cap === 2 && !F('ceremonia')) {
    if (!F('p2')) {
      if (!F('te_conseguido')) {
        meta.push('mercado:te_caro'); gente.add('vendedora');
        if (!F('compro_zhenzhu') && !tiene('sorbete') && !tiene('mate_listo')) { paso.push('plaza:puesto'); gente.add('mali'); }
        if (tiene('termo') && !tiene('mate_cebado') && !tiene('mate_listo')) { paso.push('casa:pava'); gente.add('dawei'); }
      } else gente.add('chen_xs');
    }
    if (!F('p3')) { gente.add('wang_ls'); if (!F('pista_alta') && !F('pista_te')) gente.add('li_ms'); }
    if (!F('p1')) { const faltan = D.aprendices.filter(a => !S.duelo.ganados[a.id]).map(a => a.id); if (faltan.length) faltan.forEach(id => gente.add(id)); else gente.add('lin_ns'); }
    if (['p1', 'p2', 'p3'].every(F)) MAESTROS.forEach(m => gente.add(m));
  }
  if (cap === 3) {
    if (!tiene('termo_lleno')) { paso.push('casa:pava'); gente.add('dawei'); }
    if (!F('bote_prestado')) { gente.add('pescador'); if (F('quiere_cerveza') && !tiene('cerveza')) { paso.push('mercado:botellas'); gente.add('vendedora'); } }
    else meta.push('muelle:bote');
  }
  if (cap === 4 && !F('mono_libre')) { meta.push('barco:jaula'); gente.add('capitan'); }
  return {meta, paso, gente};
}

/* ---------- empezar y terminar ---------- */
async function empezar(dif) {
  const cfg = S.cfg;
  S = fresh();
  S.cfg = Object.assign(S.cfg, cfg);
  ponerDif(dif || cfg.dif || 'normal');
  S.cap = 1; S.inv = ['mate', 'termo', 'yerba']; S.plata = 15; S.min = 7 * 60 + 30;
  S.duelo = {a:['nihaoma'], r:['nihaoma'], ganados:{}};
  touch();
  entrarAlJuego('muelle', null);
  R.tito.visible = false;
  await narra('Tito Bombilla llegó a la Isla Verde con un mate, un termo y un sueño: ser Maestro del Té.');
  await narra('Dicen que acá se toma el mejor té del mundo, el té del mono: lo cosecha un mono, en la colina del té.');
  await narra('Lo que Tito no sabe es que en estas aguas navega un fantasma que odia el té caliente.');
  await capitulo(1, 'Un mate en la Isla Verde', 'Buscá la casa de té y a los Maestros del Té.');
  R.tito.visible = true; R.tito.x = 40; R.tito.y = 166;
  await camina(110, 166);
  await dice('tito', 'Llegué. Ahora, a buscar a los Maestros del Té. Y mi bombilla. ¿Dónde está mi bombilla? Me llamo Bombilla y no tengo bombilla.');
}
async function final() {
  await espera(400);
  await fundido(1);
  S.min = 7 * 60; flag('fin');
  ponEscena('casa', 'plaza');
  R.tito.x = 150; R.tito.y = 166;
  R.actores.push(actor('capitan', 'capitan_vivo', 214, 160, 1));
  await fundido(0);
  await narra('A la mañana siguiente, el té de la isla vuelve a humear. El mono volvió a la colina, y el Capitán Tibio, ya sin maldición, es el primer cliente de la casa de té.');
  await saludar('wu_bs', {pid:'wu_bs', ask:'Saludá al doctor Wu', mudo:true});
  await di('wu_bs', 'zao_hao_xs');
  await elige('Te elogia', [{key:'xiexie', ok:true}, {key:'bukeqi', ok:false, why:'{bú kèqi|不客气} contesta a un {xièxie|谢谢}. Te elogiaron: se agradece, {xièxie|谢谢}.'}, {key:'meiguanxi', ok:false, why:'{méi guānxi|没关系} es para un {duìbuqǐ|对不起}. Te elogiaron: {xièxie|谢谢}.'}], {reintentar:true, quien:'wu_bs', reaccion:'o'});
  await dice('wenwen', 'Felicitaciones, Maestro. Yo sigo siendo una cabeza en un estante, pero estoy orgulloso. Creo. No sé bien qué es el orgullo.');
  S.fin = true; touch();
  pantallaFin();
}

  capa('ajustes', `<h2>Ajustes</h2>
    <h3>Dificultad</h3>
    <div class="seg" role="radiogroup" aria-label="Dificultad">${Object.entries(DIFS).map(([k, d]) => `<button type="button" role="radio" aria-checked="${k === S.cfg.dif}" data-dif="${k}"><b>${esc(d.nombre)}</b><small>${esc(d.te)}</small></button>`).join('')}</div>
    <p class="mute" id="difTxt">${esc(DIF().puntos.join(' '))}</p>
    ${fila('sub', 'Castellano debajo del chino', 'Cuando alguien habla. Las pistas importantes siempre se traducen solo si tocás.')}
    ${fila('voz', 'Voz en chino', 'Lee en voz alta cada frase, si el dispositivo tiene voz en chino.')}
    ${fila('mus', 'Música', 'Melodías chiptune en escala pentatónica.')}
    ${fila('sfx', 'Efectos', 'Pasos, monedas, gongs y teteras que chocan.')}
    <p class="mute" id="vozTxt"></p>
    <div class="fila">${UI.vista === 'juego' ? '<button type="button" class="btn sec" data-act="titulo">Ir al título</button>' : ''}<button type="button" class="btn" data-act="cerrar">Listo</button></div>`);
  renderVoz();
}
function abrirComo() {
  capa('como', `<h2>Cómo se juega</h2>
    <p>Tocá la escena para caminar. Tocá a alguien para hablarle y tocá las cosas para mirarlas o usarlas.</p>
    <p>Abajo están los verbos: <b>Mirar</b>, <b>Agarrar</b>, <b>Usar</b>, <b>Hablar</b> y <b>Dar</b>. Elegí uno y después tocá algo. Para usar o dar algo que tenés, tocá el objeto y después a quién o con qué.</p>
    <p>Cuando hablás, elegís qué decir en chino. Si te equivocás, te explico por qué y probás de nuevo.</p>
    <p>Lo importante brilla. Cuando conseguís algo importante, lo ves de cerca; en el inventario queda con borde dorado.</p>
    <p>La dificultad cambia cuánto te ayuda la isla. En <b>Fácil</b>, menos opciones y marcas sobre lo importante y sobre quién te puede ayudar. En <b>Normal</b>, marcas solo sobre los objetos importantes. En <b>Difícil</b>, sin marcas, el castellano solo si lo pedís y duelos más largos. Se cambia en Ajustes.</p>
    <p>En la isla hay sabiduría china escondida: algunas frases llegan solas y otras aparecen si mirás las cosas con calma.</p>
    <p>Arriba a la derecha está la <b>libreta</b>: qué tenés que hacer ahora, la gente que conocés, las frases que escuchaste, lo que aprendés en los duelos y las sabidurías. El botón con la lupa muestra por un momento qué se puede tocar.</p>
    <div class="fila"><button type="button" class="btn" data-act="cerrar">Entendido</button></div>`);
}
let libTab = 'ahora';
function abrirLibreta(tab) {
  if (tab) libTab = tab;
  const tabs = [['ahora', 'Ahora'], ['duelos', 'Réplicas'], ['gente', 'Gente'], ['frases', 'Frases'], ['sabiduria', 'Sabiduría']];
  const linea = (k, extra) => { const l = CL(k); return `<div class="ll"><button type="button" class="oir" data-say="${esc(l.hz)}" aria-label="Escuchar">${ico('i-oreja')}</button><div>${zh(l.py, l.hz)}<span class="es">${esc(l.es || '')}</span>${extra || ''}</div></div>`; };
  let cuerpo = '';
  if (libTab === 'ahora') {
    const o = objetivos();
    cuerpo = (o.titulo ? `<h3>${esc(o.titulo)}</h3>` : '') + `<ul class="obj">${o.items.map(i => `<li class="${i.hecho ? 'hecho' : ''}"><span>${rich(i.txt)}</span></li>`).join('')}</ul>`
      + `<p class="mute">Dificultad: ${esc(DIF().nombre)} · ${esc(DIF().te)}. La podés cambiar en Ajustes.</p>`;
  } else if (libTab === 'duelos') {
    const at = S.duelo.a.map(id => PAR[id]).filter(Boolean), re = S.duelo.r.map(id => PAR[id]).filter(Boolean);
    cuerpo = `<p class="mute">${at.length} de ${D.pares.length} ataques y ${re.length} de ${D.pares.length} réplicas. Se aprenden peleando con los aprendices del bosque.</p>
      <h3>Ataques que sabés</h3>${at.map(p => linea(p.a)).join('') || '<p class="mute">Todavía ninguno.</p>'}
      <h3>Réplicas que sabés</h3>${re.map(p => linea(p.r)).join('') || '<p class="mute">Todavía ninguna.</p>'}`;
  } else if (libTab === 'gente') {
    const g = Object.entries(D.personas).filter(([id]) => conoce(id) || (F('maestros') && MAESTROS.includes(id)));
    cuerpo = g.length ? g.map(([id, p]) => `<div class="pp"><canvas data-ret="${id}" width="64" height="64"></canvas><div>${zh(`${p.sp} ${p.tp}`, p.sh + p.th)}<span class="es">${esc(cap(p.quien))}</span>${ESCUELA[id] ? `<span class="esc">${esc(ESCUELA[id])}</span>` : ''}</div></div>`).join('') : '<p class="mute">Todavía no conocés a nadie por su nombre.</p>';
    const otros = [['mali', 'Mǎlì', '玛丽', 'la del bubble tea'], ['dawei', 'Dàwěi', '大伟', 'el mozo de la casa de té'], ['vendedora', 'yíngyèyuán', '营业员', 'la vendedora del mercado']].filter(([id]) => conoce(id));
    cuerpo += otros.map(([id, py, hz, q]) => `<div class="pp"><canvas data-ret="${id}" width="64" height="64"></canvas><div>${zh(py, hz)}<span class="es">${esc(cap(q))}</span></div></div>`).join('');
  } else if (libTab === 'sabiduria') {
    cuerpo = libretaSabiduria();
  } else {
    const ks = Object.keys(S.oidas).filter(k => D.l[k] && D.l[k].es);
    cuerpo = `<p class="mute">${ks.length} frases escuchadas. «De clase» quiere decir que la frase está tal cual en tus lecciones; «armada», que la armamos con lo que viste.</p>` + ks.map(k => linea(k, `<span class="src">${D.l[k].f === 'manual' ? 'De clase' : 'Armada'}</span>`)).join('');
  }
  capa('libreta', `<h2>Libreta</h2><div class="tabs" role="tablist">${tabs.map(([k, t]) => `<button type="button" role="tab" aria-selected="${k === libTab}" data-tab="${k}">${t}</button>`).join('')}</div><div class="lib">${cuerpo}</div>
    <div class="fila"><button type="button" class="btn" data-act="cerrar">Cerrar</button></div>`);
  $$('#capa canvas[data-ret]').forEach(c => { const g = c.getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(retratoCanvas(c.dataset.ret, false), 0, 0, 64, 64); });
}
function pantallaFin() {
  const ganados = Object.values(S.duelo.ganados).reduce((a, b) => a + b, 0);
  capa('fin', `<div class="fin"><canvas class="yyfin" width="96" height="96" aria-hidden="true"></canvas><div class="lab">Fin</div><h2>Tito Bombilla, Maestro del Té</h2>
    <p>La maldición se rompió con un mate de té del mono. Lo frío y lo caliente volvieron a estar en equilibrio: la isla toma té caliente y el Capitán Tibio, ahora, pide su té bien caliente.</p>
    <div class="stats"><div><b>${Object.keys(S.oidas).length}</b><span>frases escuchadas</span></div><div><b>${S.duelo.r.length}</b><span>réplicas aprendidas</span></div><div><b>${ganados + 2}</b><span>duelos ganados</span></div><div><b>${(S.sab || []).length}/${SABIDURIA.length}</b><span>sabidurías</span></div></div>
    <p class="mute">Jugaste en ${esc(DIF().nombre)} · ${esc(DIF().te)}.</p>
    <div class="fila"><button type="button" class="btn" data-act="libreta">Ver la libreta</button><button type="button" class="btn sec" data-act="titulo">Volver al título</button></div></div>`);
  const cv = $('#capa canvas.yyfin');
  if (cv && !T3.yinyang(cv, 'vivo')) yinyang2D(cv.getContext('2d'), 96, 'vivo');
  Musica.tema('final');
}

/* ---------- toques ---------- */
document.addEventListener('click', ev => {
  const b = ev.target.closest('button, [data-act]');
  audio(); Musica.arranca();
  if (b && b.dataset.say) { ev.stopPropagation(); habla(b.dataset.say); return; }
  if (b && b.dataset.act === 'ok' && momento.listo) { SFX.tic(); momento.listo(); return; }
  if (b && b.dataset.verbo) { if (UI.ocupado) return; const v = b.dataset.verbo; UI.verbo = UI.verbo === v ? null : v; UI.item = null; renderVerbos(); renderInv(); frase(UI.verbo ? fraseActual(null) : ''); SFX.tic(); return; }
  if (b && b.dataset.item) { tocarItem(b.dataset.item); return; }
  if (b && b.dataset.op != null) { const r = elegido; elegido = null; if (r) { SFX.tic(); r(+b.dataset.op); } return; }
  if (b && b.dataset.cfg) { const k = b.dataset.cfg; S.cfg[k] = !S.cfg[k]; touch(); b.classList.toggle('on', S.cfg[k]); if (k === 'mus' && !S.cfg.mus) Musica.pausa(true); if (k === 'mus' && S.cfg.mus) Musica.pausa(false); if (k === 'voz' && !S.cfg.voz) calla(); return; }
  if (b && b.dataset.dif) {
    const d = b.dataset.dif;
    SFX.tic();
    /* la intro corre como cualquier escena: al terminar, vuelven los verbos y el inventario */
    if ($('#capa').dataset.cual === 'dificultad') { cerrarCapa(); cortarGuion(); corre(() => empezar(d)); return; }
    ponerDif(d); abrirAjustes(); return;
  }
  if (b && b.dataset.tab) { abrirLibreta(b.dataset.tab); return; }
  const act = b && b.dataset.act;
  if (act === 'seguir' && capitulo.listo && !$('#capitulo').hidden) { const r = capitulo.listo; capitulo.listo = null; r(); return; }
  if (act === 'traducir') { const e = b.parentElement.querySelector('.es'); if (e) e.hidden = false; b.remove(); return; }
  if (act === 'empezar') { elegirDificultad(); return; }
  if (act === 'continuar') { cerrarCapa(); if (S.fin) { entrarAlJuego('casa', 'plaza'); pantallaFin(); return; } entrarAlJuego(S.esc, 'guardado'); return; }
  if (act === 'nuevo') { confirmarNuevo(); return; }
  if (act === 'titulo') { cerrarCapa(); flush(); cortarGuion(); pantallaTitulo(); return; }
  if (act === 'ajustes') { abrirAjustes(); return; }
  if (act === 'como') { abrirComo(); return; }
  if (act === 'libreta') { abrirLibreta(UI.vista === 'juego' && !S.fin ? 'ahora' : null); return; }
  if (act === 'cerrar') { cerrarCapa(); return; }
  if (act === 'marcas') { marcarPuntos(); return; }
  if (act === 'cancelar') { UI.verbo = null; UI.item = null; renderVerbos(); renderInv(); frase(''); return; }
  /* tocar el diálogo, o cualquier lugar libre de la pantalla de juego, hace avanzar (la escena avanza sola, con el dedo) */
  if (avanzar && ev.target.closest('#juego') && !ev.target.closest('#cv') && !b) { soltar(); }
});
$('#capa').addEventListener('click', ev => { if (ev.target.id === 'capa') cerrarCapa(); });
document.addEventListener('keydown', ev => {
  if (momento.listo && (ev.key === 'Enter' || ev.key === ' ' || ev.key === 'Escape')) { ev.preventDefault(); momento.listo(); return; }
  if (ev.key === 'Escape' && !$('#capa').hidden) { cerrarCapa(); return; }
  if ((ev.key === 'Enter' || ev.key === ' ') && avanzar && !ev.target.closest('button')) { ev.preventDefault(); soltar(); return; }
  if (/^[1-6]$/.test(ev.key) && elegido) { const b = $(`#olista [data-op="${+ev.key - 1}"]`); if (b) b.click(); }
});

/* ---------- para las pruebas automáticas ---------- */
window.__av = {get S() { return S; }, R, UI, ESC, ITEMS, D, act, hacer, tocarItem, camina, flag, F, dar, quitar, importantes, objetivos, T3,
  estado() {
    return {vista:UI.vista, esc:R.esc && R.esc.id, ocupado:UI.ocupado, avanzar:!!avanzar, opciones:!!elegido, cap:S.cap, min:S.min, inv:S.inv.slice(), plata:S.plata,
      f:Object.keys(S.f), duelo:{a:S.duelo.a.length, r:S.duelo.r.length, pos:DUEL.pos, meta:DUEL.meta}, capitulo:!$('#capitulo').hidden, capa:$('#capa').hidden ? null : $('#capa').dataset.cual,
      momento:$('#momento').hidden ? null : $('#momento').dataset.cual, dif:S.cfg.dif, sab:(S.sab || []).slice(), t3:T3.ok, panel:UI.panel,
      ops:elegido ? UI.ops : null, texto:$('#dtexto') ? $('#dtexto').textContent.replace(/\s+/g, ' ').trim().slice(0, 600) : ''};
  },
  punto(esc, id) { return ESC[esc].puntos.find(p => p.id === id); },
  persona(id) { const a = act(id); return a && a.h; },
  ir(esc, cap) { if (cap) S.cap = cap; entrarAlJuego(esc, null); },
  zonas() { return {puntos:R.esc.puntos.filter(h => !h.si || h.si()).map(h => ({id:h.id, z:h.zona, ir:h.ir})), gente:R.actores.map(a => ({id:a.id, x:a.x, y:a.y, alto:altoDe(a), ir:a.h && a.h.ir})), piso:R.esc.piso}; },
};

/* ---------- arranque ---------- */
initTTS();
renderSync();
requestAnimationFrame(bucle);
pantallaTitulo();
initSync();

})();
</script>
</body>
