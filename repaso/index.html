<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repaso</title>
<meta name="description" content="Repaso de las lecciones 1 a 3 de mandarín: tonos, sonidos, saludos, bebidas, números, países, frases y los diálogos, con examen final.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f4ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13110e" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Repaso">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:type" content="website">
<meta property="og:locale" content="es_AR">
<meta property="og:title" content="Repaso">
<meta property="og:description" content="Repaso de las lecciones 1 a 3 de mandarín: tonos, sonidos, saludos, bebidas, números, países, frases y los diálogos, con examen final.">
<meta property="og:url" content="https://repasos-chino-repaso.vercel.app/">
<meta property="og:image" content="https://repasos-chino-repaso.vercel.app/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&family=Playpen+Sans:wght@400;500&family=Special+Elite&display=swap">
<style>
/* El cuaderno de clase, como las prácticas anteriores: hoja, tinta, sello rojo y birome azul.
   Lo fuerte es el examen final; cada tema es una hoja más chica. */
:root{
  --paper:#f7f4ec; --sheet:#fffdf8; --ink:#1d1a16; --ink-2:#4a443b; --mute:#857d71;
  --line:#e8e1d4; --line-2:#d2c8b6; --margin:#eaa59b;
  --red:#c23b22; --red-soft:#f8e5df;
  --pen:#2649a8; --pen-soft:#e7edf9;
  --ok:#2c7a4b; --ok-soft:#e2f0e6;
  --amber:#9a6410;
  --shadow:0 1px 0 rgba(29,26,22,.05), 0 10px 24px -16px rgba(29,26,22,.35);
  --f-body:"Noto Serif", Georgia, "Times New Roman", serif;
  --f-hz:"Noto Serif SC", "Noto Serif CJK SC", "Songti SC", "STSong", serif;
  --f-type:"Special Elite", "Courier New", Courier, monospace;
  --f-pen:"Playpen Sans", "Segoe Print", "Comic Sans MS", cursive;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#13110e; --sheet:#1c1915; --ink:#efe8da; --ink-2:#cbc2b2; --mute:#978e7f;
    --line:#2d2922; --line-2:#3f392f; --margin:#6e3027;
    --red:#ea6c4f; --red-soft:#3a1e17;
    --pen:#93b1ff; --pen-soft:#1b2445;
    --ok:#74c693; --ok-soft:#153022;
    --amber:#e3b25e;
    --shadow:0 1px 0 rgba(0,0,0,.35), 0 12px 26px -16px rgba(0,0,0,.85);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#13110e; --sheet:#1c1915; --ink:#efe8da; --ink-2:#cbc2b2; --mute:#978e7f;
  --line:#2d2922; --line-2:#3f392f; --margin:#6e3027;
  --red:#ea6c4f; --red-soft:#3a1e17;
  --pen:#93b1ff; --pen-soft:#1b2445;
  --ok:#74c693; --ok-soft:#153022;
  --amber:#e3b25e;
  --shadow:0 1px 0 rgba(0,0,0,.35), 0 12px 26px -16px rgba(0,0,0,.85);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--f-body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 48px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:30;background:var(--paper)}
button{font:inherit;color:inherit}
a{color:var(--pen)}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.app{max-width:640px;margin:0 auto;overflow-x:clip}
.py{font-weight:600}
.hz{font-family:var(--f-hz);font-weight:500}
.mute{color:var(--mute)}
.lab{font:400 11.5px/1.25 var(--f-type);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* una palabra en chino dentro de un texto: pinyin y, detrás, el hanzi más chico */
.w .py{font-family:var(--f-body);font-weight:600}
.w .hz{font-size:.9em;opacity:.82;white-space:nowrap}
.zh .hz{margin-left:8px}

/* barra de arriba */
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:20;background:var(--paper);display:flex;align-items:center;
  gap:10px;padding:12px 0 10px;border-bottom:1px solid var(--line-2)}
.brand{display:flex;align-items:center;gap:8px;border:0;background:none;padding:4px 0;cursor:pointer;
  font:400 12px/1 var(--f-type);letter-spacing:.18em;text-transform:uppercase;color:var(--red);white-space:nowrap}
.brand i{width:9px;height:9px;background:var(--red);display:inline-block;transform:rotate(-6deg)}
.voice{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
.voice i{width:8px;height:8px;border-radius:50%;background:var(--line-2)}
.voice.on i{background:var(--ok)}

/* inicio */
.hero{padding:22px 0 4px}
h1{font:400 32px/1.12 var(--f-type);margin:6px 0 8px;text-wrap:balance;-webkit-text-stroke:.35px currentColor}
.lead{color:var(--ink-2);margin:0;max-width:54ch}
.warn{margin-top:16px;padding:12px 14px;border:1px dashed var(--red);border-radius:var(--r);background:var(--red-soft);font-size:15px;line-height:1.45}
.warn b{color:var(--red)}
.exam{position:relative;margin-top:22px;padding:18px 16px 16px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--sheet);box-shadow:var(--shadow)}
.exam::before{content:"";position:absolute;left:30px;top:0;bottom:0;border-left:1px solid var(--margin);opacity:.7}
.exam > *{position:relative;padding-left:26px}
.exam .lab{color:var(--red)}
.exam h2{font:400 25px/1.15 var(--f-type);margin:4px 0 6px}
.exam p{margin:0;color:var(--ink-2);font-size:15.5px}
.exam .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.dot{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-2);padding:3px 8px 3px 6px;border:1px solid var(--line);border-radius:999px;background:var(--paper)}
.dot i{width:8px;height:8px;border-radius:50%;background:var(--line-2)}
.dot.v0 i,.dot.v1 i{background:var(--red)} .dot.v2 i{background:#d79a2b} .dot.v3 i{background:var(--ok)}
.errs{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:12px 14px;border:1px dashed var(--pen);border-radius:var(--r);
  background:var(--pen-soft);color:var(--pen);cursor:pointer;text-align:left;font-size:15.5px;min-height:52px}
.errs b{font-weight:700}
.errs svg{width:20px;height:20px;flex:none;margin-left:auto}
.group{margin:26px 0 0}
.group > .lab{margin:0 0 10px}
.modes{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.mode{position:relative;text-align:left;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 14px;align-items:start;
  padding:15px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet);cursor:pointer;box-shadow:var(--shadow);
  transition:transform .15s ease,border-color .15s ease}
.mode:hover{transform:translateY(-1px);border-color:var(--line-2)}
.badge{grid-row:1/3;width:50px;height:50px;border-radius:8px;display:grid;place-items:center;align-content:center;background:var(--red-soft);color:var(--red);
  font:600 22px/1 var(--f-body)}
.badge .hz{font:700 22px/1 var(--f-hz)}
.badge .bp{font:600 10.5px/1 var(--f-body);margin-top:3px;opacity:.85}
.mode .nm{font:400 20px/1.25 var(--f-type)}
.mode .ds{color:var(--ink-2);font-size:14.5px;line-height:1.45}
.mode .ft{grid-column:2;display:flex;gap:6px;align-items:center;margin-top:9px;flex-wrap:wrap}
.tag{font:400 10.5px/1 var(--f-type);letter-spacing:.1em;text-transform:uppercase;padding:4px 7px 3px;border:1px solid var(--line-2);border-radius:4px;color:var(--mute)}
.tag.best{color:var(--ok);border-color:color-mix(in srgb, var(--ok) 45%, transparent)}
.tag.rep{color:var(--pen);border-color:color-mix(in srgb, var(--pen) 45%, transparent)}
.meter{grid-column:2;height:4px;border-radius:2px;background:var(--line);margin-top:9px;overflow:hidden}
.meter b{display:block;height:100%;background:var(--ok)}
.foot{margin:24px 0 0;font-size:13.5px;color:var(--mute);display:grid;gap:6px}

/* pregunta */
.gbar{display:flex;align-items:center;gap:10px;padding:14px 0 10px}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:6px 6px 6px 0;cursor:pointer;color:var(--ink-2);font-size:14.5px}
.back svg{width:18px;height:18px}
.gtitle{font:400 18px/1.2 var(--f-type);min-width:0}
.gstat{margin-left:auto;font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.gstat b{color:var(--ink)}
.prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:14px}
.prog b{display:block;height:100%;width:0;background:var(--ink);transition:width .35s}
.help{margin:0 0 14px;border:1px dashed var(--line-2);border-radius:var(--r);background:var(--sheet)}
.help summary{cursor:pointer;padding:11px 14px;font:400 14px/1.2 var(--f-type);letter-spacing:.06em;color:var(--pen);list-style:none;display:flex;align-items:center;gap:8px;min-height:44px}
.help summary::-webkit-details-marker{display:none}
.help summary::before{content:"+";display:inline-grid;place-items:center;width:18px;height:18px;border:1px solid currentColor;border-radius:50%;font:600 14px/1 var(--f-body)}
.help[open] summary::before{content:"–"}
.help ul{margin:0;padding:0 16px 12px 34px;font-size:15px;line-height:1.5;color:var(--ink-2)}
.help li{margin:6px 0}
.board{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;box-shadow:var(--shadow)}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.tchip{font:400 10.5px/1 var(--f-type);letter-spacing:.1em;text-transform:uppercase;padding:4px 7px 3px;border-radius:4px;background:var(--red-soft);color:var(--red)}
.listen{display:grid;justify-items:center;gap:6px;padding:4px 0 6px}
.play{display:grid;place-items:center;width:92px;height:92px;border-radius:50%;background:var(--ink);color:var(--paper);border:0;cursor:pointer;box-shadow:var(--shadow)}
.play svg{width:40px;height:40px}
.play.talking{animation:pulse 1s ease-in-out infinite}
.slow{border:0;background:none;padding:6px 10px;color:var(--pen);font-size:15px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;min-height:40px}
.speed{font:400 10.5px/1 var(--f-type);letter-spacing:.12em;text-transform:uppercase;padding:4px 8px 3px;border-radius:4px;border:1px solid var(--line-2);color:var(--mute)}
.speed.fast{color:var(--red);border-color:color-mix(in srgb, var(--red) 50%, transparent)}
.ask{font-size:16px;color:var(--ink-2);margin:8px 0 0;text-align:center}
.prompt-es{font-size:21px;line-height:1.38;margin:6px 0 0;text-wrap:balance}
.prompt-es .w .py{font-weight:700}
.zhp{margin:10px 0 0;padding:12px 14px;border-radius:var(--r);background:var(--paper);border:1px solid var(--line)}
.zhp .p{font-size:22px;font-weight:600;line-height:1.45}
.zhp .h{font-family:var(--f-hz);font-size:17px;color:var(--ink-2);margin-top:2px}
.zhp.big{text-align:center}
.zhp.big .p{font-size:30px}
.zhp.big .h{font-size:22px}
.zhp{position:relative}
.zhp.oye{padding-right:58px}
.zhp .say{position:absolute;right:10px;top:10px}
.inp{display:block;width:100%;margin-top:14px;font:500 19px/1.3 var(--f-body);padding:14px;border:1px solid var(--line-2);border-radius:var(--r);
  background:var(--paper);color:var(--ink)}
.inp:focus{outline:2px solid var(--pen);outline-offset:1px}
.inp:disabled{color:var(--ink-2)}
.inp.ok{border-color:var(--ok)} .inp.casi{border-color:var(--amber)} .inp.bad{border-color:var(--red)}
.fb.casi .head{color:var(--amber)}
.yours{font-size:15px;color:var(--ink-2);margin:0 0 8px}
.yours b{font-weight:600;color:var(--ink)}
.alts{font-size:14.5px;color:var(--ink-2);margin-top:8px}
.hole{display:inline-block;min-width:2.4em;border-bottom:2px solid var(--ink-2);vertical-align:baseline;height:1.1em}
.hole.fill{min-width:0;height:auto;border-bottom-color:var(--ok);color:var(--ok);padding:0 2px}
.opts{display:grid;gap:10px;margin-top:16px}
.opts.syl,.opts.dos,.opts.cinco{grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.cinco .opt:last-child,.opts.syl .opt:last-child:nth-child(odd),.opts.dos .opt:last-child:nth-child(odd){grid-column:1/-1}
.opts.syl.tres{grid-template-columns:repeat(3,minmax(0,1fr))}
.opts.syl.tres .opt:last-child{grid-column:auto}
.opts.keypad{grid-template-columns:repeat(4,minmax(0,1fr))}
.opt{position:relative;display:block;width:100%;text-align:left;padding:13px 16px;border:1px solid var(--line-2);border-radius:var(--r);
  background:var(--sheet);cursor:pointer;font-size:17px;line-height:1.35;min-height:52px;transition:background .15s,border-color .15s}
.opt:hover:not(:disabled){border-color:var(--ink-2)}
.opt:disabled{cursor:default}
.opt .zh .hz{font-size:15px;color:var(--ink-2)}
.opt .oes{display:block;font-size:14px;color:var(--mute);font-style:italic;margin-top:2px}
.opts.syl .opt{text-align:center;font:600 24px/1.2 var(--f-body);padding:14px 10px}
.opts.syl .opt .oes{font:italic 400 13px/1.3 var(--f-body)}
.opts.dos .opt,.opts.cinco .opt{text-align:center}
.opts.dos .opt .zh .hz,.opts.cinco .opt .zh .hz{display:block;margin:2px 0 0}
.opt.dig{text-align:center;font:400 28px/1 var(--f-type);padding:14px 4px}
.opt.del{display:grid;place-items:center;color:var(--ink-2)}
.opt.del svg{width:26px;height:26px}
.opt.price{text-align:center;font:400 24px/1 var(--f-type)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);box-shadow:inset 0 0 0 1px var(--ok)}
.opt.bad{border-color:var(--red);background:var(--red-soft);animation:shake .35s}
.opt.bad .zh,.opt.bad .tx{text-decoration:line-through;text-decoration-color:var(--red)}
.opt .why{display:none}
.answered .opts:not(.syl):not(.dos):not(.cinco) .opt .why{display:block;margin-top:7px;font:500 14.5px/1.45 var(--f-pen);color:var(--pen)}
.answered .opt.bad .why{color:var(--red)!important}
.fb{margin-top:16px;padding:14px;border-radius:var(--r);border:1px dashed var(--line-2);background:var(--paper)}
.fb .head{font:400 13px/1.2 var(--f-type);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:6px}
.fb.no .head{color:var(--red)}
.fb .ans{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.fb .ans .py{font-size:20px}
.fb .ans .hz{font-size:17px;color:var(--ink-2)}
.fb .ans .tx{font-size:18px;font-weight:600}
.fb .es{color:var(--ink-2);font-style:italic;margin-top:2px}
.fb .src{font:400 10.5px/1 var(--f-type);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-top:10px}
.pen{font:500 15.5px/1.5 var(--f-pen);color:var(--pen);margin:10px 0 0}
.pen.no{color:var(--red)}
.diag{font-weight:600;margin:10px 0 0}
.hint{font-size:14px;color:var(--mute);margin:8px 0 0}
.hl{color:var(--red);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
/* sonó / elegiste */
.cmp{display:grid;gap:8px}
.cr{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--sheet)}
.cr.ok{border-color:color-mix(in srgb, var(--ok) 55%, transparent)}
.cr.bad{border-color:color-mix(in srgb, var(--red) 55%, transparent)}
.cl{flex:none;width:70px;font:400 11px/1.2 var(--f-type);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.cs{flex:1;min-width:0;font:600 22px/1.2 var(--f-body)}
.cs .hz{font-size:16px;color:var(--ink-2);margin-left:6px}
.ct{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.ct svg{width:44px;height:30px;flex:none}
.ct .g{stroke:var(--line-2);stroke-width:1}
.ct .c{fill:none;stroke:var(--pen);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.cr.bad .ct .c{stroke:var(--red)}
.sbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--sheet);border-radius:999px;padding:6px 12px 6px 10px;
  font-weight:600;font-size:16px;cursor:pointer;min-height:40px}
.sbtn svg{width:16px;height:16px;flex:none}
.sbtn .hz{font-size:14px;color:var(--ink-2);font-weight:500}
.also{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
/* series de números */
.slots{display:flex;gap:8px;justify-content:center;margin:16px 0 4px}
.slot{position:relative;width:52px;height:58px;border:1px solid var(--line-2);border-bottom:3px solid var(--ink-2);border-radius:8px;
  display:grid;place-items:center;font:400 28px/1 var(--f-type);background:var(--paper);font-variant-numeric:tabular-nums}
.slot.cur{border-color:var(--pen);border-bottom-color:var(--pen)}
.slot.ok{border-color:var(--ok);background:var(--ok-soft)}
.slot.bad{border-color:var(--red);background:var(--red-soft);color:var(--red);text-decoration:line-through}
.slot .fix{position:absolute;top:100%;margin-top:4px;font:600 15px/1 var(--f-body);color:var(--ok);text-decoration:none}
.slots.checked{margin-bottom:24px}
/* armar la frase */
.build{min-height:68px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;align-items:flex-start;padding:10px;border:1px dashed var(--line-2);
  border-radius:var(--r);background:var(--paper);margin-top:14px}
.build .ph{color:var(--mute);font-size:14.5px;padding:12px 4px}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:center}
.tile{display:inline-grid;justify-items:center;gap:1px;padding:7px 10px 6px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:8px;
  background:var(--sheet);cursor:pointer;min-height:50px;min-width:46px}
.tile .py{font-size:16px;line-height:1.2}
.tile .hz{font-size:13px;color:var(--ink-2);line-height:1.25}
.tile.used{visibility:hidden}
.tile:disabled{cursor:default}
.tile.ok{border-color:var(--ok);background:var(--ok-soft)}
.tile.bad{border-color:var(--red);background:var(--red-soft)}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:999px;padding:12px 22px;font-weight:600;cursor:pointer;min-height:48px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn.wide{flex:1}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.say{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;border:1px solid var(--line-2);background:var(--sheet);
  cursor:pointer;color:var(--ink);flex:none;vertical-align:middle}
.say svg{width:16px;height:16px}
.kbd{font-size:12.5px;color:var(--mute);margin-top:12px;text-align:center}

/* resultado */
.res{text-align:center;padding:30px 18px 22px}
.res .score{font:400 68px/1 var(--f-type);margin-top:18px;font-variant-numeric:tabular-nums}
.res .unit{color:var(--ink-2);margin-top:6px}
.stamp{position:absolute;right:12px;top:-16px;z-index:5;pointer-events:none;font:400 21px/1 var(--f-type);letter-spacing:.06em;
  color:var(--red);background:var(--sheet);border:3px solid currentColor;border-radius:6px;padding:8px 12px 6px;
  transform:rotate(-9deg);filter:url(#ink);animation:stamp .45s cubic-bezier(.2,1.5,.4,1) both}
.stamp.pen{color:var(--pen)}
.res .stamp{top:-24px;right:8px}
.sec{margin-top:24px;text-align:left;border-top:1px solid var(--line-2);padding-top:14px}
.bt{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.bt .n{font-weight:600;font-size:15.5px}
.bt .n small{display:block;font-weight:400;color:var(--mute);font-size:13px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:flex;gap:2px}
.bar i{flex:1;background:var(--line-2)}
.bar i.y{background:var(--ok)} .bar i.n{background:var(--red)}
.bt .mini{border:1px solid var(--line-2);background:var(--sheet);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;min-height:36px;white-space:nowrap}
.bt .mini.ok{border-color:transparent;background:none;color:var(--ok);cursor:default;padding:6px 4px}
.trap{padding:10px 0;border-bottom:1px solid var(--line)}
.trap .pen{margin:0}
.miss{list-style:none;padding:0;margin:0;text-align:left}
.miss li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.miss .py{font-size:17px}
.miss .hz{font-size:15px;color:var(--ink-2);margin-left:6px}
.miss .tx{font-weight:600}
.miss .es{grid-column:1;font-size:14.5px;font-style:italic;color:var(--ink-2)}
.miss .say{grid-row:1/3;grid-column:2}

@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes stamp{0%{opacity:0;transform:rotate(-9deg) scale(1.9)}65%{opacity:1;transform:rotate(-9deg) scale(.93)}100%{opacity:.94;transform:rotate(-9deg) scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
@media (max-width:380px){h1{font-size:28px}.opts.syl .opt{font-size:21px}.opts.keypad{gap:8px}.slot{width:46px}.cs{font-size:20px}.bt{grid-template-columns:minmax(0,1fr) 80px auto}}
</style>
</head>

d":"tonos","nombre":"Tonos","bloque":"Sonidos","badge":"ǎ","lec":"lecciones 1 a 3","ds":"Los cuatro tonos, el tono liviano y los cambios: {nǐ hǎo|你好}, {bú shì|不是}, {yí ge|一个}.","mezcla":{"tono":4,"par":2,"elegir":4},"ayuda":["Tono 1 (ā): alto y parejo, como cantar una nota larga.","Tono 2 (á): sube, como cuando preguntás «¿eh?».","Tono 3 (ǎ): baja a lo grave y se queda abajo. Se siente en el pecho.","Tono 4 (à): cae fuerte y corto, como un «¡no!».","Liviano, sin marca: {ma|吗}, el me de {shénme|什么}, el segundo xie de {xièxie|谢谢}.","Trampa 2 contra 3: si arranca subiendo, es 2; si arranca bajando o suena grave, es 3.","Cambios: dos tonos 3 seguidos, el primero sube ({nǐ hǎo|你好} suena ní hǎo). {bù|不} antes de tono 4 es bú. {yī|一} antes de tono 4 es yí; antes de 1, 2 o 3, yì."]},{"id":"sonidos","nombre":"Sonidos del pinyin","bloque":"Sonidos","badge":"zh","lec":"lecciones 1 a 3","ds":"g, k, h · j, q, x · zh, ch: cuál sale con aire, cuál lleva la lengua arriba y la ü que no se escribe.","mezcla":{"ini":4,"par":2,"elegir":4},"ayuda":["Con soplido (aire): k, q, ch. Sin soplido: g, j, zh.","h suena como la j de «Juan», un poco más suave.","x: labios estirados, como sonriendo, y una i o ü pegada: {xièxie|谢谢}, {xuésheng|学生}.","zh y ch van con la lengua arriba, contra el paladar. Cambia solo el aire.","Después de j, q, x e y, la u suena ü y no se marca: {xuésheng|学生} suena «xüésheng».","Se escriben corto y suenan largo: {jiǔ|酒} «jiou», {guì|贵} «guei», {shuǐ|水} «shuei»."]},{"id":"saludos","nombre":"Saludos y cortesía","bloque":"Palabras","badge":{"hz":"好","py":"hǎo"},"lec":"lecciones 1 y 2","ds":"Saludar según la hora, agradecer, preguntar con cortesía y reaccionar.","mezcla":{"elegir":4,"vocab":3,"armar":1,"bien":1,"hueco":1},"ayuda":["Saludo = cuándo o a quién + {hǎo|好}: {zǎoshang hǎo|早上好}, {lǎoshī hǎo|老师好}.","{shàngwǔ|上午}: antes del mediodía. {xiàwǔ|下午}: después. {zhōngwǔ|中午}: el medio del día.","{wǎnshang hǎo|晚上好} es para llegar de noche, no para despedirse.","Con título: apellido + título + saludo: {Wáng xiānsheng, zǎo!|王先生，早！}","{qǐngwèn|请问} abre una pregunta; {xièxie|谢谢} agradece; {hǎo de|好的} es «bueno, dale»."]},{"id":"personas","nombre":"Personas y títulos","bloque":"Palabras","badge":{"hz":"您","py":"nín"},"lec":"lecciones 1 y 2","ds":"Yo, vos, usted, ellos; el título después del apellido; hablarle a alguien o hablar de alguien.","mezcla":{"elegir":4,"vocab":2,"bien":2,"armar":1,"hueco":1},"ayuda":["{men|们} arma el plural de personas: {wǒmen|我们}, {nǐmen|你们}, {tāmen|他们}.","{nín|您} es «usted». {tā|他} y {tā|她} suenan igual.","El título va después del apellido: {Lǐ lǎoshī|李老师}, {Wáng xiānsheng|王先生}.","Para hablarle a alguien: nombre + {nǐ|你}: {Mariano, nǐ hē shénme?|Mariano，你喝什么？}","Si te preguntan con {nǐmen|你们}, contestás con {wǒmen|我们}."]},{"id":"tomar","nombre":"Tomar y gustar","bloque":"Palabras","badge":{"hz":"喝","py":"hē"},"lec":"lecciones 2 y 3","ds":"Las bebidas, {hē|喝} y {xǐhuan|喜欢}, y cómo se arman palabras como {nǎichá|奶茶}.","mezcla":{"elegir":3,"vocab":2,"bien":2,"armar":2,"oir":1},"ayuda":["El verbo no cambia: yo, vos y ellos {hē|喝}. Por eso siempre va quién.","quién + {xǐhuan|喜欢} + (verbo) + cosa: {Wǒ xǐhuan hē chá.|我喜欢喝茶。}","{bù|不} y {hěn|很} van antes de {xǐhuan|喜欢}: {bù xǐhuan|不喜欢}, {hěn xǐhuan|很喜欢}.","{hē|喝} (tono 1) es tomar; {hé|和} (tono 2) es «y».","En las palabras armadas, lo último es lo que la cosa es: {nǎichá|奶茶} es un té."]},{"id":"numeros","nombre":"Números y plata","bloque":"Palabras","badge":"7","lec":"lección 3","ds":"Del 0 al 10, {liǎng|两} con plata, precios y números como {bāshíwǔ|八十五}.","mezcla":{"serie":2,"precio":2,"elegir":3,"oir":1,"armar":1,"vocab":1},"ayuda":["Las parejas que más se confunden: 1 {yī|一} y 7 {qī|七} · 4 {sì|四} y 10 {shí|十} · 6 {liù|六} y 9 {jiǔ|九}.","Con plata, el 2 es {liǎng|两}: {liǎng kuài qián|两块钱}.","cosa + número + {kuài|块}: {Chá wǔ kuài qián.|茶五块钱。} Sin {shì|是}.","{bāshíwǔ|八十五}: 8 × 10 + 5 = 85.","En las series, andá tocando mientras escuchás."]},{"id":"paises","nombre":"Países y palabras armadas","bloque":"Palabras","badge":{"hz":"国","py":"guó"},"lec":"lecciones 2 y 3","ds":"Siete países, el país antes de la cosa y las piezas: {guó|国}, {rén|人}, {shàng|上}, {xià|下}.","mezcla":{"elegir":4,"vocab":3,"armar":2,"bien":1},"ayuda":["País + cosa = de dónde es: {Zhōngguó chá|中国茶}, té chino.","{guó|国} es país: {Zhōngguó|中国}, {Měiguó|美国}, {wàiguórén|外国人}.","Lo que describe va primero; lo último es lo que la cosa es.","«El mejor de» un lugar: lugar + {zuìhǎo de|最好的} + cosa."]},{"id":"describir","nombre":"Describir","bloque":"Frases","badge":{"hz":"很","py":"hěn"},"lec":"lecciones 2 y 3","ds":"¿{shì|是} o {hěn|很}?, {bù|不}, {tài…le|太…了} y {zuì|最}. Lindo, alto, caro, barato, rico.","mezcla":{"hueco":2,"bien":2,"armar":2,"oir":2,"elegir":1,"vocab":1},"ayuda":["Con una cosa o una persona va {shì|是}: {Zhè shì píjiǔ.|这是啤酒。}","Con un adjetivo va {hěn|很}: {Píjiǔ hěn hǎohē.|啤酒很好喝。} Acá {hěn|很} casi no dice «muy»: es el pegamento. Sin él, la frase queda cortada.","¿Por qué no {shì|是}? Porque en chino el adjetivo ya hace de verbo: {gāo|高} es «ser alto» entero.","Para negar una cosa, {bú shì|不是}. Para negar un adjetivo o un verbo, {bù|不} solo: {Dàwěi bù gāo.|大伟不高。}","Con un verbo no va nada: {Wǒ hē chá.|我喝茶。}","Con {tài|太}…{le|了} y en la pregunta con {ma|吗}, el {hěn|很} se va: {Tài guì le!|太贵了！} {Hǎohē ma?|好喝吗？}","lugar + {zuì|最} + adjetivo + {de|的} + cosa: {Zhōngguó zuìhǎo de píjiǔ|中国最好的啤酒}.","{hǎohē|好喝} para tomar, {hǎochī|好吃} para comer. {piàoliang|漂亮} más para mujeres, {shuài|帅} para varones."]},{"id":"preguntar","nombre":"Preguntar","bloque":"Frases","badge":{"hz":"吗","py":"ma"},"lec":"lecciones 2 y 3","ds":"{ma|吗}, {shénme|什么}, {duōshǎo qián|多少钱}, esto y eso, {yǒu|有} y {méiyǒu|没有}.","mezcla":{"hueco":2,"bien":2,"armar":2,"elegir":2,"oir":1,"vocab":1},"ayuda":["{ma|吗} al final: pregunta de sí o no.","{shénme|什么} y {duōshǎo|多少} van donde iría la respuesta, sin {ma|吗}.","{Zhè shì shénme?|这是什么？} → {Zhè shì chá.|这是茶。}","{yǒu|有} se niega con {méi|没}: {méiyǒu|没有}. Nunca {bù yǒu|不有}.","número + {ge|个} + cosa: {yí ge wèntí|一个问题}."]},{"id":"qa","nombre":"Preguntas y respuestas","bloque":"Preguntas y respuestas","badge":{"hz":"问","py":"wèn"},"lec":"lecciones 2 y 3","ds":"Ves una pregunta y elegís la respuesta, o ves una respuesta y elegís qué pregunta va.","mezcla":{"resp":5,"preg":5},"ayuda":["La respuesta usa el mismo orden que la pregunta: lo que se contesta va en el lugar de {shénme|什么}.","A {nǐ|你} se contesta con {wǒ|我}; a {nǐmen|你们}, con {wǒmen|我们}.","A una pregunta con {ma|吗}: {shì de|是的}, {bù|不} o el verbo repetido: {xǐhuan|喜欢}, {bù xǐhuan|不喜欢}.","A {duōshǎo qián|多少钱} se contesta con número + {kuài|块}. A {yǒu … ma|有…吗}, con {yǒu|有} o {méiyǒu|没有}.","La respuesta no lleva {ma|吗}, y la pregunta con {shénme|什么} tampoco."]},{"id":"escribir","nombre":"Contestá escribiendo","bloque":"Preguntas y respuestas","badge":"✎","lec":"lecciones 1 a 3","ds":"Escribís la respuesta, la pregunta o la frase entera. En pinyin con los tonos en números (wo3 he1 cha2), sin tonos o en hanzi.","mezcla":{"esc_resp":4,"esc_preg":3,"esc_trad":3},"ayuda":["Escribí en pinyin o en hanzi. Los espacios y la puntuación no importan.","Los tonos van con números después de cada sílaba: wo3 he1 cha2. El liviano, sin número: shen2me.","La ü se escribe v: nv3shi4 es {nǚshì|女士}.","Si escribís sin tonos, vale igual, pero te muestra cómo van. Si ponés un tono mal, te marca cuál.","Si una respuesta tiene más de una forma, vale cualquiera: {liǎng kuài qián|两块钱} o {liǎng kuài|两块}."]},{"id":"dialogos","nombre":"Diálogos","bloque":"Frases","badge":"¿?","lec":"lecciones 2 y 3","ds":"En el café y en el negocio: escuchá o leé, y contestá.","mezcla":{"elegir":6,"oir":3,"hueco":1},"ayuda":["En el café, el mozo pregunta {nǐmen hē shénme?|你们喝什么？} y cada uno pide lo suyo.","En el negocio: {Qǐngwèn, zhè shì shénme?|请问，这是什么？} y {Duōshǎo qián?|多少钱？}","Si no te sale de oído, tocá «Más lento»."]}],"pool":{"saludos":["你好","老师好","早","早上好","上午好","中午好","下午好","晚上好","谢谢","好的","是的","很好","一般般","哈哈","哦","请问"],"personas":["我","你","您","他","她","我们","你们","他们","老师","学生","先生","太太","小姐","女士","老外","外国人","服务生","营业员"],"tomar":["喝","喜欢","和","茶","咖啡","水","果汁","可乐","牛奶","酒","奶茶","珍珠奶茶","啤酒","白酒","炒饭"],"describir":["好","高","贵","漂亮","帅","好喝","好吃","好看","好听","好玩","最","最好的","便宜","很","太"],"preguntar":["这","那","多少","有","没有","问","问题","个","真的","什么","吗","请问"],"numeros":["钱","块","元","多少钱","太贵了","零","一","二","三","四","五","六","七","八","九","十","两"],"paises":["中国","阿根廷","美国","巴西","西班牙","英国","法国","国","人","外","中","上","下","午"]},"tonos":{"desc":{"1":"alto y parejo","2":"sube","3":"baja a lo grave","4":"cae fuerte","0":"liviano"},"palabras":[{"hz":"茶","py":"chá","es":"té","t":2,"op":["chā","chá","chǎ","chà"],"ojo":"ch con soplido. {chǎo|炒} de {chǎofàn|炒饭} baja (tono 3)."},{"hz":"喝","py":"hē","es":"tomar","t":1,"op":["hē","hé","hě","hè"],"ojo":"Ojo con {hé|和}, «y»: misma sílaba con tono 2."},{"hz":"和","py":"hé","es":"y","t":2,"op":["hē","hé","hě","hè"],"ojo":"Ojo con {hē|喝}, tomar: misma sílaba con tono 1."},{"hz":"高","py":"gāo","es":"alto","t":1,"op":["gāo","gáo","gǎo","gào"],"ojo":""},{"hz":"书","py":"shū","es":"libro","t":1,"op":["shū","shú","shǔ","shù"],"ojo":""},{"hz":"他","py":"tā","es":"él","t":1,"op":["tā","tá","tǎ","tà"],"ojo":"Suena igual que {tā|她}, ella."},{"hz":"三","py":"sān","es":"tres","t":1,"op":["sān","sán","sǎn","sàn"],"ojo":"Ojo con {sì|四}: los dos arrancan con s."},{"hz":"七","py":"qī","es":"siete","t":1,"op":["qī","qí","qǐ","qì"],"ojo":"q con soplido. Ojo con {yī|一}."},{"hz":"八","py":"bā","es":"ocho","t":1,"op":["bā","bá","bǎ","bà"],"ojo":""},{"hz":"钱","py":"qián","es":"plata, dinero","t":2,"op":["qiān","qián","qiǎn","qiàn"],"ojo":"Se escribe sin u."},{"hz":"十","py":"shí","es":"diez","t":2,"op":["shī","shí","shǐ","shì"],"ojo":"Ojo con {sì|四} (4) y con {shì|是} (ser)."},{"hz":"人","py":"rén","es":"persona","t":2,"op":["rēn","rén","rěn","rèn"],"ojo":""},{"hz":"零","py":"líng","es":"cero","t":2,"op":["līng","líng","lǐng","lìng"],"ojo":"Ojo con {liù|六}: los dos arrancan con l."},   if (t.badge && typeof t.badge === 'object') return `<span class="badge" aria-hidden="true"><span class="hz" lang="zh-Hans">${esc(t.badge.hz)}</span><span class="bp">${esc(t.badge.py)}</span></span>`;
  return `<span class="badge" aria-hidden="true">${esc(t.badge)}</span>`;
}
function renderHome() {
  view = 'home'; G = null; hush();
  const noVoice = TTS.checked && !TTS.ok;
  const bloques = [...new Set(TEMAS.map(t => t.bloque))];
  const ult = S.exam.ult;
  const dots = ult ? `<div class="dots">${TEMAS.map(t => { const r = ult[t.id]; const v = r ? r[0] : 0; return `<span class="dot v${v}"><i></i>${esc(t.nombre)} ${r ? r[0] + '/' + r[1] : ''}</span>`; }).join('')}</div>` : '';
  const nErr = S.err.length;
  main.innerHTML = `
    <section class="hero">
      <div class="lab">lecciones 1, 2 y 3</div>
      <h1>Repaso</h1>
      <p class="lead">Todo lo que viste hasta ahora, tema por tema: tonos, sonidos, saludos, personas, bebidas, números, países, frases, preguntas y respuestas, y los dos diálogos. Casi todo se contesta tocando; en «Contestá escribiendo», escribís. Si le errás, te dice por qué.</p>
      ${noVoice ? `<div class="warn"><b>Este dispositivo no tiene voz en chino.</b> Las preguntas de escuchar pasan a ser de leer, y no hay series de números. Para escuchar, instalá una voz de chino (China continental) en los ajustes de texto a voz y volvé a abrir la página.</div>` : ''}
    </section>
    <section class="exam">
      <div class="lab">examen final</div>
      <h2>Todo mezclado</h2>
      <p>${TEMAS.length * PER_TEMA} preguntas, tres de cada tema. Al final ves en qué tema te conviene practicar.</p>
      ${dots}
      <div class="row">
        <button class="btn red" type="button" data-exam="1">${S.exam.n ? 'Hacer otro examen' : 'Empezar el examen'}</button>
        ${S.exam.n ? `<span class="tag best">mejor: ${S.exam.best} de ${TEMAS.length * PER_TEMA}</span>` : ''}
      </div>
    </section>
    ${nErr ? `<button class="errs" type="button" data-errores="1"><span><b>Repasar lo que fallaste</b><br>${nErr === 1 ? 'Queda 1 pregunta' : `Quedan ${nErr} preguntas`} de tandas anteriores.</span><svg aria-hidden="true"><use href="#i-go"/></svg></button>` : ''}
    ${bloques.map(b => `<section class="group"><div class="lab">${esc(b)}</div><div class="modes">${TEMAS.filter(t => t.bloque === b).map(modeCard).join('')}</div></section>`).join('')}
    <div class="foot">
      <span id="sync">Tu progreso se guarda en este navegador.</span>
      <span>La voz es la de tu celular o tu compu. Las frases dicen de dónde salen: «manual» es de clase o del libro; «generada», armada con palabras vistas.</span>
    </div>`;
  renderSync();
}
function modeCard(t) {
  const best = S.best[t.id];
  const nrep = S.err.filter(k => (EJID[k] && EJID[k].tema === t.id) || k.startsWith(`voc:${t.id}:`) || (t.id === 'tonos' && k.startsWith('tono:')) || (t.id === 'sonidos' && k.startsWith('ini:'))).length;
  return `<button class="mode" type="button" data-tema="${t.id}">
      ${badgeHtml(t)}
      <span class="nm">${rich(t.nombre)}</span>
      <span class="ds">${rich(t.ds)}</span>
      <span class="ft"><span class="tag">${esc(t.lec)}</span>${best !== undefined ? `<span class="tag best">mejor: ${best} de ${ROUND}</span>` : ''}${nrep ? `<span class="tag rep">${nrep} para repasar</span>` : ''}</span>
      ${best !== undefined ? `<span class="meter" aria-hidden="true"><b style="width:${best * 10}%"></b></span>` : ''}
    </button>`;
}

function start(mode, id) {
  let items, title;
  if (mode === 'exam') { items = buildExam(); title = 'Examen final'; }
  else if (mode === 'err') { items = buildErrores(); title = 'Lo que fallaste'; }
  else { items = buildTema(id); title = TM[id].nombre; }
  if (!items.length) { renderHome(); return; }
  const first = mode === 'tema' && !(S.rondas[id] > 0);
  G = {mode, id, title, items, i:0, score:0, misses:[], traps:[], porTema:{}, helpOpen:first};
  view = 'game';
  renderQ(true);
}

function gbar() {
  return `<div class="gbar">
      <button class="back" type="button" data-act="home"><svg aria-hidden="true"><use href="#i-back"/></svg>Volver</button>
      <span class="gtitle">${rich(G.title)}</span>
      ${view === 'game' ? `<span class="gstat"><b>${G.i + 1}</b> de ${G.items.length} · ${G.score} bien</span>` : ''}
    </div>`;
}
function helpHtml(q) {
  const t = TM[q.tema];
  if (!t || !t.ayuda) return '';
  const open = G.mode === 'tema' && G.helpOpen;
  return `<details class="help" id="help"${open ? ' open' : ''}><summary>${G.mode === 'tema' ? 'La regla, en corto' : 'Ayuda: ' + esc(t.nombre)}</summary><ul>${t.ayuda.map(s => `<li>${rich(s)}</li>`).join('')}</ul></details>`;
}
function zhPrompt(q, answered) {
  if (!q.zh || (q.hideZh && !answered)) return '';
  let p = esc(q.zh.py), h = esc(q.zh.hz);
  if (p.includes('＿')) {
    if (answered) {
      const o = q.rel || q.opts[q.ok];
      const fp = o.py === undefined ? '' : o.py, fh = o.hz === undefined ? '' : o.hz;
      p = fp ? p.replace('＿', `<span class="hole fill">${esc(fp)}</span>`) : p.replace(/\s*＿\s*/, ' ').replace(/ ([,.!?])/g, '$1');
      h = fh ? h.replace('＿', `<span class="hole fill">${esc(fh)}</span>`) : h.replace('＿', '');
    } else { p = p.replace('＿', '<span class="hole"></span>'); h = h.replace('＿', '<span class="hole"></span>'); }
  }
  const big = !p.includes(' ') && !p.includes('hole') && q.zh.py.length < 14;
  const oye = q.oye && TTS.ok;
  return `<div class="zhp${big ? ' big' : ''}${oye ? ' oye' : ''}" id="zhp"><div class="p">${p}</div><div class="h" lang="zh-Hans">${h}</div>${oye ? sayBtn(q.zh.hz, 'Escuchar') : ''}</div>`;
}
function listenHtml(q) {
  const sp = q.vel ? `<span class="speed${q.fast ? ' fast' : ''}">${q.vel === 'normal' ? 'velocidad normal' : q.vel}</span>` : '';
  return `<div class="listen">
      <button class="play" type="button" data-act="play" aria-label="Escuchar">${EAR}</button>
      ${sp}
      <button class="slow" type="button" data-act="slow">Más lento</button>
    </div>
    <p class="ask">${rich(q.pide)}</p>`;
}
function optHtml(q, o, i) {
  let inner;
  if (o.t !== undefined) inner = `<span class="tx">${rich(o.t)}</span>`;
  else inner = zhSpan(o.py, o.hz) + (o.es ? `<span class="oes">${esc(o.es)}</span>` : '');
  const why = o.pq ? `<span class="why">${rich(o.pq)}</span>` : '';
  return `<button class="opt" type="button" data-opt="${i}">${inner}${why}</button>`;
}
function slotsHtml(q) {
  return q.nums.map((n, i) => {
    const v = q.input[i];
    if (q.answered) {
      const good = v === n;
      return `<span class="slot ${good ? 'ok' : 'bad'}">${v === undefined ? '' : v}${good ? '' : `<span class="fix">${n}</span>`}</span>`;
    }
    return `<span class="slot${i === q.input.length ? ' cur' : ''}">${v === undefined ? '' : v}</span>`;
  }).join('');
}
function tileBtn(t, where, cls) {
  return `<button class="tile${cls ? ' ' + cls : ''}" type="button" data-tile="${t.id}" data-where="${where}"${cls === 'used' ? ' tabindex="-1" aria-hidden="true"' : ''}><span class="py">${esc(t.py)}</span><span class="hz" lang="zh-Hans">${esc(t.hz)}</span></button>`;
}
function buildHtml(q) {
  if (!q.placed.length) return '<span class="ph">Tocá las fichas en orden.</span>';
  return q.placed.map(t => tileBtn(t, 'build', q.answered ? (q.bad && q.bad.has(t.id) ? 'bad' : 'ok') : '')).join('');
}
function bankHtml(q) { return q.bank.map(t => tileBtn(t, 'bank', q.placed.includes(t) ? 'used' : '')).join(''); }

function bodyHtml(q) {
  const listen = !!q.oir || q.kind === 'serie';
  const head = G.mode !== 'tema' ? `<div class="qhead"><span class="tchip">${esc(TM[q.tema].nombre)}</span></div>` : '';
  if (q.kind === 'serie') {
    return head + listenHtml(q) + `<div class="slots" id="slots" aria-live="polite">${slotsHtml(q)}</div>
      <div class="opts keypad">${N.map(x => `<button class="opt dig" type="button" data-key="${x.n}">${x.n}</button>`).join('')}<button class="opt del" type="button" data-key="del" aria-label="Borrar el último"><svg aria-hidden="true"><use href="#i-del"/></svg></button></div>
      <div class="actions" id="tools"><button class="btn wide" type="button" id="check" data-act="check" disabled>Comprobar</button></div>`;
  }
  if (q.kind === 'escribir') {
    return head + `<div class="lab">${esc(q.pide)}</div>${zhPrompt(q, false)}${q.es ? `<p class="prompt-es">${rich(q.es)}</p>` : ''}
      <input class="inp" id="resp" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="Pinyin o hanzi" aria-label="Tu respuesta">
      <p class="hint">Tonos con números: wo3 he1 cha2 · la ü se escribe v</p>
      <div class="actions" id="tools"><button class="btn wide" type="button" id="check" data-act="check" disabled>Comprobar</button><button class="btn ghost" type="button" data-act="nose">No sé</button></div>`;
  }
  if (q.kind === 'armar') {
    return head + `<div class="lab">${esc(q.pide)}</div><p class="prompt-es">${rich(q.es)}</p>
      <div class="build" id="build">${buildHtml(q)}</div>
      <div class="bank" id="bank">${bankHtml(q)}</div>
      <div class="actions" id="tools"><button class="btn wide" type="button" id="check" data-act="check" disabled>Comprobar</button><button class="btn ghost" type="button" data-act="clear">Borrar</button></div>`;
  }
  const top = listen ? listenHtml(q) : `<div class="lab">${rich(q.pide)}</div>${q.es ? `<p class="prompt-es">${rich(q.es)}</p>` : ''}`;
  const esLine = listen && q.es ? `<p class="prompt-es">${rich(q.es)}</p>` : '';
  return head + top + esLine + `<div id="zhbox">${zhPrompt(q, false)}</div>
    <div class="opts ${q.estilo || ''}${tres(q) ? ' tres' : ''}">${q.opts.map((o, i) => optHtml(q, o, i)).join('')}</div>`;
}

const tres = q => q.estilo === 'syl' && q.opts.length === 3 && q.opts.every(o => (o.py || o.t || '').length <= 6);
function renderQ(speakNow) {
  const q = G.items[G.i], n = G.items.length;
  main.innerHTML = `${gbar()}
    <div class="prog"><b style="width:${(G.i / n) * 100}%"></b></div>
    ${helpHtml(q)}
    <div class="board" id="board">
      ${bodyHtml(q)}
      <div id="fb"></div>
    </div>
    <p class="kbd" aria-hidden="true">${q.kind === 'escribir' ? 'Enter para comprobar y para seguir.' : 'En la compu: 1 a 5 para elegir, Enter para seguir.'}</p>`;
  if (speakNow) playQ(q);
  if (q.kind === 'escribir') { const inp = $('#resp'); if (inp) inp.focus({preventScroll:true}); }
}
function playQ(q, slow) {
  if (q.kind === 'serie') say(q.say, slow ? VEL.lento : q.rate);
  else if (q.oir) say(q.oir, slow ? 0.55 : 0.85);
}

/* ---------- contestar ---------- */
function settle(q, good) {
  q.answered = true; q.good = good;
  if (good) G.score++; else G.misses.push(q);
  const pt = G.porTema[q.tema] || (G.porTema[q.tema] = [0, 0]);
  pt[1]++; if (good) pt[0]++;
  markErr(q.key, good);
  touch();
  $('.gstat').innerHTML = `<b>${G.i + 1}</b> de ${G.items.length} · ${G.score} bien`;
  $('#live').textContent = good ? 'Bien.' : 'No, era otra.';
  $('#board').classList.add('answered');
}
function answer(idx) {
  const q = G.items[G.i];
  if (!q || q.answered || q.kind === 'serie' || q.kind === 'armar' || idx >= q.opts.length) return;
  const good = idx === q.ok;
  q.chosen = idx;
  settle(q, good);
  main.querySelectorAll('[data-opt]').forEach(b => {
    b.disabled = true;
    const v = Number(b.dataset.opt);
    if (v === q.ok) b.classList.add('ok');
    else if (v === idx) b.classList.add('bad');
  });
  if (q.zh) $('#zhbox').innerHTML = zhPrompt(q, true);
  const ch = q.opts[idx];
  if (!good && ch.pq) G.traps.push({txt:ch.pq, tema:q.tema});
  $('#fb').innerHTML = feedback(q, good, ch);
  if (['bien', 'hueco'].includes(q.kind) && q.f) say(F[q.f].hz);
  const nx = $('#next'); if (nx) nx.focus({preventScroll:true});
}
function keyIn(k) {
  const q = G.items[G.i];
  if (q.kind !== 'serie' || q.answered) return;
  if (k === 'del') q.input.pop();
  else if (q.input.length < q.nums.length) q.input.push(Number(k));
  $('#slots').innerHTML = slotsHtml(q);
  $('#check').disabled = q.input.length < q.nums.length;
}
function checkSerie(q) {
  if (q.input.length < q.nums.length) return;
  const good = q.nums.every((n, i) => n === q.input[i]);
  settle(q, good);
  const kp = main.querySelector('.opts.keypad'); if (kp) kp.remove();
  $('#tools').remove();
  const sl = $('#slots'); sl.classList.add('checked'); sl.innerHTML = slotsHtml(q);
  $('#fb').innerHTML = feedback(q, good, null);
}
function checkArmar(q) {
  if (!q.placed.length) return;
  const ids = q.placed.map(t => t.id);
  const s = q.sig(ids);
  const good = q.okSigs.includes(s);
  q.viaAlt = good && s !== q.okSigs[0];
  if (!good) {
    const canon = q.tiles.map(t => t.id);
    q.bad = new Set(ids.filter(id => id === 'x'));
    if (ids.includes('x')) q.why = q.bank.find(t => t.id === 'x').pq;
    else if (ids.length < canon.length) q.why = 'Te faltó ' + q.tiles.filter(t => !ids.includes(t.id)).map(t => mk(t.py, t.hz)).join(', ') + '.';
    else {
      const mp = misplaced(ids, canon, q.sig);
      if (mp !== null) {
        const t = q.tiles[Number(mp)];
        q.why = `Fijate dónde va ${mk(t.py, t.hz)}.`;
        q.bad.add(mp);
      } else {
        let k = 0; while (k < ids.length && q.sig([ids[k]]) === q.sig([canon[k]])) k++;
        const want = q.tiles[Number(canon[k])];
        q.why = `En ese lugar iba ${mk(want.py, want.hz)}.`;
        ids.forEach((id, j) => { if (id !== 'x' && q.sig([id]) !== q.sig([canon[j]])) q.bad.add(id); });
      }
    }
    G.traps.push({txt:q.why, tema:q.tema});
  }
  settle(q, good);
  $('#tools').remove();
  $('#build').innerHTML = buildHtml(q);
  $('#bank').remove();
  main.querySelectorAll('.tile').forEach(b => { b.disabled = true; });
  $('#fb').innerHTML = feedback(q, good, null);
  if (q.f) say(F[q.f].hz);
}
/* si sacando una sola ficha queda igual, esa es la que está fuera de lugar */
function misplaced(ids, canon, sig) {
  for (const id of ids) {
    const a = ids.filter(x => x !== id), b = canon.filter(x => x !== id);
    if (sig(a) === sig(b)) return id;
  }
  return null;
}
function checkEscribir(q, nose) {
  if (q.answered) return;
  const inp = $('#resp');
  q.input = nose ? '' : (inp ? inp.value : '');
  if (!nose && !q.input.trim()) return;
  const r = nose ? {nivel:'no', modo:'nose'} : evaluar(q, q.input);
  q.r = r;
  settle(q, r.nivel !== 'no');
  if (r.nivel === 'casi') markErr(q.key, false);
  if (inp) { inp.disabled = true; inp.classList.add(r.nivel === 'bien' ? 'ok' : r.nivel === 'casi' ? 'casi' : 'bad'); }
  const tools = $('#tools'); if (tools) tools.remove();
  const hint = main.querySelector('.board .hint'); if (hint) hint.remove();
  $('#fb').innerHTML = feedback(q, r.nivel !== 'no', null);
  if (q.f) say(F[q.f].hz);
  const nx = $('#next'); if (nx) nx.focus({preventScroll:true});
}
function tileTap(id, where) {
  const q = G.items[G.i];
  if (q.kind !== 'armar' || q.answered) return;
  if (where === 'bank') { const t = q.bank.find(x => x.id === id); if (t && !q.placed.includes(t)) q.placed.push(t); }
  else q.placed = q.placed.filter(x => x.id !== id);
  $('#build').innerHTML = buildHtml(q);
  $('#bank').innerHTML = bankHtml(q);
  $('#check').disabled = !q.placed.length;
}

const cmpRows = rows => `<div class="cmp">${rows.map(r => `<div class="cr ${r.cls || ''}"><span class="cl">${r.lab}</span><span class="cs">${esc(r.py)}${r.hz ? `<span class="hz" lang="zh-Hans">${esc(r.hz)}</span>` : ''}</span>${r.t ? `<span class="ct">${contour(r.t)}tono ${r.t}</span>` : ''}${sayBtn(r.say, 'Escuchar ' + r.py)}</div>`).join('')}</div>`;
function fraseHtml(fid) {
  const f = F[fid];
  return `<div class="ans">${zhSpan(f.py, f.hz)}${sayBtn(f.hz, 'Escuchar la frase')}</div><div class="es">${esc(f.es)}</div>`;
}
function feedback(q, good, ch) {
  let head = `<div class="head">${good ? '¡Bien!' : 'Era otra'}</div>`, body = '', extra = '';
  const okO = q.opts ? q.opts[q.ok] : null;
  if (q.kind === 'escribir') {
    const r = q.r, f = F[q.f];
    const ok = r.ok || q.ok[0];
    head = `<div class="head">${r.nivel === 'bien' ? '¡Bien!' : r.nivel === 'casi' ? 'Bien, revisá los tonos' : 'Era otra'}</div>`;
    const tuya = r.modo === 'nose' ? '' : `<p class="yours">Escribiste: <b>${esc(q.input.trim())}</b></p>`;
    body = tuya + `<div class="ans">${zhSpan(ok.py, ok.hz)}${sayBtn(ok.hz, 'Escuchar')}</div>${q.modo !== 'esc_trad' ? `<div class="es">${esc(f.es)}</div>` : ''}`;
    if (r.nivel === 'casi') {
      const t = r.malos.map(x => `${conTono(x.b, x.e)} va con tono ${x.e} (${D.tonos.desc[x.e]}); pusiste ${conTono(x.b, x.u)}.`)
        .concat(r.faltan.map(x => `A ${conTono(x.b, x.e)} le faltó el tono: ${x.e}.`));
      extra += t.map(s => `<p class="pen no">${esc(s)}</p>`).join('');
      G.traps.push({txt:t[0], tema:q.tema});
    } else if (r.nivel === 'bien' && r.sinTonos) {
      extra += `<p class="pen">Con tonos: ${esc(conNumeros(ok.sil))}</p>`;
    } else if (r.nivel === 'no') {
      const otras = q.ok.filter(o => o !== ok);
      if (otras.length) extra += `<p class="alts">También vale: ${otras.map(o => zhSpan(o.py, o.hz)).join(' · ')}</p>`;
    }
    extra += pen(q.exp) + src(f.fuente);
  } else if (q.kind === 'tono') {
    const w = q.w;
    const rows = [{lab:q.oir ? 'Sonó' : 'Era', py:w.py, hz:w.hz, say:w.hz, cls:'ok', t:w.t}];
    if (!good) rows.push({lab:'Elegiste', py:ch.py, cls:'bad', t:ch.tn});
    body = cmpRows(rows) + `<div class="es">${esc(w.es)}</div>`;
    if (!good) {
      const k = `${Math.min(w.t, ch.tn)}-${Math.max(w.t, ch.tn)}`;
      extra = pen(D.tonos.pistas[k], true);
      G.traps.push({txt:D.tonos.pistas[k], tema:q.tema});
    } else extra = pen(`Tono ${w.t}: ${D.tonos.desc[w.t]}.`);
    if (w.ojo) extra += pen(w.ojo);
  } else if (q.kind === 'ini') {
    const x = q.x;
    const py = x.sils.map((s, i) => i === x.i ? `<span class="hl">${esc(s)}</span>` : esc(s)).join('');
    body = `<div class="ans"><span class="zh"><span class="py">${py}</span><span class="hz" lang="zh-Hans">${esc(x.hz)}</span></span>${sayBtn(x.hz)}</div><div class="es">${esc(x.es)}</div>`;
    extra = pen(D.iniciales.tips[x.letra]);
    if (!good) {
      const k = `${x.letra}>${ch.py}`;
      const tip = D.iniciales.pistas[k] || `Elegiste ${ch.py}. ` + D.iniciales.tips[ch.py];
      extra += pen(tip, true);
      G.traps.push({txt:tip, tema:q.tema});
    }
  } else if (q.kind === 'serie') {
    body = `<div class="ans">${zhSpan(q.nums.map(n => N[n].py).join(' · '), q.nums.map(n => N[n].hz).join(' '))}${sayBtn(q.say, 'Escuchar', q.rate)}</div><div class="es">${q.nums.join(' · ')}</div>`;
    if (!good) {
      const sorted = a => a.slice().sort((x, y) => x - y).join(',');
      if (sorted(q.nums) === sorted(q.input)) extra = pen('Estaban todos los números, pero en otro orden. Andá tocando mientras escuchás.', true);
      else {
        const done = new Set();
        q.nums.forEach((n, i) => {
          const c = q.input[i];
          if (c === n || done.has(pairKey(n, c))) return;
          done.add(pairKey(n, c));
          const t = NUM.pistas[pairKey(n, c)] || `Sonó ${mk(N[n].py, N[n].hz)}, ${n}, y tocaste ${c}, que es ${mk(N[c].py, N[c].hz)}.`;
          extra += pen(t, true);
          G.traps.push({txt:t, tema:q.tema});
        });
      }
    }
  } else if (q.kind === 'precio') {
    body = `<div class="ans">${zhSpan(q.py, q.hz)}${sayBtn(q.say)}</div><div class="es">${esc(q.es)}</div>`;
    if (!good) {
      const a = q.v, b = ch.v;
      const t = (a === 2 || b === 2) ? NUM.pistas.liang : (NUM.pistas[pairKey(a, b)] || `Sonó ${mk(numOf(a, true).py, numOf(a, true).hz)}, ${a}.`);
      extra = pen(t, true);
      G.traps.push({txt:t, tema:q.tema});
    } else if (q.v === 2) extra = pen(NUM.pistas.liang);
  } else if (q.kind === 'armar') {
    body = fraseHtml(q.f);
    extra = good ? (q.viaAlt && q.altNota ? pen(q.altNota) : '') + pen(q.exp) : pen(q.why, true) + pen(q.exp);
    extra += src(F[q.f].fuente);
  } else {
    const enPantalla = q.zh && q.f && (q.kind === 'hueco' || q.kind === 'oir' || q.zh.hz === F[q.f].hz);
    if (q.f && enPantalla) body = q.kind === 'hueco' ? '' : (q.kind === 'oir' ? '' : `<div class="es">${esc(F[q.f].es)}</div>`);
    else if (q.f) body = fraseHtml(q.f);
    else if (okO && okO.t !== undefined) body = `<div class="ans"><span class="tx">${rich(okO.t)}</span></div>`;
    else if (okO) body = `<div class="ans">${zhSpan(okO.py, okO.hz)}${sayBtn(q.decir || okO.hz)}</div>${okO.es ? `<div class="es">${esc(okO.es)}</div>` : ''}`;
    if (q.f && q.kind !== 'oir' && okO && okO.t !== undefined && !q.zh) body = `<div class="ans"><span class="tx">${rich(okO.t)}</span></div>` + body;
    const grid = ['syl', 'dos', 'cinco'].includes(q.estilo);
    if (!good && ch && ch.pq && grid) extra += `<p class="pen no">Por qué no ${ch.t !== undefined ? rich(ch.t) : esc(ch.py)}: ${rich(lc(ch.pq))}</p>`;
    extra += pen(q.exp);
    if (q.f) extra += src(F[q.f].fuente);
  }
  const last = G.i === G.items.length - 1;
  const sayTxt = q.f ? F[q.f].hz : q.decir || q.oir || (q.kind === 'serie' ? q.say : '') || (okO && okO.hz) || '';
  const again = q.oir || q.kind === 'serie' ? `<button class="btn ghost" type="button" data-act="play">Escuchar otra vez</button>`
    : (sayTxt ? `<button class="btn ghost" type="button" data-say="${esc(sayTxt)}">Escuchar</button>` : '');
  const cls = q.kind === 'escribir' && q.r.nivel === 'casi' ? ' casi' : good ? '' : ' no';
  return `<div class="fb${cls}">${head}${body}${extra}</div>
    <div class="actions">${TTS.ok ? again : ''}<button class="btn" type="button" id="next" data-act="next">${last ? 'Ver cómo me fue' : 'Siguiente'}</button></div>`;
}

function next() {
  G.helpOpen = !!G.helpPinned;
  if (G.i < G.items.length - 1) { G.i++; renderQ(true); window.scrollTo({top:0}); }
  else renderEnd();
}

function missLine(q) {
  if (q.kind === 'escribir') { const f = F[q.f]; return {py:f.py, hz:f.hz, es:f.es, say:f.hz}; }
  if (q.kind === 'tono') return {py:q.w.py, hz:q.w.hz, es:q.w.es, say:q.w.hz};
  if (q.kind === 'ini') return {py:q.x.py, hz:q.x.hz, es:q.x.es, say:q.x.hz};
  if (q.kind === 'serie') return {py:q.nums.map(n => N[n].py).join(' · '), hz:q.nums.map(n => N[n].hz).join(' '), es:q.nums.join(' · '), say:q.say, rate:q.rate};
  if (q.kind === 'precio') return {py:q.py, hz:q.hz, es:q.es, say:q.say};
  if (q.f) return {py:F[q.f].py, hz:F[q.f].hz, es:F[q.f].es, say:F[q.f].hz};
  const o = q.opts[q.ok];
  const consigna = (q.es || (q.zh ? q.zh.py : '') || q.pide || '').replace(/\{([^{}|]+)\|[^{}|]+\}/g, '$1');
  if (o.t !== undefined) return {tx:o.t, es:consigna, say:q.decir || ''};
  return {py:o.py, hz:o.hz, es:o.es || (q.w ? q.w.es : consigna), say:q.decir || o.hz};
}

function renderEnd() {
  view = 'end'; hush();
  const n = G.items.length, s = G.score;
  if (G.mode === 'tema') {
    if ((S.best[G.id] || 0) < s || S.best[G.id] === undefined) S.best[G.id] = Math.max(S.best[G.id] || 0, s);
    S.rondas[G.id] = (S.rondas[G.id] || 0) + 1;
  } else if (G.mode === 'exam') {
    S.exam.best = Math.max(S.exam.best || 0, s); S.exam.n = (S.exam.n || 0) + 1; S.exam.ult = G.porTema;
  }
  touch(); flush();
  const ratio = s / n;
  const st = ratio >= .9 ? '¡Muy bien!' : ratio >= .6 ? 'Bien' : 'A repasar';
  const bt = G.mode === 'exam' ? `<section class="sec"><div class="lab">Por tema</div>${TEMAS.map(t => {
      const r = G.porTema[t.id] || [0, 0];
      const bars = Array.from({length:r[1]}, (_, i) => `<i class="${i < r[0] ? 'y' : 'n'}"></i>`).join('');
      const ok = r[1] && r[0] === r[1];
      return `<div class="bt"><span class="n">${esc(t.nombre)}<small>${r[0]} de ${r[1]}</small></span><span class="bar">${bars}</span>${ok ? '<span class="mini ok">✓</span>' : `<button class="mini" type="button" data-tema="${t.id}">Practicar</button>`}</div>`;
    }).join('')}</section>` : '';
  const seen = new Set(), traps = G.traps.filter(t => { if (!t.txt || seen.has(t.txt)) return false; seen.add(t.txt); return true; }).slice(0, 4);
  const trapHtml = traps.length ? `<section class="sec"><div class="lab">Las trampas en las que caíste</div>${traps.map(t => `<div class="trap">${pen(t.txt)}</div>`).join('')}</section>` : '';
  const miss = G.misses.length ? `<section class="sec"><div class="lab">Las respuestas que iban</div><ul class="miss">${G.misses.map(q => { const l = missLine(q); return `<li><span>${l.tx !== undefined ? `<span class="tx">${rich(l.tx)}</span>` : zhSpan(l.py, l.hz)}</span><span class="es">${esc(l.es || '')}</span>${sayBtn(l.say, 'Escuchar', l.rate)}</li>`; }).join('')}</ul>
      <p class="hint">Quedan guardadas en «Repasar lo que fallaste», en el inicio.</p></section>` : '';
  main.innerHTML = `${gbar()}
    <div class="prog"><b style="width:100%"></b></div>
    <div class="board res">
      <span class="stamp${ratio >= .6 ? '' : ' pen'}">${st}</span>
      <div class="score">${s}<span class="mute"> / ${n}</span></div>
      <div class="unit">${s === n ? 'Todas bien.' : `Te ${n - s === 1 ? 'quedó una' : `quedaron ${n - s}`} para repasar.`}</div>
      ${bt}${trapHtml}${miss}
      <div class="actions" style="justify-content:center">
        <button class="btn" type="button" data-act="again">${G.mode === 'exam' ? 'Otro examen' : 'Otra tanda'}</button>
        <button class="btn ghost" type="button" data-act="home">Volver al inicio</button>
      </div>
    </div>`;
  window.scrollTo({top:0});
}

/* ============================================================
   Eventos
   ============================================================ */
document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.id === 'brand') { renderHome(); window.scrollTo({top:0}); return; }
  if (t.dataset.exam) { start('exam'); window.scrollTo({top:0}); return; }
  if (t.dataset.errores) { start('err'); window.scrollTo({top:0}); return; }
  if (t.dataset.tema) { start('tema', t.dataset.tema); window.scrollTo({top:0}); return; }
  if (t.dataset.opt !== undefined && G && view === 'game') { answer(Number(t.dataset.opt)); return; }
  if (t.dataset.key !== undefined && G && view === 'game') { keyIn(t.dataset.key); return; }
  if (t.dataset.tile !== undefined && G && view === 'game') { tileTap(t.dataset.tile, t.dataset.where); return; }
  if (t.dataset.say) { say(t.dataset.say, t.dataset.rate ? Number(t.dataset.rate) : undefined); return; }
  const act = t.dataset.act, q = G && view === 'game' ? G.items[G.i] : null;
  if (act === 'home') { renderHome(); window.scrollTo({top:0}); }
  else if (act === 'play' && q) playQ(q);
  else if (act === 'slow' && q) playQ(q, true);
  else if (act === 'check' && q && !q.answered) { if (q.kind === 'serie') checkSerie(q); else if (q.kind === 'armar') checkArmar(q); else if (q.kind === 'escribir') checkEscribir(q); }
  else if (act === 'nose' && q && !q.answered && q.kind === 'escribir') checkEscribir(q, true);
  else if (act === 'clear' && q && !q.answered && q.kind === 'armar') { q.placed = []; $('#build').innerHTML = buildHtml(q); $('#bank').innerHTML = bankHtml(q); $('#check').disabled = true; }
  else if (act === 'next' && q) next();
  else if (act === 'again' && G) { start(G.mode, G.id); window.scrollTo({top:0}); }
});
document.addEventListener('toggle', e => {
  if (!e.target || e.target.id !== 'help' || !G) return;
  if (e.target.open !== G.helpOpen) G.helpPinned = e.target.open;
  G.helpOpen = e.target.open;
}, true);
document.addEventListener('input', e => {
  if (e.target && e.target.id === 'resp') { const b = $('#check'); if (b) b.disabled = !e.target.value.trim(); }
});
document.addEventListener('keydown', e => {
  if (view !== 'game' || !G || e.altKey || e.ctrlKey || e.metaKey) return;
  const q = G.items[G.i];
  if (e.target && e.target.id === 'resp') {
    if (e.key === 'Enter' && !e.isComposing && !q.answered) { checkEscribir(q); e.preventDefault(); }
    return;
  }
  if (/^[1-5]$/.test(e.key) && q.opts && !q.answered && q.kind !== 'serie') { answer(Number(e.key) - 1); e.preventDefault(); }
  else if (e.key === 'Enter' && q.answered) { const nx = $('#next'); if (nx && document.activeElement !== nx) { next(); e.preventDefault(); } }
});

renderHome();
initTTS();
initSync();
})();
</script>
</body>
